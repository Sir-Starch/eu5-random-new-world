[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "eu5-random-new-world"
version = "0.12.7"
description = "Procedurally generated New Worlds for Europa Universalis V"
readme = "README.md"
requires-python = ">=3.12"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sir Starch", email = "starch@sirstarch.com" }]
keywords = ["europa-universalis-v", "eu5", "paradox", "mod", "procedural-generation", "map-generator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
    "Private :: Do Not Upload",
]
dependencies = [
    "numpy>=2.1,<3",
    "pillow>=11,<14",
    "typer>=0.16,<1",
]

[project.urls]
Homepage = "https://github.com/Sir-Starch/eu5-random-new-world"
Documentation = "https://github.com/Sir-Starch/eu5-random-new-world/tree/main/docs"
Issues = "https://github.com/Sir-Starch/eu5-random-new-world/issues"
Changelog = "https://github.com/Sir-Starch/eu5-random-new-world/blob/main/CHANGELOG.md"

[project.scripts]
rnw = "rnw.cli:app"

[project.gui-scripts]
rnw-gui = "rnw.gui.__main__:main"

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "pytest>=8,<10",
    "ruff>=0.13,<1",
    { include-group = "gui" },
]
# The window of the generator application (ADR 0007); the generator and the command line need none of it.
gui = ["pyside6-essentials>=6.8,<7"]
packaging = [
    "pyinstaller>=6.10,<7",
]

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "rnw._native"
profile = "release"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "native/Cargo.toml" },
    { file = "native/Cargo.lock" },
    { file = "native/src/**/*.rs" },
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "ISC001", "T201", "CPY001"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Tests compare texts in every script of the game's languages (RUF001).
"tests/**" = ["S101", "PLR2004", "SLF001", "RUF001"]
# Scripts for the packaging jobs, run by path rather than imported.
"packaging/**" = ["INP001"]
# Letters of other scripts that look like Latin ones are what these modules write.
"src/rnw/{translit,wording,messages}.py" = ["RUF001"]
"src/rnw/gui/text.py" = ["RUF001"]

[tool.basedpyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "all"
# Windows-only and POSIX-only code is checked on every platform, so CI agrees on both.
pythonPlatform = "All"
include = ["src", "tests", "packaging"]
# The packaging scripts are run by path; their tests import them from there.
extraPaths = ["src", "packaging"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packaging"]
