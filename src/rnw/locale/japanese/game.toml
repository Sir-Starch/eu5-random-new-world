["rnw_formation_restoration_desc"]
source = "744415b1555053f9"
text = '''かつてこの地を治めた王国があったが、やがてその後継者たちの間で分裂した。彼らは今もその王国を覚えている。旧領の十分な部分を押さえ、そこに首都を置く後継者は、王国を再興し、残りの地をも自らのものと主張できる。すなわち{name}である。ほかの後継者たちは、この再興を認めるか、異を唱えねばならない。'''

["STATIC_MODIFIER_NAME_rnw_restoration_heirs"]
source = "02fcf0134a6e1a2c"
text = '''旧王国の後継者'''

["STATIC_MODIFIER_DESC_rnw_restoration_heirs"]
source = "3841570bacb1bb5a"
text = '''再興された王冠は旧来の官職を取りまとめ、失われた州を再び一つの支配の下に戻す。'''

["rnw_restoration_heirs_tt"]
source = "14637a30b3e66320"
text = '''旧王国のほかのすべての後継者は、この再興を認めるか、異を唱えねばならない。'''

["rnw_restoration.title"]
source = "4e9f16af60fc9717"
text = '''旧王国の再興'''

["rnw_restoration.desc"]
source = "3862bfaf3cd1696c"
text = '''[restorer.GetNameWithNoTooltip]の使節が布告を携えてやって来た。我らの祖先が共にしていた王国は再興され、その新たな王冠はかつて王国が領したすべての地を、我らの地も含めて自らのものと称している。我らの評議会は、旧き名にひれ伏すか、それを拒むかを決めねばならない。'''

["rnw_restoration.a"]
source = "8de73f015f26ce75"
text = '''再興された王冠を認める。'''

["rnw_restoration.b"]
source = "5b9a238653e7fbf8"
text = '''旧き王冠は我らのものでもあり、彼らだけのものではない。'''

["rnw_memory.lost_land.title"]
source = "6d03784bc71649e4"
text = '''[target_location.GetNameWithNoTooltip]の喪失'''

["rnw_memory.lost_land.desc"]
source = "313947eafa71e8c2"
text = '''[partner.GetNameWithNoTooltip]が祖父たちの代に奪ったにもかかわらず、長老たちは今も[target_location.GetNameWithNoTooltip]の畑を我らのものと呼ぶ。若者たちは、その喪失が永遠に続かねばならないのかと問う。'''

["rnw_memory.lost_land.a"]
source = "515594395bbab00e"
text = '''我らのものだった地は、再び我らのものとなる。'''

["rnw_memory.lost_land.b"]
source = "6211a94e051ab224"
text = '''古い傷は癒えるに任せよう。'''

["rnw_memory.old_pact.title"]
source = "11c48fbce58796de"
text = '''古き盟約'''

["rnw_memory.old_pact.desc"]
source = "27565aab96e7c826"
text = '''かつて我らの民と[partner.GetNameWithNoTooltip]は互いに支え合うことを誓い、その誓いを守った。その使節が、古い約束がいまだ我らを縛るのかを問いにやって来た。'''

["rnw_memory.old_pact.a"]
source = "b94ae141c5a67bf2"
text = '''古い約束は今も我らを縛っている。'''

["rnw_memory.old_pact.b"]
source = "deae4afc797b2fb4"
text = '''あの約束は祖父たちのもので、我らのものではない。'''

["rnw_memory.kin.title"]
source = "6c53f1166e3b144c"
text = '''国境の向こうの同胞'''

["rnw_memory.kin.desc"]
source = "7025ad0a09571fe0"
text = '''遠い昔、我らの民の家族は我らの地と[partner.GetNameWithNoTooltip]の間を移り住み、[target_location.GetNameWithNoTooltip]に根を下ろした。その子孫たちは今も互いを覚えており、両者を結ぶ道を開いたままにしてほしいと願っている。'''

["rnw_memory.kin.a"]
source = "e63fcfb7dc836c71"
text = '''我らの門は同胞に開かれている。'''

["rnw_memory.kin.b"]
source = "bd82b91057f1971b"
text = '''彼らは別の地を選んだのだ。そこに留まらせよう。'''

["rnw_memory.shrine.title"]
source = "af02fa220fb67956"
text = '''[target_location.GetNameWithNoTooltip]への巡礼者'''

["rnw_memory.shrine.desc"]
source = "8079fdc623e79727"
text = '''幾世代にもわたり、我らの巡礼者は[partner.GetNameWithNoTooltip]が与える平和のもとで[target_location.GetNameWithNoTooltip]の聖所へと歩んできた。今、我らの祭司の一部は、聖地がよそ者のものであってはならないと言う。'''

["rnw_memory.shrine.a"]
source = "501fa6cb9698be73"
text = '''聖所の平和を尊重する。'''

["rnw_memory.shrine.b"]
source = "20bde48b4bda8b21"
text = '''聖所は我らのものであるべきだ。'''

["rnw_memory.heir.title"]
source = "42df00d9ae3f528e"
text = '''旧王国の記憶'''

["rnw_memory.heir.desc"]
source = "1b8d09cdc1575552"
text = '''我らの年代記作者は、我らの地が隣国とともに、[target_location.GetNameWithNoTooltip]に座す一つの王冠のもとにあった日々を語り継ぐ。その王国はもはやないが、忘れられてはいない。旧領を十分に集めた者は、それを再興できる。'''

["rnw_memory.heir.a"]
source = "6dfe52d00f4856ad"
text = '''我らは旧王国を再興する。'''

["rnw_memory.heir.b"]
source = "981a1c5531732d0e"
text = '''旧王国はもうない。安らかに眠らせよう。'''

["rnw_reform_river_markets"]
source = "c98e0101001dfd1a"
text = '''河川市場の特許状'''

["rnw_reform_river_markets_desc"]
source = "07319bc21fe9bfb3"
text = '''川沿いの町々は一つの特許状のもとで交易し、その商人たちは川の全流域を行き来する。'''

["rnw_reform_valley_council"]
source = "7fe79434140a15d2"
text = '''谷々の評議会'''

["rnw_reform_valley_council_desc"]
source = "ebe81586e732414b"
text = '''あらゆる谷の首長が一つの評議会に席を連ね、全員が同意するまで何事も決まらない。'''

["rnw_reform_port_council"]
source = "229cf1f8d7a5629c"
text = '''港湾評議会'''

["rnw_reform_port_council_desc"]
source = "b1b09e8b01fe91dc"
text = '''あらゆる港の商家が共に同盟を治め、その船は彼らの品をあらゆる岸辺へ運ぶ。'''

["rnw_reform_one_people"]
source = "fd6c4d4b18166d99"
text = '''一つの民の法'''

["rnw_reform_one_people_desc"]
source = "82e5c34f269f9d61"
text = '''一つの法が共同体の諸民を結び、その多くの町の間に平和を保つ。'''

["rnw_reform_realm_provinces"]
source = "041fbf884f30138c"
text = '''王国の諸州'''

["rnw_reform_realm_provinces_desc"]
source = "6d2906868d241c91"
text = '''王国は総督の治める諸州に分けられ、その町々は彼らの庇護のもとで成長する。'''

["rnw_reform_national_articles"]
source = "03468bdf1a6efa04"
text = '''国家の条項'''

["rnw_reform_national_articles_desc"]
source = "67501e96229f51f7"
text = '''成文の条項が国家の諸邦と、それらを代表して語る議会とを結びつける。'''

["rnw_reform_restored_crown"]
source = "c8fe56425fcf3bb3"
text = '''再興された王冠の法'''

["rnw_reform_restored_crown_desc"]
source = "4d83a205137e54bb"
text = '''再興された王冠は先代の旧き権利を取り戻し、再び一つの座から統治する。'''

["rnw_decline.1.title"]
source = "3dd1b7659844a1e4"
text = '''[target_location.GetNameWithNoTooltip]の黄昏'''

["rnw_decline.1.desc"]
source = "c5fae87ab12e8259"
text = '''[target_location.GetNameWithNoTooltip]はかつて、周囲のあらゆる谷を治めた王国の都であった。その王国は遠い昔に分裂した。壮大な宮殿は半ば空き、外縁の街区は森に還り、そこを守ってきた家々はより新しい町へと去っていく。\n\n町の長老たちは問う。この町を再び偉大にするのか、それとも安全であればよいのか、と。'''

["rnw_decline.1.a"]
source = "ebec51f47bb012d8"
text = '''古い宮殿を再建し、家々を呼び戻す。'''

["rnw_decline.1.b"]
source = "2822afffd76cf9be"
text = '''町の中心を城壁で囲み、残りは見捨てる。'''

["rnw_decline.2.title"]
source = "f07c4c037a05e3eb"
text = '''新たな黄金時代'''

["rnw_decline.2.desc"]
source = "fe3cb50f1780e463"
text = '''[target_location.GetNameWithNoTooltip]の宮殿は再び人で満ちた。職人たちは古い段丘で働き、巡礼者たちは祖先の築いたものを見に訪れる。宮廷の一部は、この町がかつてのように国を導くべきだと言う。'''

["rnw_decline.2.a"]
source = "52923b04d9eac118"
text = '''町に再び先頭に立たせよう。'''

["rnw_decline.2.b"]
source = "e221439368027a4b"
text = '''町が蘇っただけで満足しよう。'''

["rnw_decline.3.title"]
source = "c2c80a4020d94373"
text = '''[target_location.GetNameWithNoTooltip]を覆う影'''

["rnw_decline.3.desc"]
source = "9088c57e95aede13"
text = '''新たな城壁の内側で、[target_location.GetNameWithNoTooltip]は安全だが、年ごとに小さくなっていく。外の空いた街区は畑と藪になり、旅人たちはこの町を守備隊のいる廃墟と呼ぶ。'''

["rnw_decline.3.a"]
source = "6e51bbc634b77e3d"
text = '''城壁にはそれだけの価値があった。'''

["rnw_decline.3.b"]
source = "a49ba0633c7d61c0"
text = '''空いた街区に入植者を招く。'''

["STATIC_MODIFIER_NAME_rnw_decline_rebuilding"]
source = "ed85686f202140d9"
text = '''古い宮殿の再建'''

["STATIC_MODIFIER_DESC_rnw_decline_rebuilding"]
source = "e9c2af8b2b9fc5fc"
text = '''石工と家々が旧都の宮殿に戻ってくる。'''

["STATIC_MODIFIER_NAME_rnw_decline_fortified"]
source = "78040151a1a67f82"
text = '''城壁に囲まれた中心'''

["STATIC_MODIFIER_DESC_rnw_decline_fortified"]
source = "57cf3f4fa3374287"
text = '''旧都の中心は城壁に囲まれ、守備隊が置かれている。'''

["STATIC_MODIFIER_NAME_rnw_decline_golden_age"]
source = "145441a99b625ab8"
text = '''旧都、再び先頭に'''

["STATIC_MODIFIER_DESC_rnw_decline_golden_age"]
source = "cf3b7ff492ed1a96"
text = '''蘇った町は、国中から職人と学者と貢ぎ物を引き寄せる。'''

["STATIC_MODIFIER_NAME_rnw_decline_shadow"]
source = "296709711159011b"
text = '''守備隊のいる廃墟'''

["STATIC_MODIFIER_DESC_rnw_decline_shadow"]
source = "11a730ce7bb2fe79"
text = '''旅人たちは旧都を、かつての姿の影と呼ぶ。'''

["STATIC_MODIFIER_NAME_rnw_decline_resettled"]
source = "8274df482f4588de"
text = '''空いた街区の入植者'''

["STATIC_MODIFIER_DESC_rnw_decline_resettled"]
source = "5ea7a09878b27a82"
text = '''新たな家々が旧都の空いた街区を満たしていく。'''

["rnw_council.1.title"]
source = "b4e7094533513141"
text = '''大評議会'''

["rnw_council.1.desc"]
source = "e8fa63c6638665fc"
text = '''我らの連合に属するあらゆる民の首長が、大評議会のために[target_location.GetNameWithNoTooltip]に集まった。古き法によれば、全員が同意するまで何事も決まらない。そして今年は、合意すべきことが多い。\n\n我らの首長は、評議会に一つのゆるやかな声で語らせることもできるし、自ら真っ先に、最も声高に語ることもできる。'''

["rnw_council.1.a"]
source = "0503a3f754419f6f"
text = '''評議会に共に決めさせよう。'''

["rnw_council.1.b"]
source = "3d0cadb02d62b4d3"
text = '''我らの声が評議会を導く。'''

["rnw_council.2.title"]
source = "bdd492090bb9debb"
text = '''新たな使節団'''

["rnw_council.2.desc"]
source = "c98b72faac08d982"
text = '''国境の向こうの民が、[target_location.GetNameWithNoTooltip]の評議会に使節団を送ってきた。その使節たちは、首長の間に席を得て、連合の法を自らの法として守ることを願っている。'''

["rnw_council.2.a"]
source = "567fa5f1e3a6044d"
text = '''炉端に彼らの席を設けよ。'''

["rnw_council.2.b"]
source = "9471fe0792fa23db"
text = '''評議会に空席はない。'''

["rnw_council.3.title"]
source = "874b725a727a0a9b"
text = '''首長たちの怒り'''

["rnw_council.3.desc"]
source = "5c3955cce944b26b"
text = '''評議会で言葉を遮られた首長たちは、怒りを抱いて[target_location.GetNameWithNoTooltip]から帰っていった。連合を離れると口にする者もいる。'''

["rnw_council.3.a"]
source = "c44abb77c015f05c"
text = '''すべての首長に贈り物を送る。'''

["rnw_council.3.b"]
source = "514be8b6eec366bf"
text = '''彼らの怒りはいずれ収まる。'''

["STATIC_MODIFIER_NAME_rnw_council_peace"]
source = "4315d2c7eee55c49"
text = '''評議会の一つの声'''

["STATIC_MODIFIER_DESC_rnw_council_peace"]
source = "2d412c8f4e3f1d44"
text = '''首長たちは共に、ゆっくりと決め、その民は決めたことを守る。'''

["STATIC_MODIFIER_NAME_rnw_council_assertive"]
source = "44e0dd172a716cae"
text = '''退けられた評議会'''

["STATIC_MODIFIER_DESC_rnw_council_assertive"]
source = "c126f271e8ab388a"
text = '''我らの首長が評議会を代弁し、ほかの首長たちはそれを恨んでいる。'''

["rnw_senior.1.title"]
source = "8a0392279a2c60ed"
text = '''同盟の均衡'''

["rnw_senior.1.desc"]
source = "c60827cfe5e974c4"
text = '''一世代にわたり、我らの宮廷とその同盟国は共に立ち、いかなる隣国もそれを試そうとはしなかった。今や我らの宮廷は誰よりも強く、貴族たちは問う。なぜあらゆる戦いの戦利品を[target_country.GetName]と等しく分けねばならぬのか、と。'''

["rnw_senior.1.a"]
source = "a42b01208b4b1ada"
text = '''我らが同盟の筆頭の座に就く。'''

["rnw_senior.1.b"]
source = "5300de972d911391"
text = '''我らは対等に並び立ってきた。これからもそうあり続ける。'''

["rnw_senior.2.title"]
source = "aada9ff26807d3c0"
text = '''格下の盟友の抗議'''

["rnw_senior.2.desc"]
source = "56f863fcfc28ea25"
text = '''[target_country.GetName]の使節は、彼らの戦士が我らの戦士と並んで血を流したことを宮廷に思い起こさせる。彼らは貢ぎ物の等しい分け前を求め、さもなくば同盟を考え直すという。'''

["rnw_senior.2.a"]
source = "57b81bcae2e47aef"
text = '''彼らに貢ぎ物の分け前を与えよ。'''

["rnw_senior.2.b"]
source = "2e41afb4ddc50636"
text = '''我らが彼らを必要とする以上に、彼らは我らを必要としている。'''

["rnw_senior.3.title"]
source = "f33618a6e39b1ac4"
text = '''対等な者同士の贈り物'''

["rnw_senior.3.desc"]
source = "31a432876c7d6948"
text = '''[target_country.GetName]の宮廷は古い同盟を称えて贈り物を送り、我らの宮廷が何を返すかを待っている。'''

["rnw_senior.3.a"]
source = "eebec55c40a0fd41"
text = '''さらに豪華な贈り物で返礼する。'''

["rnw_senior.3.b"]
source = "8c56d76df18a23e8"
text = '''感謝の言葉で十分だ。'''

["rnw_nation.1.title"]
source = "be38d247de5f8725"
text = '''代表者会議'''

["rnw_nation.1.desc"]
source = "454f7eca77815ade"
text = '''新たな国のあらゆる町の代表者が、国の治め方を決めるために[target_location.GetNameWithNoTooltip]に集まった。自由な町々の共和国を望む者もいれば、若い国をまとめるには王冠が必要だと言う者もいる。'''

["rnw_nation.1.a"]
source = "dac2a7edd2cc8b83"
text = '''自由な町々の共和国を。'''

["rnw_nation.1.b"]
source = "7ab2b89252812153"
text = '''国をまとめる王冠を。'''

["rnw_nation.2.title"]
source = "16ff1ee78d2287cd"
text = '''辺境条例'''

["rnw_nation.2.desc"]
source = "837b55fe72b75d71"
text = '''[target_location.GetNameWithNoTooltip]の議会は、入植の進んだ海岸の向こうの土地をどうするかを決めねばならない。測量士たちはそれを測り、売り、道で結ぼうとする。一方、その地はそこに住む民のものだと言う者もいる。'''

["rnw_nation.2.a"]
source = "a66b4892ba0f52a4"
text = '''辺境を測量し、そこへ道を通す。'''

["rnw_nation.2.b"]
source = "d89dfe8abb0da82d"
text = '''辺境はその民に委ねる。'''

["rnw_nation.3.title"]
source = "e0d3ebbd474754be"
text = '''国のための王冠'''

["rnw_nation.3.desc"]
source = "b44240c9bf06e2fa"
text = '''代表者たちは王冠を選んだ。[target_location.GetNameWithNoTooltip]の新たな宮廷は、誰に報いるかを決めねばならない。町々の創設者か、それとも海の向こうから来た旧家か。'''

["rnw_nation.3.a"]
source = "a8122d8c264b7555"
text = '''町々の創設者に報いる。'''

["rnw_nation.3.b"]
source = "08d05dbcb8725972"
text = '''旧家を称える。'''

["STATIC_MODIFIER_NAME_rnw_nation_roads"]
source = "69bccd5fa130c0bd"
text = '''辺境への道'''

["STATIC_MODIFIER_DESC_rnw_nation_roads"]
source = "671d8ac3385e6289"
text = '''測量士と道路の建設者が、国の道を入植の進んだ海岸の先へと延ばしていく。'''

["rnw_naming.title"]
source = "82708204008b5b60"
text = '''新国家の名'''

["rnw_naming.desc"]
source = "360aafa7c1166035"
text = '''新たな国家には、隣国に知られるための名が要る。宮廷の一部は建国の際に掲げた名を好み、ほかの者は今治める土地にちなんで名づけたいと考えている。'''

["rnw_naming.keep"]
source = "83549dc6c7c223ec"
text = '''名を保つ：{name}。'''

["rnw_naming.take"]
source = "0eff740f9b97f82f"
text = '''名を改める：{name}。'''

["rnw_formation_two_shores_name"]
source = "3bc268bf8490e630"
text = '''両岸帝国'''

["rnw_formation_two_shores_name_adj"]
source = "400671422a0de267"
text = '''両岸'''

["rnw_formation_two_worlds_name"]
source = "2f85382541be3bad"
text = '''両世界王冠国'''

["rnw_formation_two_worlds_name_adj"]
source = "1349ccd918705484"
text = '''両世界'''

["rnw_formation_two_oceans_name"]
source = "13126384cc6effe8"
text = '''両洋帝国'''

["rnw_formation_two_oceans_name_adj"]
source = "00f9e76a2534af31"
text = '''両洋'''

["rnw_formation_two_peoples_name"]
source = "be9e07854a4e2e6b"
text = '''二民族王国'''

["rnw_formation_two_peoples_name_adj"]
source = "aab153dd88cc8043"
text = '''二民族'''

["rnw_formation_two_shores_desc"]
source = "473b50435cb358d9"
text = '''この大陸の民で、大洋の彼方を治めた者はいまだかつていない。大陸の民による勢力で、遠い岸辺に領地を持ち、故郷の大陸の多くを押さえる者は、両岸の帝国を宣言できる。すなわち{name}である。'''

["STATIC_MODIFIER_NAME_rnw_two_shores_voyagers"]
source = "dec7efd625ab7d44"
text = '''遠き岸への航海者'''

["STATIC_MODIFIER_DESC_rnw_two_shores_voyagers"]
source = "b17650f2a8d54598"
text = '''我らの船は大洋を渡り、いかなる祖先も知らなかった地へ向かう。'''

["rnw_formation_two_worlds_desc"]
source = "8933a92bcf6a6335"
text = '''古い国の宮廷が大洋を渡ってこの大陸に居を移したが、かつての故国は今もそれに従っている。大洋の両側を治め、ここに首都を置く王冠は、両世界を一つの王冠のもとに宣言できる。すなわち{name}である。'''

["STATIC_MODIFIER_NAME_rnw_two_worlds_union"]
source = "9bb6203ca44ee2f1"
text = '''一つの王冠、二つの世界'''

["STATIC_MODIFIER_DESC_rnw_two_worlds_union"]
source = "ec15c579d765b459"
text = '''旧き故国と新たな宮廷は同じ王冠に従う。'''

["rnw_formation_two_oceans_desc"]
source = "287d1ce2e64d72e3"
text = '''この大陸は二つの大洋の間に横たわり、両方を航海した勢力はいまだない。両方に港を持ち、その間の土地の多くを押さえる者は、両洋の帝国を宣言できる。すなわち{name}である。'''

["STATIC_MODIFIER_NAME_rnw_two_oceans_sea_power"]
source = "5240aa554bdc6edf"
text = '''両洋の覇者'''

["STATIC_MODIFIER_DESC_rnw_two_oceans_sea_power"]
source = "5997155c1a0aa978"
text = '''我らの艦隊が両洋の航路を守る。'''

["rnw_formation_great_law_desc"]
source = "984cd3a2649f2fa6"
text = '''連合の諸民は何世代にもわたり、それぞれの評議会を保ちながら一つの大いなる法のもとに暮らしてきた。彼らを導き、その地の十分な部分を押さえる首長は、その法のもとに彼らを一つの国家へと結びつけることができる。すなわち{name}である。'''

["STATIC_MODIFIER_NAME_rnw_great_law_league"]
source = "06e46ef8dffbd992"
text = '''大いなる法の民'''

["STATIC_MODIFIER_DESC_rnw_great_law_league"]
source = "ae42b7744b3395cf"
text = '''旧き連合の諸民は、一つの民として戦い、交易する。'''

["rnw_formation_two_peoples_desc"]
source = "7a91ebd282c9e756"
text = '''入植者とこの大陸の民は長く婚姻を結び、交易し、共に祈ってきた。もはやどこからどこまでがどちらとも言えない。両方の民を自らの民とし、大陸の多くを押さえる国家は、二つの民の王国を宣言できる。すなわち{name}である。'''

["STATIC_MODIFIER_NAME_rnw_two_peoples_integration"]
source = "0fd80ff5371517ee"
text = '''二つの民、一つの王国'''

["STATIC_MODIFIER_DESC_rnw_two_peoples_integration"]
source = "77bf4dd8870d78b3"
text = '''王国は両方の民を自らの民とし、その慣習を受け入れる。'''
