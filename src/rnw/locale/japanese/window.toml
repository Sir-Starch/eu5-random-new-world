["estimate_tip"]
source = "34f3f38a503b4cdc"
text = "EU5では、ロケーションには陸上州だけでなく世界中の海域や湖も含まれます（約22,000個は固定の旧世界に属します）。\n\nゲームエンジンは16ビットのインデックス（最大約32,767）を使用しているため、クラッシュを防ぐため生成器は合計を31,200未満に抑えます。\n\n「陸地多め」を選ぶとロケーション数が減る場合がある理由：\n海域もロケーションとしてカウントされます。陸地が増えると海洋面積が減り（海域ロケーションが減少）、また巨大な陸地ではエンジン上限を超えないよう陸地マスのサイズが自動的に拡大されます。その結果、合計数が減少することがありますが、これは正常な予算調整であり不具合ではありません。"

