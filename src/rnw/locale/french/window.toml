["estimate_tip"]
source = "34f3f38a503b4cdc"
text = "Dans EU5, les lieux comprennent les provinces terrestres, les zones maritimes et les lacs du monde entier (~22 000 appartiennent à l'Ancien Monde inchangé).\n\nLe moteur utilise un index 16 bits (~32 767 au maximum). Pour éviter les plantages, le générateur reste prudemment sous 31 200.\n\nPourquoi « beaucoup de terres » peut afficher moins de lieux :\nLes zones maritimes sont aussi des lieux. Plus de terre signifie moins d'océan (moins de zones maritimes), et la taille des cellules terrestres augmente automatiquement pour les grandes masses afin de respecter la limite. Le total peut donc diminuer ; c'est un équilibrage normal et non une erreur."

