["group.resources.about"]
source = "fc2206254ef4d13c"
text = "Poids relatifs de placement : 1× reprend les fréquences du jeu de base ; 0 retire une ressource. Le climat et le relief guident toujours le placement. Plus d’une ressource laisse moins de lieux aux autres ; la production par lieu reste inchangée. La génération s’arrête si aucune ressource activée ne convient à un lieu."

