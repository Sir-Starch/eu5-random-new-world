["estimate_tip"]
source = "34f3f38a503b4cdc"
text = "W EU5 lokacje obejmują prowincje lądowe, strefy morskie oraz jeziora na całym świecie (~22 000 przypada na niezmieniony Stary Świat).\n\nSilnik korzysta z 16-bitowego indeksu (maksymalnie ~32 767). Aby zapobiec awariom, generator utrzymuje łączną liczbę bezpiecznie poniżej 31 200.\n\nDlaczego przy wyborze „dużo lądu” liczba lokacji może spaść:\nStrefy morskie to również lokacje. Więcej lądu oznacza mniejszą powierzchnię oceanu (mniej stref morskich), a rozmiar komórek lądowych jest automatycznie zwiększany przy dużych lądach, by nie przekroczyć limitu silnika. W rezultacie łączna liczba może być mniejsza — to normalne równoważenie budżetu, a nie błąd."

