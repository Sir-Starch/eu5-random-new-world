["rnw_formation_restoration_desc"]
source = "744415b1555053f9"
text = '''Niegdyś te ziemie trzymało królestwo, aż rozpadło się między swoich spadkobierców, którzy wciąż je pamiętają. Spadkobierca, który trzyma dość jego dawnych ziem i ma na nich stolicę, może je odrodzić i uznać resztę za swoją: {name}. Pozostali spadkobiercy muszą uznać odrodzenie albo je zakwestionować.'''

["STATIC_MODIFIER_NAME_rnw_restoration_heirs"]
source = "02fcf0134a6e1a2c"
text = '''Spadkobiercy dawnego królestwa'''

["STATIC_MODIFIER_DESC_rnw_restoration_heirs"]
source = "3841570bacb1bb5a"
text = '''Odrodzona korona gromadzi dawne urzędy i przywraca utracone prowincje pod jedną władzę.'''

["rnw_restoration_heirs_tt"]
source = "14637a30b3e66320"
text = '''Każdy inny spadkobierca dawnego królestwa musi uznać odrodzenie albo je zakwestionować.'''

["rnw_restoration.title"]
source = "4e9f16af60fc9717"
text = '''Dawne królestwo odrodzone'''

["rnw_restoration.desc"]
source = "3862bfaf3cd1696c"
text = '''Posłowie państwa [restorer.GetNameWithNoTooltip] przybyli z proklamacją: królestwo, które dzielili nasi przodkowie, zostało odrodzone, a jego nowa korona uznaje za swoje wszystkie ziemie, które niegdyś trzymało, również nasze. Nasza rada musi zdecydować, czy pokłonić się dawnemu imieniu, czy je odrzucić.'''

["rnw_restoration.a"]
source = "8de73f015f26ce75"
text = '''Uznajemy odrodzoną koronę.'''

["rnw_restoration.b"]
source = "5b9a238653e7fbf8"
text = '''Dawna korona nie należy do nich bardziej niż do nas.'''

["rnw_memory.lost_land.title"]
source = "6d03784bc71649e4"
text = '''Utracona ziemia: [target_location.GetNameWithNoTooltip]'''

["rnw_memory.lost_land.desc"]
source = "313947eafa71e8c2"
text = '''Nasi starsi wciąż nazywają pola miejscowości [target_location.GetNameWithNoTooltip] naszymi, choć państwo [partner.GetNameWithNoTooltip] odebrało je naszym dziadom. Młodzi pytają, czy ta strata ma trwać na zawsze.'''

["rnw_memory.lost_land.a"]
source = "515594395bbab00e"
text = '''Co było nasze, znów będzie nasze.'''

["rnw_memory.lost_land.b"]
source = "6211a94e051ab224"
text = '''Niech stara rana się zabliźni.'''

["rnw_memory.old_pact.title"]
source = "11c48fbce58796de"
text = '''Dawny pakt'''

["rnw_memory.old_pact.desc"]
source = "27565aab96e7c826"
text = '''Nasz lud i [partner.GetNameWithNoTooltip] przysięgli niegdyś stać razem i dotrzymali słowa. Ich posłowie przybyli zapytać, czy dawna obietnica wciąż nas wiąże.'''

["rnw_memory.old_pact.a"]
source = "b94ae141c5a67bf2"
text = '''Dawna obietnica wciąż nas wiąże.'''

["rnw_memory.old_pact.b"]
source = "deae4afc797b2fb4"
text = '''Tę obietnicę złożyli nasi dziadowie, nie my.'''

["rnw_memory.kin.title"]
source = "6c53f1166e3b144c"
text = '''Krewni za granicą'''

["rnw_memory.kin.desc"]
source = "7025ad0a09571fe0"
text = '''Dawno temu rodziny naszego ludu przenosiły się między naszą ziemią a państwem [partner.GetNameWithNoTooltip] i osiadły w miejscowości [target_location.GetNameWithNoTooltip]. Ich dzieci wciąż o sobie pamiętają i proszą, by droga między nimi pozostała otwarta.'''

["rnw_memory.kin.a"]
source = "e63fcfb7dc836c71"
text = '''Nasze bramy są otwarte dla krewnych.'''

["rnw_memory.kin.b"]
source = "bd82b91057f1971b"
text = '''Wybrali inną ziemię; niech ją sobie zatrzymają.'''

["rnw_memory.shrine.title"]
source = "af02fa220fb67956"
text = '''Pielgrzymka: [target_location.GetNameWithNoTooltip]'''

["rnw_memory.shrine.desc"]
source = "8079fdc623e79727"
text = '''Od pokoleń nasi pielgrzymi wędrują do sanktuarium w miejscowości [target_location.GetNameWithNoTooltip], pod pokojem, którego udziela im państwo [partner.GetNameWithNoTooltip]. Niektórzy z naszych kapłanów mówią teraz, że święte miejsce nie powinno należeć do obcych.'''

["rnw_memory.shrine.a"]
source = "501fa6cb9698be73"
text = '''Szanować pokój sanktuarium.'''

["rnw_memory.shrine.b"]
source = "20bde48b4bda8b21"
text = '''Sanktuarium powinno być nasze.'''

["rnw_memory.heir.title"]
source = "42df00d9ae3f528e"
text = '''Pamięć o dawnym królestwie'''

["rnw_memory.heir.desc"]
source = "1b8d09cdc1575552"
text = '''Nasi kronikarze wspominają dni, gdy nasza ziemia była jednym z sąsiednimi pod jedną koroną z siedzibą w miejscowości [target_location.GetNameWithNoTooltip]. Tego królestwa już nie ma, ale nie zostało zapomniane, a kto zbierze dość jego dawnych ziem, może je odrodzić.'''

["rnw_memory.heir.a"]
source = "6dfe52d00f4856ad"
text = '''Odrodzimy dawne królestwo.'''

["rnw_memory.heir.b"]
source = "981a1c5531732d0e"
text = '''Dawnego królestwa już nie ma; niech spoczywa.'''

["rnw_reform_river_markets"]
source = "c98e0101001dfd1a"
text = '''Karta rzecznych targów'''

["rnw_reform_river_markets_desc"]
source = "07319bc21fe9bfb3"
text = '''Miasta nad rzeką handlują według jednej karty, a ich kupcy przemierzają cały jej bieg.'''

["rnw_reform_valley_council"]
source = "7fe79434140a15d2"
text = '''Rada dolin'''

["rnw_reform_valley_council_desc"]
source = "ebe81586e732414b"
text = '''Wodzowie wszystkich dolin zasiadają w jednej radzie i nic nie zostaje postanowione, dopóki wszyscy się nie zgodzą.'''

["rnw_reform_port_council"]
source = "229cf1f8d7a5629c"
text = '''Rada portów'''

["rnw_reform_port_council_desc"]
source = "b1b09e8b01fe91dc"
text = '''Domy kupieckie wszystkich portów wspólnie rządzą ligą, a jej statki wiozą ich towary do każdego brzegu.'''

["rnw_reform_one_people"]
source = "fd6c4d4b18166d99"
text = '''Prawo jednego ludu'''

["rnw_reform_one_people_desc"]
source = "82e5c34f269f9d61"
text = '''Jedno prawo wiąże ludy wspólnoty i strzeże pokoju między jej licznymi miastami.'''

["rnw_reform_realm_provinces"]
source = "041fbf884f30138c"
text = '''Prowincje królestwa'''

["rnw_reform_realm_provinces_desc"]
source = "6d2906868d241c91"
text = '''Królestwo jest podzielone na prowincje pod władzą namiestników, a jego miasta rosną pod ich opieką.'''

["rnw_reform_national_articles"]
source = "03468bdf1a6efa04"
text = '''Artykuły narodu'''

["rnw_reform_national_articles_desc"]
source = "67501e96229f51f7"
text = '''Spisane artykuły wiążą stany narodu i zgromadzenie, które przemawia w ich imieniu.'''

["rnw_reform_restored_crown"]
source = "c8fe56425fcf3bb3"
text = '''Prawo odrodzonej korony'''

["rnw_reform_restored_crown_desc"]
source = "4d83a205137e54bb"
text = '''Odrodzona korona odzyskuje dawne prawa swoich poprzedników i znów rządzi z jednej stolicy.'''

["rnw_decline.1.title"]
source = "3dd1b7659844a1e4"
text = '''Zmierzch miasta [target_location.GetNameWithNoTooltip]'''

["rnw_decline.1.desc"]
source = "c5fae87ab12e8259"
text = '''Miasto [target_location.GetNameWithNoTooltip] było niegdyś siedzibą królestwa, które rządziło wszystkimi okolicznymi dolinami. To królestwo dawno się rozpadło. Jego wielkie dwory stoją w połowie puste, zewnętrzne dzielnice zarasta las, a rodziny, które je zamieszkiwały, odchodzą do młodszych miast.\n\nStarszyzna miasta pyta, czy ma ono znów stać się wielkie, czy tylko bezpieczne.'''

["rnw_decline.1.a"]
source = "ebec51f47bb012d8"
text = '''Odbudować dawne dwory i wezwać rodziny z powrotem.'''

["rnw_decline.1.b"]
source = "2822afffd76cf9be"
text = '''Otoczyć murem serce miasta, a resztę porzucić.'''

["rnw_decline.2.title"]
source = "f07c4c037a05e3eb"
text = '''Nowy złoty wiek'''

["rnw_decline.2.desc"]
source = "fe3cb50f1780e463"
text = '''Dwory miasta [target_location.GetNameWithNoTooltip] znów są pełne. Rzemieślnicy pracują na dawnych tarasach, a pielgrzymi przychodzą zobaczyć, co zbudowali przodkowie. Niektórzy na dworze mówią, że miasto powinno teraz przewodzić krainie jak niegdyś.'''

["rnw_decline.2.a"]
source = "52923b04d9eac118"
text = '''Niech miasto znów przewodzi.'''

["rnw_decline.2.b"]
source = "e221439368027a4b"
text = '''Wystarczy, że miasto odbudowano.'''

["rnw_decline.3.title"]
source = "c2c80a4020d94373"
text = '''Cień nad miastem [target_location.GetNameWithNoTooltip]'''

["rnw_decline.3.desc"]
source = "9088c57e95aede13"
text = '''Za nowymi murami miasto [target_location.GetNameWithNoTooltip] jest bezpieczne i z każdym rokiem mniejsze. Puste dzielnice na zewnątrz stały się polami i zaroślami, a podróżni mówią o mieście jak o ruinie z załogą.'''

["rnw_decline.3.a"]
source = "6e51bbc634b77e3d"
text = '''Mury były tego warte.'''

["rnw_decline.3.b"]
source = "a49ba0633c7d61c0"
text = '''Zaprosić osadników do pustych dzielnic.'''

["STATIC_MODIFIER_NAME_rnw_decline_rebuilding"]
source = "ed85686f202140d9"
text = '''Odbudowa dawnych dworów'''

["STATIC_MODIFIER_DESC_rnw_decline_rebuilding"]
source = "e9c2af8b2b9fc5fc"
text = '''Kamieniarze i rodziny wracają na dwory dawnej siedziby.'''

["STATIC_MODIFIER_NAME_rnw_decline_fortified"]
source = "78040151a1a67f82"
text = '''Serce za murami'''

["STATIC_MODIFIER_DESC_rnw_decline_fortified"]
source = "57cf3f4fa3374287"
text = '''Serce dawnej siedziby otoczono murem i obsadzono załogą.'''

["STATIC_MODIFIER_NAME_rnw_decline_golden_age"]
source = "145441a99b625ab8"
text = '''Dawna siedziba znów przewodzi'''

["STATIC_MODIFIER_DESC_rnw_decline_golden_age"]
source = "cf3b7ff492ed1a96"
text = '''Odbudowane miasto przyciąga rzemieślników, uczonych i daninę z całej krainy.'''

["STATIC_MODIFIER_NAME_rnw_decline_shadow"]
source = "296709711159011b"
text = '''Ruina z załogą'''

["STATIC_MODIFIER_DESC_rnw_decline_shadow"]
source = "11a730ce7bb2fe79"
text = '''Podróżni mówią o dawnej siedzibie jak o cieniu tego, czym była.'''

["STATIC_MODIFIER_NAME_rnw_decline_resettled"]
source = "8274df482f4588de"
text = '''Osadnicy w pustych dzielnicach'''

["STATIC_MODIFIER_DESC_rnw_decline_resettled"]
source = "5ea7a09878b27a82"
text = '''Nowe rodziny wypełniają puste dzielnice dawnej siedziby.'''

["rnw_council.1.title"]
source = "b4e7094533513141"
text = '''Wielka Rada'''

["rnw_council.1.desc"]
source = "e8fa63c6638665fc"
text = '''Wodzowie wszystkich ludów naszej konfederacji zebrali się w miejscowości [target_location.GetNameWithNoTooltip] na Wielką Radę. Według dawnego prawa nic nie zostaje postanowione, dopóki wszyscy się nie zgodzą, a w tym roku mają wiele do uzgodnienia.\n\nNasz wódz może pozwolić radzie mówić jednym, powolnym głosem albo zabrać głos pierwszy i najgłośniej.'''

["rnw_council.1.a"]
source = "0503a3f754419f6f"
text = '''Niech rada decyduje wspólnie.'''

["rnw_council.1.b"]
source = "3d0cadb02d62b4d3"
text = '''Nasz głos poprowadzi radę.'''

["rnw_council.2.title"]
source = "bdd492090bb9debb"
text = '''Nowa delegacja'''

["rnw_council.2.desc"]
source = "c98b72faac08d982"
text = '''Lud zza naszych granic przysłał delegację na radę w miejscowości [target_location.GetNameWithNoTooltip]. Jego posłowie proszą o miejsce wśród wodzów i o prawo przestrzegania prawa konfederacji jak własnego.'''

["rnw_council.2.a"]
source = "567fa5f1e3a6044d"
text = '''Dajcie im miejsce przy ogniu.'''

["rnw_council.2.b"]
source = "9471fe0792fa23db"
text = '''W radzie nie ma już miejsc.'''

["rnw_council.3.title"]
source = "874b725a727a0a9b"
text = '''Wodzowie są rozgniewani'''

["rnw_council.3.desc"]
source = "5c3955cce944b26b"
text = '''Wodzowie, którym na radzie odebrano głos, rozjechali się w gniewie z miejscowości [target_location.GetNameWithNoTooltip]. Niektórzy mówią o opuszczeniu konfederacji.'''

["rnw_council.3.a"]
source = "c44abb77c015f05c"
text = '''Wysłać dary każdemu wodzowi.'''

["rnw_council.3.b"]
source = "514be8b6eec366bf"
text = '''Ich gniew minie.'''

["STATIC_MODIFIER_NAME_rnw_council_peace"]
source = "4315d2c7eee55c49"
text = '''Jeden głos rady'''

["STATIC_MODIFIER_DESC_rnw_council_peace"]
source = "2d412c8f4e3f1d44"
text = '''Wodzowie decydują wspólnie i powoli, a ich ludy dotrzymują postanowień.'''

["STATIC_MODIFIER_NAME_rnw_council_assertive"]
source = "44e0dd172a716cae"
text = '''Pominięta rada'''

["STATIC_MODIFIER_DESC_rnw_council_assertive"]
source = "c126f271e8ab388a"
text = '''Nasz wódz mówi w imieniu rady, a inni wodzowie mają mu to za złe.'''

["rnw_senior.1.title"]
source = "8a0392279a2c60ed"
text = '''Równowaga sojuszu'''

["rnw_senior.1.desc"]
source = "c60827cfe5e974c4"
text = '''Przez całe pokolenie nasz dwór i jego sojusznicy stali razem i żaden sąsiad nie ośmielił się ich wypróbować. Teraz nasz dwór jest najsilniejszy ze wszystkich, a nasza szlachta pyta, czemu łupy każdej wojny mamy dzielić po równo z państwem [target_country.GetName].'''

["rnw_senior.1.a"]
source = "a42b01208b4b1ada"
text = '''Zajmiemy pierwsze miejsce wśród sojuszników.'''

["rnw_senior.1.b"]
source = "5300de972d911391"
text = '''Staliśmy razem jak równi i tak pozostanie.'''

["rnw_senior.2.title"]
source = "aada9ff26807d3c0"
text = '''Młodszy sojusznik protestuje'''

["rnw_senior.2.desc"]
source = "56f863fcfc28ea25"
text = '''Posłowie państwa [target_country.GetName] przypominają naszemu dworowi, że ich wojownicy przelewali krew u boku naszych. Proszą o równą część daniny, w przeciwnym razie przemyślą sojusz.'''

["rnw_senior.2.a"]
source = "57b81bcae2e47aef"
text = '''Dajcie im ich część daniny.'''

["rnw_senior.2.b"]
source = "2e41afb4ddc50636"
text = '''Potrzebują nas bardziej niż my ich.'''

["rnw_senior.3.title"]
source = "f33618a6e39b1ac4"
text = '''Dary między równymi'''

["rnw_senior.3.desc"]
source = "31a432876c7d6948"
text = '''Dwór państwa [target_country.GetName] przysłał dary na cześć dawnego sojuszu i czeka, co nasz dwór przyśle w zamian.'''

["rnw_senior.3.a"]
source = "eebec55c40a0fd41"
text = '''Odwzajemnić się jeszcze bogatszymi darami.'''

["rnw_senior.3.b"]
source = "8c56d76df18a23e8"
text = '''Wystarczy nasze podziękowanie.'''

["rnw_nation.1.title"]
source = "be38d247de5f8725"
text = '''Zgromadzenie delegatów'''

["rnw_nation.1.desc"]
source = "454f7eca77815ade"
text = '''Delegaci wszystkich miast nowego narodu zebrali się w miejscowości [target_location.GetNameWithNoTooltip], by zdecydować, jak ma być rządzony. Jedni chcą republiki wolnych miast; inni mówią, że młody naród potrzebuje korony, która utrzyma go razem.'''

["rnw_nation.1.a"]
source = "dac2a7edd2cc8b83"
text = '''Republika wolnych miast.'''

["rnw_nation.1.b"]
source = "7ab2b89252812153"
text = '''Korona, która utrzyma naród razem.'''

["rnw_nation.2.title"]
source = "16ff1ee78d2287cd"
text = '''Rozporządzenie o pograniczu'''

["rnw_nation.2.desc"]
source = "837b55fe72b75d71"
text = '''Zgromadzenie w miejscowości [target_location.GetNameWithNoTooltip] musi zdecydować, co stanie się z ziemią za zasiedlonym wybrzeżem. Mierniczowie chcą ją wymierzyć, sprzedać i połączyć drogami; inni mówią, że należy do ludów, które tam żyją.'''

["rnw_nation.2.a"]
source = "a66b4892ba0f52a4"
text = '''Wymierzyć pogranicze i poprowadzić w nie drogi.'''

["rnw_nation.2.b"]
source = "d89dfe8abb0da82d"
text = '''Zostawić pogranicze jego ludom.'''

["rnw_nation.3.title"]
source = "e0d3ebbd474754be"
text = '''Korona dla narodu'''

["rnw_nation.3.desc"]
source = "b44240c9bf06e2fa"
text = '''Delegaci wybrali koronę, a nowy dwór w miejscowości [target_location.GetNameWithNoTooltip] musi zdecydować, kogo nagrodzi: założycieli miast czy stare rody, które przybyły zza morza.'''

["rnw_nation.3.a"]
source = "a8122d8c264b7555"
text = '''Nagrodzić założycieli miast.'''

["rnw_nation.3.b"]
source = "08d05dbcb8725972"
text = '''Uczcić stare rody.'''

["STATIC_MODIFIER_NAME_rnw_nation_roads"]
source = "69bccd5fa130c0bd"
text = '''Drogi na pogranicze'''

["STATIC_MODIFIER_DESC_rnw_nation_roads"]
source = "671d8ac3385e6289"
text = '''Mierniczowie i budowniczowie dróg prowadzą drogi narodu poza zasiedlone wybrzeże.'''

["rnw_naming.title"]
source = "82708204008b5b60"
text = '''Imię dla nowego państwa'''

["rnw_naming.desc"]
source = "360aafa7c1166035"
text = '''Nowe państwo potrzebuje imienia, pod którym poznają je sąsiedzi. Jedni na dworze wolą imię, pod którym je ogłoszono; inni nazwaliby je od ziemi, którą teraz rządzi.'''

["rnw_naming.keep"]
source = "83549dc6c7c223ec"
text = '''Zachować imię: {name}.'''

["rnw_naming.take"]
source = "0eff740f9b97f82f"
text = '''Przyjąć imię: {name}.'''

["rnw_formation_two_shores_name"]
source = "3bc268bf8490e630"
text = '''Cesarstwo Dwóch Brzegów'''

["rnw_formation_two_shores_name_adj"]
source = "400671422a0de267"
text = '''Zaoceańs'''

["rnw_formation_two_worlds_name"]
source = "2f85382541be3bad"
text = '''Korona Dwóch Światów'''

["rnw_formation_two_worlds_name_adj"]
source = "1349ccd918705484"
text = '''Transatlantyc'''

["rnw_formation_two_oceans_name"]
source = "13126384cc6effe8"
text = '''Cesarstwo Dwóch Oceanów'''

["rnw_formation_two_oceans_name_adj"]
source = "00f9e76a2534af31"
text = '''Dwuoceańs'''

["rnw_formation_two_peoples_name"]
source = "be9e07854a4e2e6b"
text = '''Królestwo Dwóch Ludów'''

["rnw_formation_two_peoples_name_adj"]
source = "aab153dd88cc8043"
text = '''Dwuludows'''

["rnw_formation_two_shores_desc"]
source = "473b50435cb358d9"
text = '''Żaden lud tego kontynentu nigdy nie panował za wielkim oceanem. Potęga jego własnych ludów, która trzyma ziemie na dalekim brzegu i znaczną część rodzinnego kontynentu, może ogłosić cesarstwo obu brzegów: {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_shores_voyagers"]
source = "dec7efd625ab7d44"
text = '''Żeglarze ku dalekiemu brzegowi'''

["STATIC_MODIFIER_DESC_rnw_two_shores_voyagers"]
source = "b17650f2a8d54598"
text = '''Nasze statki przemierzają wielki ocean ku ziemiom, których nie znał żaden przodek.'''

["rnw_formation_two_worlds_desc"]
source = "8933a92bcf6a6335"
text = '''Dwór starego kraju przepłynął ocean i osiadł na tym kontynencie, a jego dawna ojczyzna wciąż mu podlega. Korona, która panuje po obu stronach oceanu i ma tu stolicę, może ogłosić jedną koronę nad obydwoma światami: {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_worlds_union"]
source = "9bb6203ca44ee2f1"
text = '''Jedna korona, dwa światy'''

["STATIC_MODIFIER_DESC_rnw_two_worlds_union"]
source = "ec15c579d765b459"
text = '''Dawna ojczyzna i nowy dwór podlegają tej samej koronie.'''

["rnw_formation_two_oceans_desc"]
source = "287d1ce2e64d72e3"
text = '''Ten kontynent leży między dwoma oceanami i żadna potęga nie żeglowała jeszcze po obu. Ta, która trzyma porty nad oboma i znaczną część ziemi pomiędzy, może ogłosić cesarstwo dwóch oceanów: {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_oceans_sea_power"]
source = "5240aa554bdc6edf"
text = '''Władczyni dwóch oceanów'''

["STATIC_MODIFIER_DESC_rnw_two_oceans_sea_power"]
source = "5997155c1a0aa978"
text = '''Nasze floty strzegą szlaków morskich obu oceanów.'''

["rnw_formation_great_law_desc"]
source = "984cd3a2649f2fa6"
text = '''Ludy konfederacji od pokoleń żyją pod jednym wielkim prawem, każdy z własną radą. Wódz, który im przewodzi i trzyma dość ich ziem, może związać je w jedno państwo pod tym prawem: {name}.'''

["STATIC_MODIFIER_NAME_rnw_great_law_league"]
source = "06e46ef8dffbd992"
text = '''Ludy wielkiego prawa'''

["STATIC_MODIFIER_DESC_rnw_great_law_league"]
source = "ae42b7744b3395cf"
text = '''Ludy dawnej konfederacji walczą i handlują jak jeden.'''

["rnw_formation_two_peoples_desc"]
source = "7a91ebd282c9e756"
text = '''Osadnicy i ludy tego kontynentu tak długo żenili się, handlowali i modlili razem, że nikt już nie wie, gdzie kończy się jedno. Państwo, które uważa oba ludy za swoje i trzyma znaczną część kontynentu, może ogłosić królestwo dwóch ludów: {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_peoples_integration"]
source = "0fd80ff5371517ee"
text = '''Dwa ludy, jedno królestwo'''

["STATIC_MODIFIER_DESC_rnw_two_peoples_integration"]
source = "77bf4dd8870d78b3"
text = '''Królestwo uznaje oba ludy za swoje i przyjmuje ich obyczaje.'''

["rnw_road.name"]
source = "2a2a11954c349bc8"
text = '''Droga do celu: {name}'''

["rnw_road.desc"]
source = "e6619312e0e3825f"
text = '''Zebrać ziemie pod naszą władzą i ogłosić nowe państwo: {name}.'''

["rnw_road.seat"]
source = "c50808a05e63c6f2"
text = '''Objąć siedzibę'''

["rnw_road.seat_desc"]
source = "d248d862f432b46c"
text = '''Siedziba nowego państwa musi być nasza, zanim pójdą za nią jego ziemie.'''

["rnw_road.land"]
source = "9df238c90f736f30"
text = '''Zebrać ziemie'''

["rnw_road.land_desc"]
source = "0f35b903317a3f42"
text = '''Musimy trzymać znaczną część jego ziem, zanim będziemy mogli ogłosić nowe państwo.'''

["rnw_road.proclaim"]
source = "a3422fb1ef9d8d24"
text = '''Ogłosić nowe państwo'''

["rnw_road.proclaim_desc"]
source = "faed96e7a4804d75"
text = '''Mając ziemie w rękach, możemy ogłosić: {name}.'''
