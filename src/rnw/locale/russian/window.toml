["estimate_tip"]
source = "34f3f38a503b4cdc"
text = "В EU5 локациями считаются не только провинции суши, но и морские зоны с озёрами по всему миру (около 22 000 из них приходятся на неизменный Старый Свет).\n\nДвижок игры использует 16-битный индекс (максимум ~32 767). Во избежание вылетов генератор держит запас безопасности ниже 31 200.\n\nПочему при выборе «много земли» локаций может стать меньше:\nМорские зоны — это тоже локации. Чем больше суши, тем меньше площадь океана (требуется меньше морских зон), а размер клеток суши автоматически увеличивается для крупных массивов, чтобы уложиться в лимит движка. В итоге суммарное число локаций может уменьшаться — это штатная балансировка бюджета карты, а не ошибка."

