["quick.empires.about"]
source = "7d5f92b53bffae0b"
text = '''Насколько вероятно, что вокруг культурного центра поднимется необычное коренное общество. Великая империя, как в фэнтезийном режиме случайного Нового Света из EU4: одно государство во много раз больше прочих, с развитым правлением, технологиями Старого Света, более высоким рангом и царскими дорогами; соседи её боятся, вассалы её ненавидят. Или лига морских торговых республик — союзников, разделённых водой; конфедерация горных племён; раздробленное царство, чьи центры соперничают друг с другом; священный центр — теократия среди соперников той же веры.'''

