["rnw_formation_restoration_desc"]
source = "744415b1555053f9"
text = '''Некогда этими землями владело царство, пока оно не распалось между наследниками, которые помнят его до сих пор. Наследник, которому принадлежит достаточная часть его прежних земель и чья столица лежит на них, может возродить его и объявить своими остальные его земли — {name}. Прочие наследники должны признать возрождение или оспорить его.'''

["STATIC_MODIFIER_NAME_rnw_restoration_heirs"]
source = "02fcf0134a6e1a2c"
text = '''Наследники прежнего царства'''

["STATIC_MODIFIER_DESC_rnw_restoration_heirs"]
source = "3841570bacb1bb5a"
text = '''Возрождённая корона собирает прежние должности и возвращает свои утраченные провинции под единую власть.'''

["rnw_restoration_heirs_tt"]
source = "14637a30b3e66320"
text = '''Каждый другой наследник прежнего царства должен признать возрождение или оспорить его.'''

["rnw_restoration.title"]
source = "4e9f16af60fc9717"
text = '''Прежнее царство возрождено'''

["rnw_restoration.desc"]
source = "3862bfaf3cd1696c"
text = '''Посланники державы [restorer.GetNameWithNoTooltip] прибыли с воззванием: царство, которое делили наши предки, возрождено, и его новая корона объявляет своими все земли, что ему некогда принадлежали, и наши в том числе. Наш совет должен решить, склониться ли перед прежним именем или отвергнуть его.'''

["rnw_restoration.a"]
source = "8de73f015f26ce75"
text = '''Мы признаём возрождённую корону.'''

["rnw_restoration.b"]
source = "5b9a238653e7fbf8"
text = '''Прежняя корона принадлежит им не больше, чем нам.'''

["rnw_memory.lost_land.title"]
source = "6d03784bc71649e4"
text = '''Утраченная земля: [target_location.GetNameWithNoTooltip]'''

["rnw_memory.lost_land.desc"]
source = "313947eafa71e8c2"
text = '''Наши старейшины до сих пор называют поля местности [target_location.GetNameWithNoTooltip] нашими, хотя держава [partner.GetNameWithNoTooltip] отняла их у наших дедов. Молодые спрашивают, неужели эта утрата должна остаться навсегда.'''

["rnw_memory.lost_land.a"]
source = "515594395bbab00e"
text = '''Что было нашим, снова станет нашим.'''

["rnw_memory.lost_land.b"]
source = "6211a94e051ab224"
text = '''Пусть старая рана затянется.'''

["rnw_memory.old_pact.title"]
source = "11c48fbce58796de"
text = '''Старый союз'''

["rnw_memory.old_pact.desc"]
source = "27565aab96e7c826"
text = '''Некогда наш народ и держава [partner.GetNameWithNoTooltip] поклялись стоять друг за друга и сдержали слово. Её посланники прибыли спросить, связывает ли нас ещё прежнее обещание.'''

["rnw_memory.old_pact.a"]
source = "b94ae141c5a67bf2"
text = '''Прежнее обещание всё ещё связывает нас.'''

["rnw_memory.old_pact.b"]
source = "deae4afc797b2fb4"
text = '''То обещание давали наши деды, а не мы.'''

["rnw_memory.kin.title"]
source = "6c53f1166e3b144c"
text = '''Родня за границей'''

["rnw_memory.kin.desc"]
source = "7025ad0a09571fe0"
text = '''Давным-давно семьи нашего народа переселялись между нашей землёй и державой [partner.GetNameWithNoTooltip] и осели в местности [target_location.GetNameWithNoTooltip]. Их дети всё ещё помнят друг друга и просят, чтобы дорога между ними оставалась открытой.'''

["rnw_memory.kin.a"]
source = "e63fcfb7dc836c71"
text = '''Наши ворота открыты для родни.'''

["rnw_memory.kin.b"]
source = "bd82b91057f1971b"
text = '''Они выбрали другую землю — пусть там и остаются.'''

["rnw_memory.shrine.title"]
source = "af02fa220fb67956"
text = '''Паломничество: [target_location.GetNameWithNoTooltip]'''

["rnw_memory.shrine.desc"]
source = "8079fdc623e79727"
text = '''Поколениями наши паломники ходят к святилищу местности [target_location.GetNameWithNoTooltip] под защитой мира, который им дарует держава [partner.GetNameWithNoTooltip]. Теперь некоторые наши жрецы говорят, что святое место не должно принадлежать чужакам.'''

["rnw_memory.shrine.a"]
source = "501fa6cb9698be73"
text = '''Чтить мир святилища.'''

["rnw_memory.shrine.b"]
source = "20bde48b4bda8b21"
text = '''Святилище должно быть нашим.'''

["rnw_memory.heir.title"]
source = "42df00d9ae3f528e"
text = '''Память о прежнем царстве'''

["rnw_memory.heir.desc"]
source = "1b8d09cdc1575552"
text = '''Наши летописцы вспоминают дни, когда наша земля была едина с соседями под одной короной с престолом в местности [target_location.GetNameWithNoTooltip]. Того царства больше нет, но его не забыли, и тот, кто соберёт достаточно его прежних земель, сможет возродить его.'''

["rnw_memory.heir.a"]
source = "6dfe52d00f4856ad"
text = '''Мы возродим прежнее царство.'''

["rnw_memory.heir.b"]
source = "981a1c5531732d0e"
text = '''Прежнего царства нет — пусть покоится с миром.'''

["rnw_reform_river_markets"]
source = "c98e0101001dfd1a"
text = '''Хартия речных рынков'''

["rnw_reform_river_markets_desc"]
source = "07319bc21fe9bfb3"
text = '''Города реки торгуют по одной хартии, и их купцы ходят по всему её течению.'''

["rnw_reform_valley_council"]
source = "7fe79434140a15d2"
text = '''Совет долин'''

["rnw_reform_valley_council_desc"]
source = "ebe81586e732414b"
text = '''Вожди всех долин заседают в одном совете, и ничего не решается, пока все они не согласятся.'''

["rnw_reform_port_council"]
source = "229cf1f8d7a5629c"
text = '''Совет портов'''

["rnw_reform_port_council_desc"]
source = "b1b09e8b01fe91dc"
text = '''Купеческие дома всех портов вместе правят лигой, и её корабли везут их товары к любому берегу.'''

["rnw_reform_one_people"]
source = "fd6c4d4b18166d99"
text = '''Закон единого народа'''

["rnw_reform_one_people_desc"]
source = "82e5c34f269f9d61"
text = '''Один закон связывает народы содружества и хранит мир между его многочисленными городами.'''

["rnw_reform_realm_provinces"]
source = "041fbf884f30138c"
text = '''Провинции царства'''

["rnw_reform_realm_provinces_desc"]
source = "6d2906868d241c91"
text = '''Царство разделено на провинции под властью наместников, и его города растут под их присмотром.'''

["rnw_reform_national_articles"]
source = "03468bdf1a6efa04"
text = '''Статьи нации'''

["rnw_reform_national_articles_desc"]
source = "67501e96229f51f7"
text = '''Писаные статьи связывают земли нации и собрание, которое говорит от их имени.'''

["rnw_reform_restored_crown"]
source = "c8fe56425fcf3bb3"
text = '''Закон возрождённой короны'''

["rnw_reform_restored_crown_desc"]
source = "4d83a205137e54bb"
text = '''Возрождённая корона возвращает себе прежние права предшественников и снова правит из одного престола.'''

["rnw_decline.1.title"]
source = "3dd1b7659844a1e4"
text = '''Закат города [target_location.GetNameWithNoTooltip]'''

["rnw_decline.1.desc"]
source = "c5fae87ab12e8259"
text = '''Некогда город [target_location.GetNameWithNoTooltip] был престолом державы, правившей всеми окрестными долинами. Та держава давно распалась. Её великие дворы наполовину пусты, внешние кварталы зарастают лесом, а семьи, что держали их, уходят в молодые города.\n\nСтарейшины города спрашивают, станет ли он снова великим или только безопасным.'''

["rnw_decline.1.a"]
source = "ebec51f47bb012d8"
text = '''Отстроить старые дворы и призвать семьи домой.'''

["rnw_decline.1.b"]
source = "2822afffd76cf9be"
text = '''Обнести стенами сердце города, а остальное оставить.'''

["rnw_decline.2.title"]
source = "f07c4c037a05e3eb"
text = '''Новый золотой век'''

["rnw_decline.2.desc"]
source = "fe3cb50f1780e463"
text = '''Дворы города [target_location.GetNameWithNoTooltip] снова полны. Ремесленники трудятся на старых террасах, а паломники приходят посмотреть, что построили предки. Некоторые при дворе говорят, что город теперь должен вести землю, как прежде.'''

["rnw_decline.2.a"]
source = "52923b04d9eac118"
text = '''Пусть город снова ведёт за собой.'''

["rnw_decline.2.b"]
source = "e221439368027a4b"
text = '''Довольно и того, что город восстановлен.'''

["rnw_decline.3.title"]
source = "c2c80a4020d94373"
text = '''Тень над городом [target_location.GetNameWithNoTooltip]'''

["rnw_decline.3.desc"]
source = "9088c57e95aede13"
text = '''За новыми стенами город [target_location.GetNameWithNoTooltip] в безопасности и с каждым годом всё меньше. Пустые кварталы снаружи стали полями и зарослями, а путники говорят о городе как о развалинах с гарнизоном.'''

["rnw_decline.3.a"]
source = "6e51bbc634b77e3d"
text = '''Стены того стоили.'''

["rnw_decline.3.b"]
source = "a49ba0633c7d61c0"
text = '''Пригласить поселенцев в пустые кварталы.'''

["STATIC_MODIFIER_NAME_rnw_decline_rebuilding"]
source = "ed85686f202140d9"
text = '''Восстановление старых дворов'''

["STATIC_MODIFIER_DESC_rnw_decline_rebuilding"]
source = "e9c2af8b2b9fc5fc"
text = '''Каменщики и семьи возвращаются во дворы прежнего престола.'''

["STATIC_MODIFIER_NAME_rnw_decline_fortified"]
source = "78040151a1a67f82"
text = '''Сердце за стенами'''

["STATIC_MODIFIER_DESC_rnw_decline_fortified"]
source = "57cf3f4fa3374287"
text = '''Сердце прежнего престола обнесено стенами и охраняется гарнизоном.'''

["STATIC_MODIFIER_NAME_rnw_decline_golden_age"]
source = "145441a99b625ab8"
text = '''Прежний престол снова ведёт'''

["STATIC_MODIFIER_DESC_rnw_decline_golden_age"]
source = "cf3b7ff492ed1a96"
text = '''Возрождённый город притягивает ремесленников, учёных и дань со всей земли.'''

["STATIC_MODIFIER_NAME_rnw_decline_shadow"]
source = "296709711159011b"
text = '''Развалины с гарнизоном'''

["STATIC_MODIFIER_DESC_rnw_decline_shadow"]
source = "11a730ce7bb2fe79"
text = '''Путники говорят о прежнем престоле как о тени того, чем он был.'''

["STATIC_MODIFIER_NAME_rnw_decline_resettled"]
source = "8274df482f4588de"
text = '''Поселенцы в пустых кварталах'''

["STATIC_MODIFIER_DESC_rnw_decline_resettled"]
source = "5ea7a09878b27a82"
text = '''Новые семьи заполняют пустые кварталы прежнего престола.'''

["rnw_council.1.title"]
source = "b4e7094533513141"
text = '''Великий совет'''

["rnw_council.1.desc"]
source = "e8fa63c6638665fc"
text = '''Вожди всех народов нашей конфедерации собрались в городе [target_location.GetNameWithNoTooltip] на Великий совет. По старому закону ничего не решается, пока все они не согласятся, а в этом году им есть о чём договариваться.\n\nНаш вождь может позволить совету говорить одним неторопливым голосом — или заговорить первым и громче всех.'''

["rnw_council.1.a"]
source = "0503a3f754419f6f"
text = '''Пусть совет решает сообща.'''

["rnw_council.1.b"]
source = "3d0cadb02d62b4d3"
text = '''Наш голос будет вести совет.'''

["rnw_council.2.title"]
source = "bdd492090bb9debb"
text = '''Новая делегация'''

["rnw_council.2.desc"]
source = "c98b72faac08d982"
text = '''Народ из-за наших границ прислал делегацию на совет в городе [target_location.GetNameWithNoTooltip]. Его посланники просят места среди вождей и права жить по закону конфедерации как по своему.'''

["rnw_council.2.a"]
source = "567fa5f1e3a6044d"
text = '''Дать им место у огня.'''

["rnw_council.2.b"]
source = "9471fe0792fa23db"
text = '''В совете нет больше мест.'''

["rnw_council.3.title"]
source = "874b725a727a0a9b"
text = '''Вожди разгневаны'''

["rnw_council.3.desc"]
source = "5c3955cce944b26b"
text = '''Вожди, которых оборвали на совете, в гневе разъехались из города [target_location.GetNameWithNoTooltip]. Некоторые из них поговаривают о том, чтобы покинуть конфедерацию.'''

["rnw_council.3.a"]
source = "c44abb77c015f05c"
text = '''Послать дары каждому вождю.'''

["rnw_council.3.b"]
source = "514be8b6eec366bf"
text = '''Их гнев пройдёт.'''

["STATIC_MODIFIER_NAME_rnw_council_peace"]
source = "4315d2c7eee55c49"
text = '''Единый голос совета'''

["STATIC_MODIFIER_DESC_rnw_council_peace"]
source = "2d412c8f4e3f1d44"
text = '''Вожди решают сообща и неспешно, а их народы держатся решённого.'''

["STATIC_MODIFIER_NAME_rnw_council_assertive"]
source = "44e0dd172a716cae"
text = '''Совет, которым пренебрегли'''

["STATIC_MODIFIER_DESC_rnw_council_assertive"]
source = "c126f271e8ab388a"
text = '''Наш вождь говорит за весь совет, и другие вожди возмущены этим.'''

["rnw_senior.1.title"]
source = "8a0392279a2c60ed"
text = '''Равновесие союза'''

["rnw_senior.1.desc"]
source = "c60827cfe5e974c4"
text = '''Целое поколение наш двор и его союзники стояли вместе, и ни один сосед не осмеливался испытать их. Теперь наш двор сильнее всех, и наша знать спрашивает, почему добычу каждой войны надо делить поровну с державой [target_country.GetName].'''

["rnw_senior.1.a"]
source = "a42b01208b4b1ada"
text = '''Мы займём первое место среди союзников.'''

["rnw_senior.1.b"]
source = "5300de972d911391"
text = '''Мы стояли вместе как равные — так и останется.'''

["rnw_senior.2.title"]
source = "aada9ff26807d3c0"
text = '''Младший союзник протестует'''

["rnw_senior.2.desc"]
source = "56f863fcfc28ea25"
text = '''Посланники державы [target_country.GetName] напоминают нашему двору, что их воины проливали кровь рядом с нашими. Они просят равной доли дани — иначе подумают о союзе заново.'''

["rnw_senior.2.a"]
source = "57b81bcae2e47aef"
text = '''Отдать им их долю дани.'''

["rnw_senior.2.b"]
source = "2e41afb4ddc50636"
text = '''Мы нужны им больше, чем они нам.'''

["rnw_senior.3.title"]
source = "f33618a6e39b1ac4"
text = '''Дары между равными'''

["rnw_senior.3.desc"]
source = "31a432876c7d6948"
text = '''Двор державы [target_country.GetName] прислал дары в честь старого союза и ждёт, что наш пошлёт в ответ.'''

["rnw_senior.3.a"]
source = "eebec55c40a0fd41"
text = '''Ответить ещё более богатыми дарами.'''

["rnw_senior.3.b"]
source = "8c56d76df18a23e8"
text = '''Хватит и нашей благодарности.'''

["rnw_nation.1.title"]
source = "be38d247de5f8725"
text = '''Собрание делегатов'''

["rnw_nation.1.desc"]
source = "454f7eca77815ade"
text = '''Делегаты всех городов новой нации собрались в городе [target_location.GetNameWithNoTooltip], чтобы решить, как ею править. Одни хотят республику вольных городов, другие говорят, что молодой нации нужна корона, чтобы держать её вместе.'''

["rnw_nation.1.a"]
source = "dac2a7edd2cc8b83"
text = '''Республика вольных городов.'''

["rnw_nation.1.b"]
source = "7ab2b89252812153"
text = '''Корона, что удержит нацию вместе.'''

["rnw_nation.2.title"]
source = "16ff1ee78d2287cd"
text = '''Указ о фронтире'''

["rnw_nation.2.desc"]
source = "837b55fe72b75d71"
text = '''Собрание в городе [target_location.GetNameWithNoTooltip] должно решить, что станет с землями за обжитым побережьем. Землемеры хотят обмерить их, распродать и связать дорогами; другие говорят, что они принадлежат народам, которые там живут.'''

["rnw_nation.2.a"]
source = "a66b4892ba0f52a4"
text = '''Обмерить фронтир и проложить туда дороги.'''

["rnw_nation.2.b"]
source = "d89dfe8abb0da82d"
text = '''Оставить фронтир его народам.'''

["rnw_nation.3.title"]
source = "e0d3ebbd474754be"
text = '''Корона для нации'''

["rnw_nation.3.desc"]
source = "b44240c9bf06e2fa"
text = '''Делегаты избрали корону, и новый двор в городе [target_location.GetNameWithNoTooltip] должен решить, кого он наградит: основателей городов или старые семьи, прибывшие из-за моря.'''

["rnw_nation.3.a"]
source = "a8122d8c264b7555"
text = '''Наградить основателей городов.'''

["rnw_nation.3.b"]
source = "08d05dbcb8725972"
text = '''Почтить старые семьи.'''

["STATIC_MODIFIER_NAME_rnw_nation_roads"]
source = "69bccd5fa130c0bd"
text = '''Дороги на фронтир'''

["STATIC_MODIFIER_DESC_rnw_nation_roads"]
source = "671d8ac3385e6289"
text = '''Землемеры и строители дорог ведут дороги нации за обжитое побережье.'''

["rnw_naming.title"]
source = "82708204008b5b60"
text = '''Имя для нового государства'''

["rnw_naming.desc"]
source = "360aafa7c1166035"
text = '''Новому государству нужно имя, под которым его будут знать соседи. Одни при дворе предпочитают имя, под которым его провозгласили; другие назвали бы его по земле, которой оно теперь правит.'''

["rnw_naming.keep"]
source = "83549dc6c7c223ec"
text = '''Сохранить имя: {name}.'''

["rnw_naming.take"]
source = "0eff740f9b97f82f"
text = '''Принять имя: {name}.'''

["rnw_formation_two_shores_name"]
source = "3bc268bf8490e630"
text = '''Империя двух берегов'''

["rnw_formation_two_shores_name_adj"]
source = "400671422a0de267"
text = '''Заокеанск'''

["rnw_formation_two_worlds_name"]
source = "2f85382541be3bad"
text = '''Корона двух миров'''

["rnw_formation_two_worlds_name_adj"]
source = "1349ccd918705484"
text = '''Трансатлантическ'''

["rnw_formation_two_oceans_name"]
source = "13126384cc6effe8"
text = '''Империя двух океанов'''

["rnw_formation_two_oceans_name_adj"]
source = "00f9e76a2534af31"
text = '''Двухокеанск'''

["rnw_formation_two_peoples_name"]
source = "be9e07854a4e2e6b"
text = '''Держава двух народов'''

["rnw_formation_two_peoples_name_adj"]
source = "aab153dd88cc8043"
text = '''Двуплеменск'''

["rnw_formation_two_shores_desc"]
source = "473b50435cb358d9"
text = '''Ни один народ этого материка никогда не правил за великим океаном. Держава его собственных народов, которой принадлежат земли на дальнем берегу и большая часть родного материка, может провозгласить империю обоих берегов — {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_shores_voyagers"]
source = "dec7efd625ab7d44"
text = '''Мореходы к дальнему берегу'''

["STATIC_MODIFIER_DESC_rnw_two_shores_voyagers"]
source = "b17650f2a8d54598"
text = '''Наши корабли пересекают великий океан к землям, которых не знал ни один предок.'''

["rnw_formation_two_worlds_desc"]
source = "8933a92bcf6a6335"
text = '''Двор старой страны пересёк океан и обосновался на этом материке, а его прежняя родина всё ещё подчиняется ему. Корона, что правит по обе стороны океана и держит столицу здесь, может провозгласить единую корону над обоими мирами — {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_worlds_union"]
source = "9bb6203ca44ee2f1"
text = '''Одна корона, два мира'''

["STATIC_MODIFIER_DESC_rnw_two_worlds_union"]
source = "ec15c579d765b459"
text = '''Прежняя родина и новый двор подчиняются одной короне.'''

["rnw_formation_two_oceans_desc"]
source = "287d1ce2e64d72e3"
text = '''Этот материк лежит между двумя океанами, и ни одна держава ещё не ходила по обоим. Та, что держит порты на обоих и большую часть земли между ними, может провозгласить империю двух океанов — {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_oceans_sea_power"]
source = "5240aa554bdc6edf"
text = '''Владычица двух океанов'''

["STATIC_MODIFIER_DESC_rnw_two_oceans_sea_power"]
source = "5997155c1a0aa978"
text = '''Наши флоты охраняют морские пути обоих океанов.'''

["rnw_formation_great_law_desc"]
source = "984cd3a2649f2fa6"
text = '''Народы конфедерации поколениями живут под одним великим законом, и у каждого свой совет. Вождь, что ведёт их и держит достаточно их земель, может связать их в одно государство под этим законом — {name}.'''

["STATIC_MODIFIER_NAME_rnw_great_law_league"]
source = "06e46ef8dffbd992"
text = '''Народы великого закона'''

["STATIC_MODIFIER_DESC_rnw_great_law_league"]
source = "ae42b7744b3395cf"
text = '''Народы прежней конфедерации воюют и торгуют как один.'''

["rnw_formation_two_peoples_desc"]
source = "7a91ebd282c9e756"
text = '''Поселенцы и народы этого материка так долго роднились, торговали и молились вместе, что уже не сказать, где кончается одно и начинается другое. Государство, что считает своими оба народа и держит большую часть материка, может провозгласить державу двух народов — {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_peoples_integration"]
source = "0fd80ff5371517ee"
text = '''Два народа, одна держава'''

["STATIC_MODIFIER_DESC_rnw_two_peoples_integration"]
source = "77bf4dd8870d78b3"
text = '''Держава считает своими оба народа и привечает их обычаи.'''

["rnw_road.name"]
source = "2a2a11954c349bc8"
text = '''Путь к цели: {name}'''

["rnw_road.desc"]
source = "e6619312e0e3825f"
text = '''Собрать земли под нашей властью и провозгласить новое государство — {name}.'''

["rnw_road.seat"]
source = "c50808a05e63c6f2"
text = '''Взять престол'''

["rnw_road.seat_desc"]
source = "d248d862f432b46c"
text = '''Престол нового государства должен стать нашим, прежде чем за ним последуют его земли.'''

["rnw_road.land"]
source = "9df238c90f736f30"
text = '''Собрать земли'''

["rnw_road.land_desc"]
source = "0f35b903317a3f42"
text = '''Нам нужно владеть значительной частью этих земель, прежде чем мы сможем провозгласить новое государство.'''

["rnw_road.proclaim"]
source = "a3422fb1ef9d8d24"
text = '''Провозгласить новое государство'''

["rnw_road.proclaim_desc"]
source = "faed96e7a4804d75"
text = '''Когда земли в наших руках, мы можем провозгласить новое государство — {name}.'''
