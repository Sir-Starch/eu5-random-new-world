["rnw_formation_restoration_desc"]
source = "744415b1555053f9"
text = '''한때 이 땅을 다스린 왕국이 있었으나, 그 왕국은 지금도 그것을 기억하는 계승자들 사이에서 분열되었습니다. 옛 영토의 상당 부분을 차지하고 그곳에 수도를 둔 계승자는 왕국을 다시 일으키고 나머지 땅까지 제 것으로 주장할 수 있습니다. 바로 {name}입니다. 다른 계승자들은 이 부흥을 인정하거나 이의를 제기해야 합니다.'''

["STATIC_MODIFIER_NAME_rnw_restoration_heirs"]
source = "02fcf0134a6e1a2c"
text = '''옛 왕국의 계승자'''

["STATIC_MODIFIER_DESC_rnw_restoration_heirs"]
source = "3841570bacb1bb5a"
text = '''되살아난 왕관이 옛 관직들을 모으고 잃어버린 지방들을 다시 하나의 통치 아래로 되돌립니다.'''

["rnw_restoration_heirs_tt"]
source = "14637a30b3e66320"
text = '''옛 왕국의 다른 모든 계승자는 이 부흥을 인정하거나 이의를 제기해야 합니다.'''

["rnw_restoration.title"]
source = "4e9f16af60fc9717"
text = '''옛 왕국의 부흥'''

["rnw_restoration.desc"]
source = "3862bfaf3cd1696c"
text = '''[restorer.GetNameWithNoTooltip]의 사절들이 포고문을 들고 왔습니다. 우리 조상들이 함께 나누었던 왕국이 부흥했으며, 그 새 왕관은 한때 왕국이 다스린 모든 땅을, 우리 땅까지 포함해 제 것이라 선언합니다. 우리 회의는 옛 이름 앞에 고개를 숙일지, 그것을 거부할지 결정해야 합니다.'''

["rnw_restoration.a"]
source = "8de73f015f26ce75"
text = '''되살아난 왕관을 인정합니다.'''

["rnw_restoration.b"]
source = "5b9a238653e7fbf8"
text = '''옛 왕관은 우리보다 그들의 것이 결코 아닙니다.'''

["rnw_memory.lost_land.title"]
source = "6d03784bc71649e4"
text = '''[target_location.GetNameWithNoTooltip]의 상실'''

["rnw_memory.lost_land.desc"]
source = "313947eafa71e8c2"
text = '''[partner.GetNameWithNoTooltip]이(가) 우리 할아버지들에게서 빼앗아 갔지만, 우리 원로들은 지금도 [target_location.GetNameWithNoTooltip]의 들판을 우리 것이라 부릅니다. 젊은이들은 그 상실이 영원히 이어져야 하느냐고 묻습니다.'''

["rnw_memory.lost_land.a"]
source = "515594395bbab00e"
text = '''우리 것이었던 땅은 다시 우리 것이 될 것입니다.'''

["rnw_memory.lost_land.b"]
source = "6211a94e051ab224"
text = '''오래된 상처는 아물게 둡시다.'''

["rnw_memory.old_pact.title"]
source = "11c48fbce58796de"
text = '''옛 맹약'''

["rnw_memory.old_pact.desc"]
source = "27565aab96e7c826"
text = '''한때 우리 백성과 [partner.GetNameWithNoTooltip]은(는) 함께하기로 맹세했고 그 약속을 지켰습니다. 그들의 사절이 옛 약속이 아직도 우리를 묶고 있는지 물으러 왔습니다.'''

["rnw_memory.old_pact.a"]
source = "b94ae141c5a67bf2"
text = '''옛 약속은 여전히 우리를 묶고 있습니다.'''

["rnw_memory.old_pact.b"]
source = "deae4afc797b2fb4"
text = '''그 약속은 우리 할아버지들의 것이지 우리의 것이 아닙니다.'''

["rnw_memory.kin.title"]
source = "6c53f1166e3b144c"
text = '''국경 너머의 동족'''

["rnw_memory.kin.desc"]
source = "7025ad0a09571fe0"
text = '''오래전 우리 백성의 가족들이 우리 땅과 [partner.GetNameWithNoTooltip] 사이를 오가다 [target_location.GetNameWithNoTooltip]에 정착했습니다. 그 자손들은 지금도 서로를 기억하며, 둘 사이의 길이 열려 있기를 바랍니다.'''

["rnw_memory.kin.a"]
source = "e63fcfb7dc836c71"
text = '''우리의 문은 동족에게 열려 있습니다.'''

["rnw_memory.kin.b"]
source = "bd82b91057f1971b"
text = '''그들은 다른 땅을 택했습니다. 그 땅에 머물게 둡시다.'''

["rnw_memory.shrine.title"]
source = "af02fa220fb67956"
text = '''[target_location.GetNameWithNoTooltip]로 가는 순례자들'''

["rnw_memory.shrine.desc"]
source = "8079fdc623e79727"
text = '''여러 세대에 걸쳐 우리 순례자들은 [partner.GetNameWithNoTooltip]이(가) 베푸는 평화 아래 [target_location.GetNameWithNoTooltip]의 성소로 걸어갔습니다. 이제 우리 사제들 중 일부는 성지가 이방인의 것이어서는 안 된다고 말합니다.'''

["rnw_memory.shrine.a"]
source = "501fa6cb9698be73"
text = '''성소의 평화를 존중합니다.'''

["rnw_memory.shrine.b"]
source = "20bde48b4bda8b21"
text = '''성소는 우리 것이어야 합니다.'''

["rnw_memory.heir.title"]
source = "42df00d9ae3f528e"
text = '''옛 왕국의 기억'''

["rnw_memory.heir.desc"]
source = "1b8d09cdc1575552"
text = '''우리 연대기 작가들은 우리 땅이 이웃들과 함께 [target_location.GetNameWithNoTooltip]에 자리한 하나의 왕관 아래 있었던 시절을 기억합니다. 그 왕국은 사라졌지만 잊히지 않았으며, 옛 영토를 충분히 모으는 자는 그것을 다시 일으킬 수 있습니다.'''

["rnw_memory.heir.a"]
source = "6dfe52d00f4856ad"
text = '''우리는 옛 왕국을 다시 일으킬 것입니다.'''

["rnw_memory.heir.b"]
source = "981a1c5531732d0e"
text = '''옛 왕국은 사라졌습니다. 편히 잠들게 둡시다.'''

["rnw_reform_river_markets"]
source = "c98e0101001dfd1a"
text = '''강변 시장 헌장'''

["rnw_reform_river_markets_desc"]
source = "07319bc21fe9bfb3"
text = '''강변의 도시들은 하나의 헌장 아래 교역하며, 그 상인들은 강의 전 유역을 오갑니다.'''

["rnw_reform_valley_council"]
source = "7fe79434140a15d2"
text = '''골짜기 회의'''

["rnw_reform_valley_council_desc"]
source = "ebe81586e732414b"
text = '''모든 골짜기의 족장들이 한 회의에 앉으며, 모두가 동의하기 전에는 아무것도 결정되지 않습니다.'''

["rnw_reform_port_council"]
source = "229cf1f8d7a5629c"
text = '''항구 회의'''

["rnw_reform_port_council_desc"]
source = "b1b09e8b01fe91dc"
text = '''모든 항구의 상가들이 함께 동맹을 다스리며, 그 배들은 그들의 물건을 모든 해안으로 실어 나릅니다.'''

["rnw_reform_one_people"]
source = "fd6c4d4b18166d99"
text = '''한 민족의 법'''

["rnw_reform_one_people_desc"]
source = "82e5c34f269f9d61"
text = '''하나의 법이 공동체의 민족들을 묶고 수많은 도시 사이의 평화를 지킵니다.'''

["rnw_reform_realm_provinces"]
source = "041fbf884f30138c"
text = '''왕국의 지방들'''

["rnw_reform_realm_provinces_desc"]
source = "6d2906868d241c91"
text = '''왕국은 총독들이 다스리는 지방들로 나뉘며, 그 도시들은 그들의 보살핌 아래 성장합니다.'''

["rnw_reform_national_articles"]
source = "03468bdf1a6efa04"
text = '''국가의 조항'''

["rnw_reform_national_articles_desc"]
source = "67501e96229f51f7"
text = '''성문화된 조항들이 국가의 주들과 그들을 대변하는 의회를 하나로 묶습니다.'''

["rnw_reform_restored_crown"]
source = "c8fe56425fcf3bb3"
text = '''되살아난 왕관의 법'''

["rnw_reform_restored_crown_desc"]
source = "4d83a205137e54bb"
text = '''되살아난 왕관은 선대의 옛 권리를 되찾고 다시 하나의 자리에서 다스립니다.'''

["rnw_decline.1.title"]
source = "3dd1b7659844a1e4"
text = '''[target_location.GetNameWithNoTooltip]의 황혼'''

["rnw_decline.1.desc"]
source = "c5fae87ab12e8259"
text = '''[target_location.GetNameWithNoTooltip]은(는) 한때 주변의 모든 골짜기를 다스린 왕국의 도읍이었습니다. 그 왕국은 오래전에 갈라졌습니다. 웅장한 궁정은 반쯤 비었고, 바깥 구역은 숲으로 돌아가며, 그곳을 지키던 가문들은 더 젊은 도시로 떠나고 있습니다.\n\n도시의 원로들은 이곳이 다시 위대해질 것인지, 아니면 그저 안전하기만 하면 되는지 묻습니다.'''

["rnw_decline.1.a"]
source = "ebec51f47bb012d8"
text = '''옛 궁정을 재건하고 가문들을 다시 불러들입니다.'''

["rnw_decline.1.b"]
source = "2822afffd76cf9be"
text = '''도시의 중심부에 성벽을 두르고 나머지는 버립니다.'''

["rnw_decline.2.title"]
source = "f07c4c037a05e3eb"
text = '''새로운 황금기'''

["rnw_decline.2.desc"]
source = "fe3cb50f1780e463"
text = '''[target_location.GetNameWithNoTooltip]의 궁정이 다시 가득 찼습니다. 장인들은 옛 계단식 터에서 일하고, 순례자들은 조상들이 세운 것을 보러 찾아옵니다. 궁정의 일부는 이제 이 도시가 예전처럼 땅을 이끌어야 한다고 말합니다.'''

["rnw_decline.2.a"]
source = "52923b04d9eac118"
text = '''도시가 다시 이끌게 합시다.'''

["rnw_decline.2.b"]
source = "e221439368027a4b"
text = '''도시가 되살아난 것으로 만족합시다.'''

["rnw_decline.3.title"]
source = "c2c80a4020d94373"
text = '''[target_location.GetNameWithNoTooltip]에 드리운 그림자'''

["rnw_decline.3.desc"]
source = "9088c57e95aede13"
text = '''새 성벽 안에서 [target_location.GetNameWithNoTooltip]은(는) 안전하지만 해마다 작아집니다. 바깥의 빈 구역은 밭과 덤불이 되었고, 나그네들은 이 도시를 수비대가 있는 폐허라고 부릅니다.'''

["rnw_decline.3.a"]
source = "6e51bbc634b77e3d"
text = '''성벽은 그만한 가치가 있었습니다.'''

["rnw_decline.3.b"]
source = "a49ba0633c7d61c0"
text = '''빈 구역에 정착민을 불러들입니다.'''

["STATIC_MODIFIER_NAME_rnw_decline_rebuilding"]
source = "ed85686f202140d9"
text = '''옛 궁정의 재건'''

["STATIC_MODIFIER_DESC_rnw_decline_rebuilding"]
source = "e9c2af8b2b9fc5fc"
text = '''석공과 가문들이 옛 도읍의 궁정으로 돌아옵니다.'''

["STATIC_MODIFIER_NAME_rnw_decline_fortified"]
source = "78040151a1a67f82"
text = '''성벽에 둘러싸인 심장부'''

["STATIC_MODIFIER_DESC_rnw_decline_fortified"]
source = "57cf3f4fa3374287"
text = '''옛 도읍의 심장부에 성벽이 둘러지고 수비대가 주둔합니다.'''

["STATIC_MODIFIER_NAME_rnw_decline_golden_age"]
source = "145441a99b625ab8"
text = '''옛 도읍이 다시 이끌다'''

["STATIC_MODIFIER_DESC_rnw_decline_golden_age"]
source = "cf3b7ff492ed1a96"
text = '''되살아난 도시가 온 땅에서 장인과 학자와 공물을 끌어모읍니다.'''

["STATIC_MODIFIER_NAME_rnw_decline_shadow"]
source = "296709711159011b"
text = '''수비대가 있는 폐허'''

["STATIC_MODIFIER_DESC_rnw_decline_shadow"]
source = "11a730ce7bb2fe79"
text = '''나그네들은 옛 도읍을 지난날의 그림자라 부릅니다.'''

["STATIC_MODIFIER_NAME_rnw_decline_resettled"]
source = "8274df482f4588de"
text = '''빈 구역의 정착민'''

["STATIC_MODIFIER_DESC_rnw_decline_resettled"]
source = "5ea7a09878b27a82"
text = '''새 가문들이 옛 도읍의 빈 구역을 채웁니다.'''

["rnw_council.1.title"]
source = "b4e7094533513141"
text = '''대회의'''

["rnw_council.1.desc"]
source = "e8fa63c6638665fc"
text = '''우리 연맹에 속한 모든 민족의 족장들이 대회의를 위해 [target_location.GetNameWithNoTooltip]에 모였습니다. 옛 법에 따르면 모두가 동의하기 전에는 아무것도 결정되지 않으며, 올해는 합의할 일이 많습니다.\n\n우리 족장은 회의가 하나의 느린 목소리로 말하게 둘 수도, 스스로 가장 먼저 가장 크게 말할 수도 있습니다.'''

["rnw_council.1.a"]
source = "0503a3f754419f6f"
text = '''회의가 함께 결정하게 합시다.'''

["rnw_council.1.b"]
source = "3d0cadb02d62b4d3"
text = '''우리의 목소리가 회의를 이끌 것입니다.'''

["rnw_council.2.title"]
source = "bdd492090bb9debb"
text = '''새로운 사절단'''

["rnw_council.2.desc"]
source = "c98b72faac08d982"
text = '''우리 국경 너머의 한 민족이 [target_location.GetNameWithNoTooltip]의 회의에 사절단을 보냈습니다. 그 사절들은 족장들 사이에 자리를 얻고 연맹의 법을 자신들의 법으로 지키게 해 달라고 청합니다.'''

["rnw_council.2.a"]
source = "567fa5f1e3a6044d"
text = '''그들에게 불가의 자리를 내어 줍시다.'''

["rnw_council.2.b"]
source = "9471fe0792fa23db"
text = '''회의에는 더 이상 자리가 없습니다.'''

["rnw_council.3.title"]
source = "874b725a727a0a9b"
text = '''분노한 족장들'''

["rnw_council.3.desc"]
source = "5c3955cce944b26b"
text = '''회의에서 말을 끊긴 족장들이 분노하며 [target_location.GetNameWithNoTooltip]을(를) 떠나 돌아갔습니다. 그중 몇몇은 연맹을 떠나겠다고 말합니다.'''

["rnw_council.3.a"]
source = "c44abb77c015f05c"
text = '''모든 족장에게 선물을 보냅니다.'''

["rnw_council.3.b"]
source = "514be8b6eec366bf"
text = '''그들의 분노는 지나갈 것입니다.'''

["STATIC_MODIFIER_NAME_rnw_council_peace"]
source = "4315d2c7eee55c49"
text = '''회의의 한 목소리'''

["STATIC_MODIFIER_DESC_rnw_council_peace"]
source = "2d412c8f4e3f1d44"
text = '''족장들은 함께, 천천히 결정하고, 그 백성은 결정된 바를 지킵니다.'''

["STATIC_MODIFIER_NAME_rnw_council_assertive"]
source = "44e0dd172a716cae"
text = '''무시당한 회의'''

["STATIC_MODIFIER_DESC_rnw_council_assertive"]
source = "c126f271e8ab388a"
text = '''우리 족장이 회의를 대변하고, 다른 족장들은 그것을 못마땅해합니다.'''

["rnw_senior.1.title"]
source = "8a0392279a2c60ed"
text = '''동맹의 균형'''

["rnw_senior.1.desc"]
source = "c60827cfe5e974c4"
text = '''한 세대 동안 우리 궁정과 그 동맹들은 함께 섰고, 어떤 이웃도 감히 그들을 시험하지 못했습니다. 이제 우리 궁정이 그 누구보다 강하며, 우리 귀족들은 어째서 모든 전쟁의 전리품을 [target_country.GetName]와(과) 똑같이 나눠야 하느냐고 묻습니다.'''

["rnw_senior.1.a"]
source = "a42b01208b4b1ada"
text = '''우리가 동맹들 가운데 으뜸 자리를 차지할 것입니다.'''

["rnw_senior.1.b"]
source = "5300de972d911391"
text = '''우리는 대등하게 함께 섰고, 앞으로도 그러할 것입니다.'''

["rnw_senior.2.title"]
source = "aada9ff26807d3c0"
text = '''하위 동맹의 항의'''

["rnw_senior.2.desc"]
source = "56f863fcfc28ea25"
text = '''[target_country.GetName]의 사절들은 그들의 전사들이 우리 전사들 곁에서 피를 흘렸음을 우리 궁정에 상기시킵니다. 그들은 공물의 동등한 몫을 요구하며, 그렇지 않으면 동맹을 다시 생각하겠다고 합니다.'''

["rnw_senior.2.a"]
source = "57b81bcae2e47aef"
text = '''그들에게 공물의 몫을 줍시다.'''

["rnw_senior.2.b"]
source = "2e41afb4ddc50636"
text = '''그들이 우리를 필요로 하는 것이 우리가 그들을 필요로 하는 것보다 큽니다.'''

["rnw_senior.3.title"]
source = "f33618a6e39b1ac4"
text = '''대등한 이들 사이의 선물'''

["rnw_senior.3.desc"]
source = "31a432876c7d6948"
text = '''[target_country.GetName]의 궁정이 옛 동맹을 기리며 선물을 보내왔고, 우리 궁정이 무엇을 답례로 보낼지 기다리고 있습니다.'''

["rnw_senior.3.a"]
source = "eebec55c40a0fd41"
text = '''더 풍성한 선물로 답례합니다.'''

["rnw_senior.3.b"]
source = "8c56d76df18a23e8"
text = '''감사의 말로 충분합니다.'''

["rnw_nation.1.title"]
source = "be38d247de5f8725"
text = '''대표자 회의'''

["rnw_nation.1.desc"]
source = "454f7eca77815ade"
text = '''새 국가의 모든 도시에서 온 대표자들이 나라를 어떻게 다스릴지 정하기 위해 [target_location.GetNameWithNoTooltip]에 모였습니다. 어떤 이들은 자유 도시들의 공화국을 원하고, 다른 이들은 젊은 나라를 하나로 묶으려면 왕관이 필요하다고 말합니다.'''

["rnw_nation.1.a"]
source = "dac2a7edd2cc8b83"
text = '''자유 도시들의 공화국입니다.'''

["rnw_nation.1.b"]
source = "7ab2b89252812153"
text = '''나라를 하나로 묶을 왕관입니다.'''

["rnw_nation.2.title"]
source = "16ff1ee78d2287cd"
text = '''변경 조례'''

["rnw_nation.2.desc"]
source = "837b55fe72b75d71"
text = '''[target_location.GetNameWithNoTooltip]의 의회는 정착된 해안 너머의 땅을 어떻게 할지 정해야 합니다. 측량사들은 그 땅을 측량해 팔고 길로 잇고자 하지만, 다른 이들은 그 땅이 그곳에 사는 민족들의 것이라고 말합니다.'''

["rnw_nation.2.a"]
source = "a66b4892ba0f52a4"
text = '''변경을 측량하고 그곳으로 길을 냅니다.'''

["rnw_nation.2.b"]
source = "d89dfe8abb0da82d"
text = '''변경은 그곳의 민족들에게 맡깁니다.'''

["rnw_nation.3.title"]
source = "e0d3ebbd474754be"
text = '''나라를 위한 왕관'''

["rnw_nation.3.desc"]
source = "b44240c9bf06e2fa"
text = '''대표자들이 왕관을 택했고, [target_location.GetNameWithNoTooltip]의 새 궁정은 누구에게 보상할지 정해야 합니다. 도시들을 세운 이들입니까, 아니면 바다 건너에서 온 옛 가문들입니까?'''

["rnw_nation.3.a"]
source = "a8122d8c264b7555"
text = '''도시들을 세운 이들에게 보상합니다.'''

["rnw_nation.3.b"]
source = "08d05dbcb8725972"
text = '''옛 가문들을 예우합니다.'''

["STATIC_MODIFIER_NAME_rnw_nation_roads"]
source = "69bccd5fa130c0bd"
text = '''변경으로 가는 길'''

["STATIC_MODIFIER_DESC_rnw_nation_roads"]
source = "671d8ac3385e6289"
text = '''측량사와 도로 건설자들이 나라의 길을 정착된 해안 너머로 넓혀 갑니다.'''
