["estimate_tip"]
source = "34f3f38a503b4cdc"
text = "EU5에서 지역(Location)은 육지 프로빈스뿐만 아니라 전 세계의 해역과 호수를 포함합니다(약 22,000개는 고정된 구세계에 속함).\n\n게임 엔진은 16비트 인덱스(최대 약 32,767개)를 사용하므로, 충돌을 방지하기 위해 생성기는 총합을 31,200개 미만으로 안전하게 유지합니다.\n\n'육지 많음'을 선택했을 때 지역 수가 줄어들 수 있는 이유:\n해역 또한 지역으로 계산됩니다. 육지가 많아지면 바다 면적이 줄어들어(해역 수 감소) 필요한 해역이 적어지며, 거대한 대륙이 엔진 한도를 넘지 않도록 육지 격자 크기가 자동으로 커집니다. 따라서 전체 지역 수가 줄어들 수 있으며, 이는 정상적인 지도 예산 조율이며 오류가 아닙니다."

