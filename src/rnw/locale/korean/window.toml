["group.resources"]
source = "e89b30aa1dc30a6a"
text = "자원"

["group.resources.about"]
source = "fc2206254ef4d13c"
text = "상대적인 배치 가중치입니다. 1×는 기본 게임의 빈도를 사용하고 0은 자원을 제외합니다. 기후와 지형도 계속 배치에 영향을 줍니다. 한 자원을 늘리면 다른 자원이 차지할 장소가 줄지만 장소별 생산량은 바뀌지 않습니다. 활성화된 자원 중 장소에 적합한 것이 없으면 생성이 중단됩니다."

