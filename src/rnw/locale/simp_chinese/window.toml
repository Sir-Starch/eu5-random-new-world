["estimate_tip"]
source = "34f3f38a503b4cdc"
text = "在EU5中，“地点”不仅包含陆地省份，还包括全球的海域和湖泊（其中约22,000个属于固定的旧大陆）。\n\n游戏引擎采用16位索引（最大约32,767）。为防止游戏崩溃，生成器将总数严格控制在31,200以下。\n\n为什么选择“陆地较多”时地点数量可能会减少：\n海域同样被计为地点。陆地面积增加意味着海洋面积缩小（海域地点减少），同时生成器会自动放大大型陆地的地块尺寸以避免超出引擎上限。因此地点总数可能会减少，这是正常的预算平衡机制，并非错误。"

