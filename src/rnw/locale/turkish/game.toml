text = '''Vadiler Meclisi'''

["rnw_reform_valley_council_desc"]
source = "ebe81586e732414b"
text = '''Her vadinin şefleri tek bir mecliste toplanır ve hepsi razı olmadan hiçbir karar alınmaz.'''

["rnw_reform_port_council"]
source = "229cf1f8d7a5629c"
text = '''Limanlar Meclisi'''

["rnw_reform_port_council_desc"]
source = "b1b09e8b01fe91dc"
text = '''Her limanın tüccar haneleri birliği birlikte yönetir ve gemileri mallarını her kıyıya taşır.'''

["rnw_reform_one_people"]
source = "fd6c4d4b18166d99"
text = '''Tek Halkın Yasası'''

["rnw_reform_one_people_desc"]
source = "82e5c34f269f9d61"
text = '''Tek bir yasa topluluğun halklarını birbirine bağlar ve pek çok şehri arasında barışı korur.'''

["rnw_reform_realm_provinces"]
source = "041fbf884f30138c"
text = '''Devletin Eyaletleri'''

["rnw_reform_realm_provinces_desc"]
source = "6d2906868d241c91"
text = '''Devlet, valilerinin yönetimindeki eyaletlere bölünmüştür ve şehirleri onların gözetiminde büyür.'''

["rnw_reform_national_articles"]
source = "03468bdf1a6efa04"
text = '''Ulusun Maddeleri'''

["rnw_reform_national_articles_desc"]
source = "67501e96229f51f7"
text = '''Yazılı maddeler ulusun eyaletlerini ve onlar adına konuşan meclisi birbirine bağlar.'''

["rnw_reform_restored_crown"]
source = "c8fe56425fcf3bb3"
text = '''Yeniden Kurulan Tacın Yasası'''

["rnw_reform_restored_crown_desc"]
source = "4d83a205137e54bb"
text = '''Yeniden kurulan taç, öncüllerinin eski haklarını geri alır ve yeniden tek bir merkezden yönetir.'''

["rnw_decline.1.title"]
source = "3dd1b7659844a1e4"
text = '''[target_location.GetNameWithNoTooltip] Şehrinin Gün Batımı'''

["rnw_decline.1.desc"]
source = "c5fae87ab12e8259"
text = '''[target_location.GetNameWithNoTooltip] bir zamanlar çevresindeki bütün vadileri yöneten bir devletin merkeziydi. O devlet çoktan parçalandı. Büyük avluları yarı boş, dış mahalleleri yeniden ormana dönüyor ve oraları tutan aileler daha genç şehirlere göç ediyor.\n\nŞehrin büyükleri, şehrin yeniden büyük mü olacağını yoksa yalnızca güvende mi kalacağını soruyor.'''

["rnw_decline.1.a"]
source = "ebec51f47bb012d8"
text = '''Eski avluları yeniden inşa edin ve aileleri geri çağırın.'''

["rnw_decline.1.b"]
source = "2822afffd76cf9be"
text = '''Şehrin kalbini surla çevirin, gerisini bırakın.'''

["rnw_decline.2.title"]
source = "f07c4c037a05e3eb"
text = '''Yeni Bir Altın Çağ'''

["rnw_decline.2.desc"]
source = "fe3cb50f1780e463"
text = '''[target_location.GetNameWithNoTooltip] şehrinin avluları yeniden dolu. Zanaatkârlar eski teraslarda çalışıyor, hacılar ataların inşa ettiklerini görmeye geliyor. Saraydaki bazıları şehrin artık eskisi gibi ülkeye önderlik etmesi gerektiğini söylüyor.'''

["rnw_decline.2.a"]
source = "52923b04d9eac118"
text = '''Şehir yeniden önderlik etsin.'''

["rnw_decline.2.b"]
source = "e221439368027a4b"
text = '''Şehrin yeniden kurulmuş olması yeter.'''

["rnw_decline.3.title"]
source = "c2c80a4020d94373"
text = '''[target_location.GetNameWithNoTooltip] Üzerindeki Gölge'''

["rnw_decline.3.desc"]
source = "9088c57e95aede13"
text = '''Yeni surlarının ardında [target_location.GetNameWithNoTooltip] güvende ve her yıl biraz daha küçük. Dışarıdaki boş mahalleler tarlaya ve çalılığa dönmüş; yolcular şehirden garnizonlu bir harabe diye söz ediyor.'''

["rnw_decline.3.a"]
source = "6e51bbc634b77e3d"
text = '''Surlar buna değdi.'''

["rnw_decline.3.b"]
source = "a49ba0633c7d61c0"
text = '''Boş mahallelere yerleşimci davet edin.'''

["STATIC_MODIFIER_NAME_rnw_decline_rebuilding"]
source = "ed85686f202140d9"
text = '''Eski Avluların Yeniden İnşası'''

["STATIC_MODIFIER_DESC_rnw_decline_rebuilding"]
source = "e9c2af8b2b9fc5fc"
text = '''Taş ustaları ve aileler eski merkezin avlularına geri dönüyor.'''

["STATIC_MODIFIER_NAME_rnw_decline_fortified"]
source = "78040151a1a67f82"
text = '''Surlarla Çevrili Kalp'''

["STATIC_MODIFIER_DESC_rnw_decline_fortified"]
source = "57cf3f4fa3374287"
text = '''Eski merkezin kalbi surlarla çevrilmiş ve garnizonla korunuyor.'''

["STATIC_MODIFIER_NAME_rnw_decline_golden_age"]
source = "145441a99b625ab8"
text = '''Eski Merkez Yeniden Önderlikte'''

["STATIC_MODIFIER_DESC_rnw_decline_golden_age"]
source = "cf3b7ff492ed1a96"
text = '''Yeniden kurulan şehir bütün ülkeden zanaatkâr, bilgin ve haraç çekiyor.'''

["STATIC_MODIFIER_NAME_rnw_decline_shadow"]
source = "296709711159011b"
text = '''Garnizonlu Bir Harabe'''

["STATIC_MODIFIER_DESC_rnw_decline_shadow"]
source = "11a730ce7bb2fe79"
text = '''Yolcular eski merkezden, bir zamanki hâlinin gölgesi diye söz ediyor.'''

["STATIC_MODIFIER_NAME_rnw_decline_resettled"]
source = "8274df482f4588de"
text = '''Boş Mahallelerde Yerleşimciler'''

["STATIC_MODIFIER_DESC_rnw_decline_resettled"]
source = "5ea7a09878b27a82"
text = '''Yeni aileler eski merkezin boş mahallelerini dolduruyor.'''

["rnw_council.1.title"]
source = "b4e7094533513141"
text = '''Büyük Meclis'''

["rnw_council.1.desc"]
source = "e8fa63c6638665fc"
text = '''Konfederasyonumuzdaki bütün halkların şefleri Büyük Meclis için [target_location.GetNameWithNoTooltip] şehrinde toplandı. Eski yasaya göre hepsi razı olmadan hiçbir karar alınmaz ve bu yıl uzlaşmaları gereken çok şey var.\n\nKendi şefimiz meclisin tek ve ağır bir sesle konuşmasına izin verebilir ya da ilk ve en yüksek sesle kendisi konuşabilir.'''

["rnw_council.1.a"]
source = "0503a3f754419f6f"
text = '''Meclis birlikte karar versin.'''

["rnw_council.1.b"]
source = "3d0cadb02d62b4d3"
text = '''Meclise bizim sesimiz yön verecek.'''

["rnw_council.2.title"]
source = "bdd492090bb9debb"
text = '''Yeni Bir Heyet'''

["rnw_council.2.desc"]
source = "c98b72faac08d982"
text = '''Sınırlarımızın ötesindeki bir halk, [target_location.GetNameWithNoTooltip] şehrindeki meclise bir heyet gönderdi. Elçileri şefler arasında oturmayı ve konfederasyonun yasasını kendi yasaları gibi tutmayı istiyor.'''

["rnw_council.2.a"]
source = "567fa5f1e3a6044d"
text = '''Onlara ateşin başında yer açın.'''

["rnw_council.2.b"]
source = "9471fe0792fa23db"
text = '''Mecliste yer kalmadı.'''

["rnw_council.3.title"]
source = "874b725a727a0a9b"
text = '''Şefler Öfkeli'''

["rnw_council.3.desc"]
source = "5c3955cce944b26b"
text = '''Mecliste sözleri kesilen şefler [target_location.GetNameWithNoTooltip] şehrinden öfkeyle ayrıldı. Bazıları konfederasyondan çekilmekten söz ediyor.'''

["rnw_council.3.a"]
source = "c44abb77c015f05c"
text = '''Her şefe hediye gönderin.'''

["rnw_council.3.b"]
source = "514be8b6eec366bf"
text = '''Öfkeleri geçecek.'''

["STATIC_MODIFIER_NAME_rnw_council_peace"]
source = "4315d2c7eee55c49"
text = '''Meclisin Tek Sesi'''

["STATIC_MODIFIER_DESC_rnw_council_peace"]
source = "2d412c8f4e3f1d44"
text = '''Şefler ağır ağır ve birlikte karar verir, halkları da bu kararlara uyar.'''

["STATIC_MODIFIER_NAME_rnw_council_assertive"]
source = "44e0dd172a716cae"
text = '''Hiçe Sayılan Meclis'''

["STATIC_MODIFIER_DESC_rnw_council_assertive"]
source = "c126f271e8ab388a"
text = '''Şefimiz meclis adına konuşuyor ve diğer şefler buna içerliyor.'''

["rnw_senior.1.title"]
source = "8a0392279a2c60ed"
text = '''İttifakın Dengesi'''

["rnw_senior.1.desc"]
source = "c60827cfe5e974c4"
text = '''Bir nesil boyunca sarayımız ve müttefikleri birlikte durdu ve hiçbir komşu onları sınamaya cesaret edemedi. Artık sarayımız hepsinin en güçlüsü ve soylularımız her savaşın ganimetinin neden [target_country.GetName] ile eşit paylaşılması gerektiğini soruyor.'''

["rnw_senior.1.a"]
source = "a42b01208b4b1ada"
text = '''Müttefiklerimiz arasında ilk sırayı alacağız.'''

["rnw_senior.1.b"]
source = "5300de972d911391"
text = '''Eşit olarak birlikte durduk ve öyle kalacağız.'''

["rnw_senior.2.title"]
source = "aada9ff26807d3c0"
text = '''Küçük Ortak İtiraz Ediyor'''

["rnw_senior.2.desc"]
source = "56f863fcfc28ea25"
text = '''[target_country.GetName] elçileri sarayımıza, savaşçılarının bizimkilerin yanında kan döktüğünü hatırlatıyor. Haraçtan eşit pay istiyorlar; yoksa ittifakı yeniden düşünecekler.'''

["rnw_senior.2.a"]
source = "57b81bcae2e47aef"
text = '''Haraçtan paylarını verin.'''

["rnw_senior.2.b"]
source = "2e41afb4ddc50636"
text = '''Onların bize ihtiyacı, bizim onlara ihtiyacımızdan fazla.'''

["rnw_senior.3.title"]
source = "f33618a6e39b1ac4"
text = '''Eşitler Arasında Hediyeler'''

["rnw_senior.3.desc"]
source = "31a432876c7d6948"
text = '''[target_country.GetName] sarayı eski ittifakın onuruna hediyeler gönderdi ve bizim sarayımızın karşılığında ne göndereceğini bekliyor.'''

["rnw_senior.3.a"]
source = "eebec55c40a0fd41"
text = '''Karşılığında daha zengin hediyeler gönderin.'''

["rnw_senior.3.b"]
source = "8c56d76df18a23e8"
text = '''Teşekkürümüz yeter.'''

["rnw_nation.1.title"]
source = "be38d247de5f8725"
text = '''Delegeler Meclisi'''

["rnw_nation.1.desc"]
source = "454f7eca77815ade"
text = '''Yeni ulusun bütün şehirlerinin delegeleri, ulusun nasıl yönetileceğine karar vermek için [target_location.GetNameWithNoTooltip] şehrinde toplandı. Bazıları özgür şehirlerden oluşan bir cumhuriyet istiyor; diğerleri genç bir ulusun onu bir arada tutacak bir taca ihtiyacı olduğunu söylüyor.'''

["rnw_nation.1.a"]
source = "dac2a7edd2cc8b83"
text = '''Özgür şehirlerden oluşan bir cumhuriyet.'''

["rnw_nation.1.b"]
source = "7ab2b89252812153"
text = '''Ulusu bir arada tutacak bir taç.'''

["rnw_nation.2.title"]
source = "16ff1ee78d2287cd"
text = '''Sınır Bölgesi Kararnamesi'''

["rnw_nation.2.desc"]
source = "837b55fe72b75d71"
text = '''[target_location.GetNameWithNoTooltip] şehrindeki meclis, yerleşik kıyının ötesindeki toprakların ne olacağına karar vermeli. Arazi ölçerler oraları ölçüp satmak ve yollarla bağlamak istiyor; diğerleri ise o toprakların orada yaşayan halklara ait olduğunu söylüyor.'''

["rnw_nation.2.a"]
source = "a66b4892ba0f52a4"
text = '''Sınır bölgesini ölçün ve oraya yollar yapın.'''

["rnw_nation.2.b"]
source = "d89dfe8abb0da82d"
text = '''Sınır bölgesini oradaki halklara bırakın.'''

["rnw_nation.3.title"]
source = "e0d3ebbd474754be"
text = '''Ulus İçin Bir Taç'''

["rnw_nation.3.desc"]
source = "b44240c9bf06e2fa"
text = '''Delegeler bir taç seçti ve [target_location.GetNameWithNoTooltip] şehrindeki yeni saray kimi ödüllendireceğine karar vermeli: şehirlerin kurucularını mı, yoksa denizin ötesinden gelen eski aileleri mi.'''

["rnw_nation.3.a"]
source = "a8122d8c264b7555"
text = '''Şehirlerin kurucularını ödüllendirin.'''

["rnw_nation.3.b"]
source = "08d05dbcb8725972"
text = '''Eski ailelere onur verin.'''

["STATIC_MODIFIER_NAME_rnw_nation_roads"]
source = "69bccd5fa130c0bd"
text = '''Sınır Bölgesine Yollar'''

["STATIC_MODIFIER_DESC_rnw_nation_roads"]
source = "671d8ac3385e6289"
text = '''Arazi ölçerler ve yol yapımcıları ulusun yollarını yerleşik kıyının ötesine uzatıyor.'''

["rnw_naming.title"]
source = "82708204008b5b60"
text = '''Yeni Devlete Bir Ad'''

["rnw_naming.desc"]
source = "360aafa7c1166035"
text = '''Yeni devletin, komşularının onu tanıyacağı bir ada ihtiyacı var. Saraydaki bazıları ilan edildiği adı tercih ediyor; diğerleri ise ona şimdi yönettiği toprağın adını vermek istiyor.'''

["rnw_naming.keep"]
source = "83549dc6c7c223ec"
text = '''Adı koruyun: {name}.'''

["rnw_naming.take"]
source = "0eff740f9b97f82f"
text = '''Bu adı alın: {name}.'''

["rnw_formation_two_shores_name"]
source = "3bc268bf8490e630"
text = '''İki Kıyı İmparatorluğu'''

["rnw_formation_two_shores_name_adj"]
source = "400671422a0de267"
text = '''Okyanus Ötesi'''

["rnw_formation_two_worlds_name"]
source = "2f85382541be3bad"
text = '''İki Dünyanın Tacı'''

["rnw_formation_two_worlds_name_adj"]
source = "1349ccd918705484"
text = '''Atlantik Ötesi'''

["rnw_formation_two_oceans_name"]
source = "13126384cc6effe8"
text = '''İki Okyanus İmparatorluğu'''

["rnw_formation_two_oceans_name_adj"]
source = "00f9e76a2534af31"
text = '''İki Okyanuslu'''

["rnw_formation_two_peoples_name"]
source = "be9e07854a4e2e6b"
text = '''İki Halkın Devleti'''

["rnw_formation_two_peoples_name_adj"]
source = "aab153dd88cc8043"
text = '''İki Halklı'''

["rnw_formation_two_shores_desc"]
source = "473b50435cb358d9"
text = '''Bu kıtanın hiçbir halkı büyük okyanusun ötesinde hüküm sürmedi. Kıtanın kendi halklarından olup uzak kıyıda toprağa ve ana kıtasının büyük kısmına sahip olan bir güç, iki kıyının imparatorluğunu ilan edebilir: {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_shores_voyagers"]
source = "dec7efd625ab7d44"
text = '''Uzak Kıyıya Denizciler'''

["STATIC_MODIFIER_DESC_rnw_two_shores_voyagers"]
source = "b17650f2a8d54598"
text = '''Gemilerimiz büyük okyanusu aşarak hiçbir atanın bilmediği topraklara ulaşıyor.'''

["rnw_formation_two_worlds_desc"]
source = "8933a92bcf6a6335"
text = '''Eski bir ülkenin sarayı okyanusu aşıp bu kıtaya yerleşti, eski yurdu ise hâlâ ona bağlı. Okyanusun iki yakasında da hüküm süren ve başkenti burada olan bir taç, iki dünya üzerinde tek bir taç ilan edebilir: {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_worlds_union"]
source = "9bb6203ca44ee2f1"
text = '''Tek Taç, İki Dünya'''

["STATIC_MODIFIER_DESC_rnw_two_worlds_union"]
source = "ec15c579d765b459"
text = '''Eski yurt ve yeni saray aynı taca bağlı.'''

["rnw_formation_two_oceans_desc"]
source = "287d1ce2e64d72e3"
text = '''Bu kıta iki okyanusun arasında uzanır ve hiçbir güç ikisinde birden yelken açmadı. İkisinde de limanlara ve aradaki toprağın büyük kısmına sahip olan bir güç, iki okyanusun imparatorluğunu ilan edebilir: {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_oceans_sea_power"]
source = "5240aa554bdc6edf"
text = '''İki Okyanusun Hâkimi'''

["STATIC_MODIFIER_DESC_rnw_two_oceans_sea_power"]
source = "5997155c1a0aa978"
text = '''Donanmalarımız iki okyanusun deniz yollarını tutuyor.'''

["rnw_formation_great_law_desc"]
source = "984cd3a2649f2fa6"
text = '''Bir konfederasyonun halkları nesillerdir, her biri kendi meclisini koruyarak tek bir büyük yasa altında yaşıyor. Onlara önderlik eden ve topraklarının yeterli kısmına sahip olan şef, onları bu yasa altında tek bir devlette birleştirebilir: {name}.'''

["STATIC_MODIFIER_NAME_rnw_great_law_league"]
source = "06e46ef8dffbd992"
text = '''Büyük Yasanın Halkları'''

["STATIC_MODIFIER_DESC_rnw_great_law_league"]
source = "ae42b7744b3395cf"
text = '''Eski konfederasyonun halkları tek bir halk gibi savaşıp ticaret yapıyor.'''

["rnw_formation_two_peoples_desc"]
source = "7a91ebd282c9e756"
text = '''Yerleşimciler ve bu kıtanın halkları o kadar uzun süre birlikte evlenip ticaret yapıp dua ettiler ki artık birinin nerede bittiğini kimse söyleyemiyor. İki halkı da kendisinin sayan ve kıtanın büyük kısmına sahip olan bir devlet, iki halkın devletini ilan edebilir: {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_peoples_integration"]
source = "0fd80ff5371517ee"
text = '''İki Halk, Tek Devlet'''

["STATIC_MODIFIER_DESC_rnw_two_peoples_integration"]
source = "77bf4dd8870d78b3"
text = '''Devlet iki halkı da kendi halkı sayar ve geleneklerini hoş karşılar.'''

["rnw_road.name"]
source = "2a2a11954c349bc8"
text = '''{name} Yolunda'''

["rnw_road.desc"]
source = "e6619312e0e3825f"
text = '''Toprakları egemenliğimiz altında toplayıp yeni devleti ilan edin: {name}.'''

["rnw_road.seat"]
source = "c50808a05e63c6f2"
text = '''Merkezi Ele Geçirin'''

["rnw_road.seat_desc"]
source = "d248d862f432b46c"
text = '''Yeni devletin merkezi, toprakları onu izlemeden önce bizim olmalı.'''

["rnw_road.land"]
source = "9df238c90f736f30"
text = '''Toprakları Toplayın'''

["rnw_road.land_desc"]
source = "0f35b903317a3f42"
text = '''Yeni devleti ilan edebilmek için topraklarının büyük kısmına sahip olmalıyız.'''

["rnw_road.proclaim"]
source = "a3422fb1ef9d8d24"
text = '''Yeni Devleti İlan Edin'''

["rnw_road.proclaim_desc"]
source = "faed96e7a4804d75"
text = '''Topraklar elimizdeyken ilan edebiliriz: {name}.'''

