["estimate_tip"]
source = "34f3f38a503b4cdc"
text = "EU5'te konumlar kara vilayetlerini, deniz bölgelerini ve gölleri içerir (yaklaşık 22.000 tanesi sabit Eski Dünya'ya aittir).\n\nOyun motoru 16 bitlik bir dizin kullanır (en fazla ~32.767). Çökmeleri önlemek için oluşturucu toplamı güvenli bir şekilde 31.200'ün altında tutar.\n\n«Çok kara» seçildiğinde neden daha az konum görünebilir:\nDeniz bölgeleri de birer konumdur. Daha fazla kara daha az okyanus (daha az deniz bölgesi) anlamına gelir ve büyük kara kütlelerinde motor sınırını aşmamak için kara hücrelerinin boyutu otomatik olarak büyütülür. Sonuç olarak toplam konum sayısı azalabilir; bu bir hata değil, beklenen bütçe dengelemesidir."

