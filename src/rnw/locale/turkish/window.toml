["quick.empires.about"]
source = "7d5f92b53bffae0b"
text = '''Her kültür merkezinin çevresinde olağanüstü bir yerli toplumun doğma olasılığı. EU4'ün rastgele Yeni Dünya'sının fantastik modundaki gibi büyük bir imparatorluk: diğerlerinden kat kat büyük, gelişmiş bir yönetimi, Eski Dünya teknolojisi, daha yüksek rütbesi ve kraliyet yolları olan, komşularının korktuğu ve vasallarının nefret ettiği bir devlet. Ya da müttefik ama sularla ayrılmış deniz ticareti cumhuriyetlerinden bir birlik; dağ kabilelerinden bir konfederasyon; merkezleri birbirinin rakibi olan parçalanmış bir krallık; veya aynı inançtan rakipler arasında bir teokrasi olan kutsal bir merkez.'''

