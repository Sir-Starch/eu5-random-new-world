["rnw_river.1.title"]
source = "92e0bd96d3f7d7cb"
text = '''Der Fluss verlagert sein Bett'''

["rnw_river.1.desc"]
source = "626a705f44cf2607"
text = '''Seit Menschengedenken ernährt der große Fluss die Stadt [target_location.GetNameWithNoTooltip]. Seine Fluten haben die schwarzen Felder angeschwemmt, seine Kähne das Korn getragen, seine Anlegestellen die Stadt reich gemacht. Doch nun wandert die Fahrrinne mit jedem Frühjahr ein Stück weiter. Schlamm verstopft die alten Kanäle, das Hochwasser steigt bis in die unteren Gassen, und in den Kornspeichern liegt weniger, als die Verwalter melden.\n\nDie Ältesten der Stadt sind bei Hofe erschienen. Jeder von ihnen weiß ein Mittel, und jedes Mittel soll ein anderer bezahlen.'''

["rnw_river.1.a"]
source = "82f2af7fc49fa90d"
text = '''Errichtet Deiche und grabt neue Kanäle.'''

["rnw_river.1.b"]
source = "1d3aeeb4a84aaa1d"
text = '''Sollen die Kähne zahlen, nicht die Staatskasse. Die Ufer haben bisher gehalten.'''

["rnw_river.1.c"]
source = "f8be85141a01ff6a"
text = '''Die Flusszünfte kennen die Ufer am besten. Sollen sie sich darum kümmern.'''

["rnw_river.2.title"]
source = "6a275641a35939ba"
text = '''Die Deiche halten'''

["rnw_river.2.desc"]
source = "1730944712d980e7"
text = '''Das Frühjahrshochwasser kam wie jedes Jahr, doch diesmal machte es an den neuen Deichen halt. In den unteren Gassen der Stadt [target_location.GetNameWithNoTooltip], wo das Wasser früher einen Monat lang auf den Märkten stand, stieg es nicht über die Kais. Nun fragen die Deichwarte, was wir mit dem erkauften Frieden anfangen wollen.'''

["rnw_river.2.a"]
source = "9e79ef1545fd4538"
text = '''Baut Kornspeicher auf den neuen Ufern.'''

["rnw_river.2.b"]
source = "759e276ad8df9603"
text = '''Behaltet den Überschuss in der Staatskasse.'''

["rnw_river.3.title"]
source = "4a122d8033ed158d"
text = '''Der Fluss fordert seinen Tribut'''

["rnw_river.3.desc"]
source = "725fb974622a5736"
text = '''Die Zölle füllten die Staatskasse, und um die Ufer kümmerte sich niemand. In diesem Frühjahr stieg der Fluss, fand die schwächste Stelle und brach durch. Als das Wasser fiel, lagen die unteren Viertel der Stadt [target_location.GetNameWithNoTooltip] unter Schlamm, die Brunnen waren verdorben, und Kähne saßen mitten in den Gassen fest. Die Zolleinnehmer melden, jeder Zoll sei vollständig bezahlt worden. Im nächsten Jahr wird niemand mehr da sein, der ihn bezahlt.'''

["rnw_river.3.a"]
source = "1f90ed5c7e74788b"
text = '''Räumt die Wasserläufe sofort, koste es, was es wolle!'''

["rnw_river.3.b"]
source = "6b1f172f635f13c1"
text = '''Bringt die Kornlager auf höheren Grund und lasst die Unterstadt trocknen.'''

["rnw_river.4.title"]
source = "d2f2732e667707f6"
text = '''Die Uferwächter'''

["rnw_river.4.desc"]
source = "b5613a29ee18d1f6"
text = '''Seit einigen Jahren halten die Flusszünfte die Ufer instand. Sie tun es billiger, als der Hof es je vermochte, und sie tun es für sich selbst: Ihre eigenen Anlegestellen sind die besten am ganzen Fluss, und ihr Viertel in der Stadt [target_location.GetNameWithNoTooltip] ist reich geworden. Nun wollen sie ihre Rechte in einem Freibrief niedergeschrieben und gesiegelt sehen.'''

["rnw_river.4.a"]
source = "dd1b6bf31029741d"
text = '''Siegelt den Freibrief.'''

["rnw_river.4.b"]
source = "0be0f5f1950156b6"
text = '''Die Ufer gehören uns, und ihre Einkünfte ebenso.'''

["STATIC_MODIFIER_NAME_rnw_river_works_levy"]
source = "a523fe899a7ea525"
text = '''Abgabe für die Flussbauten'''

["STATIC_MODIFIER_DESC_rnw_river_works_levy"]
source = "2f5f4e6ef6a29203"
text = '''Die Staatskasse bezahlt Deiche und Kanäle.'''

["STATIC_MODIFIER_NAME_rnw_river_embankments"]
source = "ae3489a3d912387e"
text = '''Neue Deiche'''

["STATIC_MODIFIER_DESC_rnw_river_embankments"]
source = "a76eafa92c87b566"
text = '''Hohe Ufer halten das Hochwasser aus den Gassen, kosten aber einige Felder.'''

["STATIC_MODIFIER_NAME_rnw_river_flood_security"]
source = "1ae8af4d8317f884"
text = '''Sicher vor den Fluten'''

["STATIC_MODIFIER_DESC_rnw_river_flood_security"]
source = "e1c9f75f6ca103d6"
text = '''Mit Kornspeichern an den Ufern und Jahren ohne Hochwasser wächst die Stadt.'''

["STATIC_MODIFIER_NAME_rnw_river_toll_regime"]
source = "2325272caa1fc50d"
text = '''Flusszölle'''

["STATIC_MODIFIER_DESC_rnw_river_toll_regime"]
source = "7bc728fde2c624c0"
text = '''Zölle auf den Flusshandel füllen die Staatskasse, gebaut wird wenig.'''

["STATIC_MODIFIER_NAME_rnw_river_silted"]
source = "6645f38bbe916505"
text = '''Schlamm und verdorbene Brunnen'''

["STATIC_MODIFIER_DESC_rnw_river_silted"]
source = "71d43f13b24b2c87"
text = '''Die Flut ließ Schlamm in den Gassen und Unrat in den Brunnen zurück.'''

["STATIC_MODIFIER_NAME_rnw_river_guild_wardens"]
source = "49b7b65e12987132"
text = '''Zunftwächter der Ufer'''

["STATIC_MODIFIER_DESC_rnw_river_guild_wardens"]
source = "005b04e0edd2a62e"
text = '''Die Flusszünfte halten die Ufer, und ihr Viertel blüht.'''

["STATIC_MODIFIER_NAME_rnw_river_ceded_authority"]
source = "426cada75292d210"
text = '''Abgetretene Macht'''

["STATIC_MODIFIER_DESC_rnw_river_ceded_authority"]
source = "04b40955826a764e"
text = '''Der Fluss ist nun in der Hand der Zünfte, und jeder sieht, dass der Hof ihnen gehorcht.'''

["rnw_sacred.1.title"]
source = "14db3bc6b023c41f"
text = '''Pilger am Tor'''

["rnw_sacred.1.desc"]
source = "fbb674e14759b2da"
text = '''Mit jeder Jahreszeit kommen mehr Pilger in die Stadt [target_location.GetNameWithNoTooltip]. Sie schlafen in den Gassen, legen Opfergaben an den alten Steinen nieder und tragen den Namen des Ortes heim in Dörfer, von denen der Hof nie gehört hat. Die Priester des Heiligtums klagen, es sei seinen Mauern entwachsen, die Verwalter, es sei der Staatskasse entwachsen.'''

["rnw_sacred.1.a"]
source = "3081223f1c8bccd8"
text = '''Stiftet dem Heiligtum Gaben und pflastert den Pilgerweg.'''

["rnw_sacred.1.b"]
source = "1ea92073f4910495"
text = '''Opfergaben sind auch Reichtum. Die Staatskasse soll ihren Zehnten nehmen.'''

["rnw_sacred.1.c"]
source = "eb18d88fda18c1ba"
text = '''Gebt dem Hohepriester einen Sitz unter den Ständen.'''

["rnw_sacred.2.title"]
source = "e59e8a0a9dcaf42a"
text = '''Das Heiligtum blüht'''

["rnw_sacred.2.desc"]
source = "9b927b118cf86cc9"
text = '''Die Stiftung hat erreicht, was die Verwalter für unmöglich hielten. Der Weg ist gepflastert, die Herbergen sind voll, und die Pilger, die in die Stadt [target_location.GetNameWithNoTooltip] kommen, bleiben nun, um Handel zu treiben. Die Priester möchten das Werk mit einem großen Tempel krönen und bitten uns, den Grundstein zu legen.'''

["rnw_sacred.2.a"]
source = "a8546ab9c5e84d1e"
text = '''Errichtet den großen Tempel.'''

["rnw_sacred.2.b"]
source = "1d7789d49a751d66"
text = '''Der Weg genügt. Die Opfergaben sollen ihn erhalten.'''

["rnw_sacred.3.title"]
source = "b738cb2aebdb6289"
text = '''Die Priester murren'''

["rnw_sacred.3.desc"]
source = "43d99291120fc2da"
text = '''Der Zehnte hat die Staatskasse gefüllt, und die Priester der Stadt [target_location.GetNameWithNoTooltip] haben es bemerkt. Die Opfergaben, sagen sie, gehören denen, die sie gaben, und denen, die die Steine hüten. Einige sagen es bereits in ihren Predigten, und die Pilger hören zu.'''

["rnw_sacred.3.a"]
source = "8ef903596e032ae3"
text = '''Gebt dem Heiligtum einen Teil des Zehnten zurück.'''

["rnw_sacred.3.b"]
source = "b9ee3667a4b96cea"
text = '''Behaltet den Zehnten und antwortet den Predigern.'''

["rnw_sacred.4.title"]
source = "10c7c5c30cb195f0"
text = '''Eine Priesterschaft mit Sitz und Stimme'''

["rnw_sacred.4.desc"]
source = "8c892f0f18621ad5"
text = '''Der Hohepriester der Stadt [target_location.GetNameWithNoTooltip] sitzt nun unter den Ständen, und der alte Orden des Heiligtums hat eine Stimme in unseren Räten. Die Priester sind dankbar. Die anderen Stände rechnen nach, was diese Stimme sie kosten wird.'''

["rnw_sacred.4.a"]
source = "4330d21686c0ce81"
text = '''Heißt die Priesterschaft in unseren Räten willkommen.'''

["rnw_sacred.4.b"]
source = "21757a395a14481c"
text = '''Ihr Platz ist am Heiligtum. Dort sollen sie bleiben.'''

["STATIC_MODIFIER_NAME_rnw_sacred_endowment"]
source = "d89ae9c084fe8693"
text = '''Reich beschenktes Heiligtum'''

["STATIC_MODIFIER_DESC_rnw_sacred_endowment"]
source = "b66728b3884d01a5"
text = '''Ein reiches Heiligtum und ein gepflasterter Weg ziehen Pilger an, und das Ansehen der Priester wächst.'''

["STATIC_MODIFIER_NAME_rnw_sacred_great_temple"]
source = "f882d7291f2780eb"
text = '''Der große Tempel'''

["STATIC_MODIFIER_DESC_rnw_sacred_great_temple"]
source = "ab9fc088bd475eb8"
text = '''Ein Tempel über den alten Steinen zieht die Gläubigen des ganzen Landes an.'''

["rnw_sacred_priesthood"]
source = "f5ddb8a6f494aa7f"
text = '''Hohepriesterschaft des Heiligtums'''

["rnw_sacred_priesthood_desc"]
source = "702d509ab2bca453"
text = '''Der Hohepriester des Heiligtums ist allein dem Glauben verantwortlich und sitzt unter den Ständen.'''

["rnw_harvest.1.title"]
source = "7414bd76241e6373"
text = '''Eine magere Ernte'''

["rnw_harvest.1.desc"]
source = "8d3e07bbbc63f306"
text = '''Der Regen kam spät, und die Ernte fiel mager aus. In der Stadt [target_location.GetNameWithNoTooltip] stehen die Kornspeicher halb leer, das Brot kostet doppelt so viel wie vor einem Monat, und die Stadt isst mehr, als ihre Felder je hervorgebracht haben. Die Vögte haben ihre Kerbhölzer zu Hofe gebracht. Nach ihrer Rechnung reichen die Vorräte bis Mittwinter und keinen Tag länger.'''

["rnw_harvest.1.a"]
source = "b9128dbfc34c11ef"
text = '''Kauft Korn aus den Ländern jenseits der Hügel.'''

["rnw_harvest.1.b"]
source = "48ca59b7247e6e46"
text = '''Teilt die Vorräte zu und holt Korn aus den Dörfern.'''

["rnw_harvest.1.c"]
source = "59b06a6dfe15e6f5"
text = '''Brecht neues Land um und legt die nassen Ränder der Ebene trocken.'''

["rnw_harvest.2.title"]
source = "b864653930eba4f6"
text = '''Die Kornhändler'''

["rnw_harvest.2.desc"]
source = "8613f15217b19cb9"
text = '''Das Korn, das die Stadt [target_location.GetNameWithNoTooltip] im letzten Winter ernährte, ging durch die Hände weniger Handelshäuser, und die wissen noch genau, wer es brauchte. Sie halten die Speicher der Unterstadt und bestimmen den Preis auf dem Markt. Nun bitten sie den Hof, schriftlich festzuhalten, was sie seit einem Jahr ungefragt tun.'''

["rnw_harvest.2.a"]
source = "3ea1c894f5f58390"
text = '''Gewährt den Kornhändlern ihren Freibrief.'''

["rnw_harvest.2.b"]
source = "e750455aaa79a190"
text = '''Brecht ihren Griff. Die Stadt wird eigene Kornspeicher haben.'''

["rnw_harvest.3.title"]
source = "b8dc6154ad1a5ba9"
text = '''Die Dörfer vergessen nicht'''

["rnw_harvest.3.desc"]
source = "5effe1c27c476a5d"
text = '''Im letzten Winter mussten die Dörfer ihr Saatkorn hergeben, und sie haben es nicht verziehen. Auf den Frühjahrsmärkten der Stadt [target_location.GetNameWithNoTooltip] bringen die Bauern weniger und verlangen mehr, und die Fuhrleute erzählen von brachliegenden Feldern. Die Verwalter nennen die Abgabe noch immer eine Notwendigkeit. In den Dörfern hat man ein anderes Wort dafür.'''

["rnw_harvest.3.a"]
source = "aeb2ec223c206740"
text = '''Entschädigt die Dörfer mit Münzen und Saatgut.'''

["rnw_harvest.3.b"]
source = "4cd56e1f7e49ab8c"
text = '''Die Abgabe hat die Stadt gerettet. Wir schulden ihnen nichts.'''

["rnw_harvest.4.title"]
source = "3ce7ba744b922586"
text = '''Die neuen Felder tragen'''

["rnw_harvest.4.desc"]
source = "486ef3cd8f067612"
text = '''Zwei Ernten später wächst auf den trockengelegten Feldern vor der Stadt [target_location.GetNameWithNoTooltip] Korn, wo einst Schilf stand. Familien aus den engen Gassen bitten um einen Anteil am neuen Land, und die Verwalter um den Zehnten davon.'''

["rnw_harvest.4.a"]
source = "de93940b4373a913"
text = '''Gebt das neue Land den Familien der Stadt.'''

["rnw_harvest.4.b"]
source = "c4df8221ae4cfb2b"
text = '''Verkauft das neue Land und verschifft sein Korn ins Ausland.'''

["STATIC_MODIFIER_NAME_rnw_harvest_bought_grain"]
source = "7900f536a98f53b1"
text = '''Korn aus der Fremde'''

["STATIC_MODIFIER_DESC_rnw_harvest_bought_grain"]
source = "1f67be7e997a813f"
text = '''Gekauftes Korn hält das Brot billig, und die Stadt wächst.'''

["STATIC_MODIFIER_NAME_rnw_harvest_rationing"]
source = "de6c8e4aead4b07e"
text = '''Zuteilung'''

["STATIC_MODIFIER_DESC_rnw_harvest_rationing"]
source = "01c25979dab3a732"
text = '''Die Verwalter teilen die Vorräte zu. Die Stadt isst weniger und murrt mehr.'''

["STATIC_MODIFIER_NAME_rnw_harvest_new_fields"]
source = "eec28f043b4893e4"
text = '''Neue Felder'''

["STATIC_MODIFIER_DESC_rnw_harvest_new_fields"]
source = "331936206e72ec4b"
text = '''Trockengelegtes Marschland und gerodeter Boden bringen jedes Jahr mehr Korn.'''

["STATIC_MODIFIER_NAME_rnw_harvest_grain_charter"]
source = "ebbe64679fd1d263"
text = '''Freibrief der Kornhändler'''

["STATIC_MODIFIER_DESC_rnw_harvest_grain_charter"]
source = "69aad4155c615edd"
text = '''Die Kornhäuser führen den Handel mit Freibrief, und sie führen ihn für das ganze Land.'''

["STATIC_MODIFIER_NAME_rnw_harvest_public_granaries"]
source = "7dbd345b2a99d507"
text = '''Öffentliche Kornspeicher'''

["STATIC_MODIFIER_DESC_rnw_harvest_public_granaries"]
source = "4cd7ab6bfd85feb0"
text = '''Speicher, die in guten Jahren gefüllt werden, ernähren die Stadt in schlechten.'''

["STATIC_MODIFIER_NAME_rnw_harvest_shared_fields"]
source = "71166726228ef47f"
text = '''Felder der vielen Familien'''

["STATIC_MODIFIER_DESC_rnw_harvest_shared_fields"]
source = "95c8419beae21455"
text = '''Kleine Parzellen, auf denen drei Feldfrüchte zusammen wachsen, tragen mehr als ein großes Feld.'''

["rnw_route.1.title"]
source = "17b79f9baa1ed0d8"
text = '''Eine Straße zwischen zwei Städten'''

["rnw_route.1.desc"]
source = "ddbf1581c0b6184c"
text = '''Zwischen den Städten [target_location.GetNameWithNoTooltip] und [other_location.GetNameWithNoTooltip] liegen nur wenige Tagesreisen, verbunden durch einen Pfad, den der Regen jedes Frühjahr fortspült. Korn geht in die eine Richtung, Tuch in die andere, und jeder Karren zahlt in jedem Dorf dazwischen Zoll. Die Zünfte beider Städte sind mit derselben Klage und zwei ganz verschiedenen Plänen bei Hofe erschienen.'''

["rnw_route.1.a"]
source = "d78f7e1033b86865"
text = '''Pflastert eine Straße zwischen den beiden Städten.'''

["rnw_route.1.b"]
source = "01a8f4fc68cb4769"
text = '''Sollen die Kaufleute sie bauen und die Zölle behalten.'''

["rnw_route.1.c"]
source = "3580ca452039d687"
text = '''Schließt einen Pakt mit den Dörfern: ein Markttag an jeder Wegkreuzung.'''

["rnw_route.2.title"]
source = "a052755d15b37de5"
text = '''Die Straße ist offen'''

["rnw_route.2.desc"]
source = "68ac73a0974b8662"
text = '''Die ersten Karawanen zogen über die neue Straße, bevor die letzten Steine lagen. Zwischen den Städten [target_location.GetNameWithNoTooltip] und [other_location.GetNameWithNoTooltip] braucht ein Karren nun nur noch einen Tag, und die Schreiber beider Städte streiten schon darüber, wessen Markt die Straße eigentlich dient.'''

["rnw_route.2.a"]
source = "7f5b2c593742c5ae"
text = '''Besetzt die Straße mit Wachen und haltet sie instand.'''

["rnw_route.2.b"]
source = "c3409d39e4a5cbc5"
text = '''Erhebt an beiden Enden Zoll, dann trägt sich die Straße selbst.'''

["rnw_route.3.title"]
source = "90116ff1a796c6a4"
text = '''Die Zölle drücken'''

["rnw_route.3.desc"]
source = "c1fe956ac01de067"
text = '''Die Kaufleute, die die Straße gebaut haben, mussten lernen, dass ein einmal erhobener Zoll gern wächst. Die Fuhrleute aus der Stadt [other_location.GetNameWithNoTooltip] zahlen doppelt so viel wie früher, und das Tuch aus der Stadt [target_location.GetNameWithNoTooltip] kostet am Tor so viel wie die Straße selbst. Jede der beiden Städte ist überzeugt, dass die andere das Ohr des Hofes hat.'''

["rnw_route.3.a"]
source = "e923c85312c866f6"
text = '''Begrenzt die Zölle auf den alten Satz.'''

["rnw_route.3.b"]
source = "7e020e3a8a2c3706"
text = '''Sie haben die Straße gebaut. Die Zölle bestimmen sie.'''

["rnw_route.4.title"]
source = "10f26d56a6e76b94"
text = '''Die Markttage'''

["rnw_route.4.desc"]
source = "aaf0c0ee103e6317"
text = '''Die Dörfer entlang des Weges haben ihren Pakt gehalten. Zweimal im Jahr wird an jeder Wegkreuzung ein Markt abgehalten, und die Händler aus den Städten [target_location.GetNameWithNoTooltip] und [other_location.GetNameWithNoTooltip] treffen sich dort auf halbem Weg, zum Nutzen beider und zum Ärger ihrer Zünfte.'''

["rnw_route.4.a"]
source = "cbae934ee2f13376"
text = '''Verleiht den Märkten Freibriefe und schickt einen Amtmann an jede Kreuzung.'''

["rnw_route.4.b"]
source = "13982e51c2013d53"
text = '''Die Märkte gehören den Dörfern. Lasst sie gewähren.'''

["STATIC_MODIFIER_NAME_rnw_route_road_works"]
source = "66ad90cecaf4bd40"
text = '''Straßenbau'''

["STATIC_MODIFIER_DESC_rnw_route_road_works"]
source = "8e72bb5a1ffc090e"
text = '''Der Hof bezahlt die Straßen, und die Arbeit geht rasch voran.'''

["STATIC_MODIFIER_NAME_rnw_route_paved_road"]
source = "98fcf86049be9ec6"
text = '''Eine gepflasterte Straße'''

["STATIC_MODIFIER_DESC_rnw_route_paved_road"]
source = "f659c880bb37a357"
text = '''Waren kommen leichter voran, und die Orte an der Straße wachsen.'''

["STATIC_MODIFIER_NAME_rnw_route_toll_charter"]
source = "1becfec2af2080e4"
text = '''Freibrief der Straßenkaufleute'''

["STATIC_MODIFIER_DESC_rnw_route_toll_charter"]
source = "77d89d175cf34976"
text = '''Die Kaufleute, die die Straße unterhalten, haben das Recht, Zoll zu erheben.'''

["STATIC_MODIFIER_NAME_rnw_route_tollgates"]
source = "59a6708e1f27a073"
text = '''Zollschranken'''

["STATIC_MODIFIER_DESC_rnw_route_tollgates"]
source = "0eb630f29a131442"
text = '''Ein Zollhaus am Tor lockt Kaufleute und ihre Lagerhäuser in die Stadt.'''

["STATIC_MODIFIER_NAME_rnw_route_market_days"]
source = "3799c1d3a4c60003"
text = '''Markttage'''

["STATIC_MODIFIER_DESC_rnw_route_market_days"]
source = "131c4b31d90a3282"
text = '''An Markttagen kommen Händler aus den Dörfern entlang der Straße in die Stadt.'''

["STATIC_MODIFIER_NAME_rnw_route_royal_road"]
source = "9f6f82b77f43df6c"
text = '''Die Straße des Hofes'''

["STATIC_MODIFIER_DESC_rnw_route_royal_road"]
source = "656bc06618361b8b"
text = '''Eine bewachte Straße hält den Handel in der Hand des Hofes.'''

["STATIC_MODIFIER_NAME_rnw_route_tolls_resented"]
source = "2783775338f9a5e5"
text = '''Verhasste Zölle'''

["STATIC_MODIFIER_DESC_rnw_route_tolls_resented"]
source = "70c644c2e242f783"
text = '''Die Kaufleute zahlen, murren und kommen seltener.'''

["STATIC_MODIFIER_NAME_rnw_route_chartered_fairs"]
source = "400ab144d804cb98"
text = '''Privilegierte Messen'''

["STATIC_MODIFIER_DESC_rnw_route_chartered_fairs"]
source = "1f6b8a428c613b72"
text = '''Eine große Messe zur rechten Zeit füllt die Lagerhäuser und die Gasthöfe.'''

["rnw_alliance.1.title"]
source = "0a9723a4376aee4a"
text = '''Gesandte aus dem Nachbartal'''

["rnw_alliance.1.desc"]
source = "bd5bab3bfb9c7e73"
text = '''Gesandte des Reiches [target_country.GetName] sind in der Stadt [target_location.GetNameWithNoTooltip] eingetroffen. Unsere beiden Höfe teilen ihre Götter oder ihre Sprache und haben dieselben Feinde an denselben Grenzen, und doch haben sie einander seit Generationen nichts als Beschwerden geschickt. Die Gesandten schlagen einen Rat vor, in dem unsere Herrscher als Gleiche sprechen. Unseren eigenen Räten wäre es lieber, die Gesandten wären zu Hause geblieben.'''

["rnw_alliance.1.a"]
source = "15a2cfcd922dca1b"
text = '''Wir setzen uns als Gleiche mit ihnen an einen Tisch.'''

["rnw_alliance.1.b"]
source = "7a151d25cff53199"
text = '''Bietet ihnen unseren Schutz an und verlangt Ehrerbietung.'''

["rnw_alliance.1.c"]
source = "de59b81b969ac9c8"
text = '''Dankt ihnen und behaltet unsere Pläne für uns.'''

["rnw_alliance.2.title"]
source = "df87f78fb7bb254c"
text = '''Der Rat tritt zusammen'''

["rnw_alliance.2.desc"]
source = "f5c51924af6a43bb"
text = '''Unser Herrscher und der Herrscher des Reiches [target_country.GetName] sind dreimal zusammengekommen, und jedes Mal schieden sie mit weniger Argwohn. Der Rat hat begonnen, kleine Grenzstreitigkeiten zu schlichten, bevor sie zu großen werden. Die Heiratsvermittler bei Hofe stellen schon Listen auf. Die alten Räte finden, ein Rat sei Nähe genug.'''

["rnw_alliance.2.a"]
source = "f7553e538c2c5d60"
text = '''Verbindet unsere Häuser durch Heirat und Vertrag.'''

["rnw_alliance.2.b"]
source = "d5231e75b558f470"
text = '''Ein Rat genügt.'''

["rnw_alliance.3.title"]
source = "95d1851c898dcd26"
text = '''Der Nachbar sträubt sich'''

["rnw_alliance.3.desc"]
source = "f7a5f1fa41415482"
text = '''Der Hof des Reiches [target_country.GetName] hat unser Schutzangebot genau so verstanden, wie es gemeint war. Seine Gesandten sind abgereist, seine Kaufleute zurückgerufen, und ein eigenhändiger Brief seines Herrschers ist eingetroffen, der fragt, mit welchem Recht wir von Ehrerbietung sprechen.'''

["rnw_alliance.3.a"]
source = "a3f03c95f2201b69"
text = '''Zieht die Forderung zurück und schickt Geschenke.'''

["rnw_alliance.3.b"]
source = "c3606a1ff3772d42"
text = '''Wir haben gesagt, was wir meinten.'''

["rnw_alliance.4.title"]
source = "4994a20174264735"
text = '''Eine verschlossene Tür'''

["rnw_alliance.4.desc"]
source = "99b9a3176855a9b6"
text = '''Das Reich [target_country.GetName] hat unsere Antwort erhalten und sich anderswohin gewandt. Seine Gesandten warten nun in den Hallen unserer anderen Nachbarn, und eine Grenze, die ruhig war, wird von beiden Seiten beobachtet. Unsere Räte fragen sich laut, ob die Ablehnung klug war.'''

["rnw_alliance.4.a"]
source = "4259618be211b74a"
text = '''Schickt eine zweite Gesandtschaft, mit offenen Händen.'''

["rnw_alliance.4.b"]
source = "e93860b578aaccc1"
text = '''Die Ablehnung bleibt bestehen.'''

["STATIC_MODIFIER_NAME_rnw_alliance_council"]
source = "770bd2d09ef98473"
text = '''Rat der Nachbarn'''

["STATIC_MODIFIER_DESC_rnw_alliance_council"]
source = "7e12330fb21cd9ec"
text = '''Der Hof teilt seine Beratungen mit einem Nachbarn, und der Adel erhält eine Stimme.'''

["STATIC_MODIFIER_NAME_rnw_alliance_trust"]
source = "92b82fb0dfb1d768"
text = '''Vertrauen des Rates'''

["STATIC_MODIFIER_DESC_rnw_alliance_trust"]
source = "51030e82704b3b5d"
text = '''Einem Herrscher, der mit seinen Nachbarn Rat hält, vertraut man auch in der Ferne.'''

["STATIC_MODIFIER_NAME_rnw_alliance_pressure"]
source = "4d41271ee4c1c9b5"
text = '''Druck auf den Nachbarn'''

["STATIC_MODIFIER_DESC_rnw_alliance_pressure"]
source = "2e3fdc370d3f6800"
text = '''Unsere Forderungen nach Ehrerbietung haben unser Wort im Ausland entwertet.'''

["STATIC_MODIFIER_NAME_rnw_alliance_closed_doors"]
source = "d1172dac1d7b4be4"
text = '''Verschlossene Türen'''

["STATIC_MODIFIER_DESC_rnw_alliance_closed_doors"]
source = "1297419ab21e731f"
text = '''Der Hof behält seine Pläne für sich und bewacht seine Grenzen genauer.'''

["STATIC_MODIFIER_NAME_rnw_alliance_kinship"]
source = "39af4f6133d6df49"
text = '''Verwandtschaft der Höfe'''

["STATIC_MODIFIER_DESC_rnw_alliance_kinship"]
source = "348f802c9c5898e2"
text = '''Zwei durch Heirat und Vertrag verbundene Höfe stützen einander die Herrschaft.'''

["rnw_empire.1.title"]
source = "62131d2aa18b57b3"
text = '''Die fernen Provinzen'''

["rnw_empire.1.desc"]
source = "b3f20f53e083d0d6"
text = '''Unser Reich ist über seine Straßen hinausgewachsen. In der Gegend um [other_location.GetNameWithNoTooltip], fern der Stadt [target_location.GetNameWithNoTooltip], leben die Menschen nach ihren eigenen Bräuchen und unter ihren eigenen Herren. Ihre Abgaben schicken sie spät und ihre Söhne nie. Die Statthalter schreiben, in der Provinz sei es ruhig. Die Kaufleute schreiben das Gegenteil.'''

["rnw_empire.1.a"]
source = "fdce9c056aae7a98"
text = '''Schickt einen Statthalter und mit ihm eine Garnison.'''

["rnw_empire.1.b"]
source = "8812b394529a3f72"
text = '''Gewährt der Provinz einen Freibrief für ihre eigenen Bräuche.'''

["rnw_empire.1.c"]
source = "5c69a3d7bef4e4b7"
text = '''Siedelt Familien aus dem Kernland unter ihnen an.'''

["rnw_empire.2.title"]
source = "41d67ad90c64b242"
text = '''Der lange Arm des Statthalters'''

["rnw_empire.2.desc"]
source = "92d302c32a7ac0ac"
text = '''Der Statthalter in [other_location.GetNameWithNoTooltip] schreibt, die Garnison werde bezahlt und die Abgaben träfen pünktlich ein. Er schreibt auch, er habe ein Haus im alten Viertel bezogen und eine Frau aus einer einheimischen Familie genommen, und die alten Herren speisten nun an seiner Tafel. Bei Hofe weiß man nicht recht, ob man sich darüber freuen soll.'''

["rnw_empire.2.a"]
source = "907c999481100ab0"
text = '''Wechselt die Statthalter alle paar Jahre aus.'''

["rnw_empire.2.b"]
source = "c88e953a927b6081"
text = '''Lasst ihn bleiben. Ein Statthalter, der dazugehört, hält die Provinz.'''

["rnw_empire.3.title"]
source = "f762ad04d9157935"
text = '''Freibriefe machen Schule'''

["rnw_empire.3.desc"]
source = "fb8833f438984ce3"
text = '''Die Nachricht vom Freibrief für [other_location.GetNameWithNoTooltip] erreichte die anderen fernen Provinzen schneller als jeder Steuereintreiber. Drei weitere haben Abordnungen geschickt und bitten um dasselbe, und der Adel des Kernlandes will wissen, warum die Provinzen dafür belohnt werden, dass sie weit weg liegen.'''

["rnw_empire.3.a"]
source = "457ea5dfb53e0233"
text = '''Gewährt jeder Provinz einen Freibrief, die darum bittet.'''

["rnw_empire.3.b"]
source = "a301d5f22d7e2ae7"
text = '''Der Freibrief war eine Gunst, kein Präzedenzfall.'''

["rnw_empire.4.title"]
source = "2664836ec5cbc723"
text = '''Neue Nachbarn'''

["rnw_empire.4.desc"]
source = "f169c081cb60dbfa"
text = '''Die Siedler aus dem Kernland haben ihre Häuser entlang der Straße nach [other_location.GetNameWithNoTooltip] gebaut. Sie sprechen unsere Sprache und verehren unsere Götter, und die alten Familien der Provinz halten Abstand. Ein Streit auf dem Markt hat bereits mit Messern geendet.'''

["rnw_empire.4.a"]
source = "ec34ab3bd43f2394"
text = '''Gebt den alten Familien Sitze im Stadtrat.'''

["rnw_empire.4.b"]
source = "cd86a45da7beedf3"
text = '''Stellt euch hinter die Siedler.'''

["STATIC_MODIFIER_NAME_rnw_empire_governors"]
source = "0a5b658f90379880"
text = '''Treue Statthalter'''

["STATIC_MODIFIER_DESC_rnw_empire_governors"]
source = "935eed9d151d7f60"
text = '''Statthalter in den fernen Provinzen halten sie in der Hand des Hofes.'''

["STATIC_MODIFIER_NAME_rnw_empire_charter"]
source = "d89d5d11954b3e88"
text = '''Freibrief der Bräuche'''

["STATIC_MODIFIER_DESC_rnw_empire_charter"]
source = "67f1426d24223a0f"
text = '''Eine Provinz, der man ihre Bräuche lässt, bleibt ruhig und gedeiht.'''

["STATIC_MODIFIER_NAME_rnw_empire_concessions"]
source = "7728535fb503cff5"
text = '''Zugeständnisse an die Provinzen'''

["STATIC_MODIFIER_DESC_rnw_empire_concessions"]
source = "69956a726e8024ef"
text = '''Der Griff des Kernlandes um die fernen Länder hat sich gelockert.'''

["STATIC_MODIFIER_NAME_rnw_empire_settlers"]
source = "2664836ec5cbc723"
text = '''Neue Nachbarn'''

["STATIC_MODIFIER_DESC_rnw_empire_settlers"]
source = "17a5f3daf73206d0"
text = '''Siedler aus dem Kernland ziehen ihre Verwandten nach, und die Märkte der Provinz wachsen.'''

["rnw_contact.1.title"]
source = "3ae4dd728bdb0317"
text = '''Fremde an der Küste'''

["rnw_contact.1.desc"]
source = "df50117779215e8b"
text = '''Schiffe des Reiches [target_country.GetName] liegen vor der Küste bei der Stadt [target_location.GetNameWithNoTooltip] vor Anker. Ihre Seeleute sagen, sie hätten den Ozean überquert und ihre Herrscher wünschten Handel, vielleicht auch mehr als Handel. Niemand an der Küste hat je ihresgleichen gesehen. Die Ältesten haben dreimal getagt und nichts entschieden.'''

["rnw_contact.1.a"]
source = "1910e1304b98965e"
text = '''Empfangt ihre Gesandten und treibt Handel mit ihnen.'''

["rnw_contact.1.b"]
source = "7937e04750afd2ba"
text = '''Lasst sie nur in einen einzigen Hafen und behaltet ihn im Auge.'''

["rnw_contact.1.c"]
source = "11a4bdfc1552603a"
text = '''Ruft die Küste gegen sie zu den Waffen!'''

["rnw_contact.2.title"]
source = "7983278f691c0b78"
text = '''Die Kaufleute der Fremden'''

["rnw_contact.2.desc"]
source = "ef63c05517b4c517"
text = '''Die Fremden sind mit mehr Schiffen und mehr Waren zurückgekehrt. Ihre Kaufleute wollen ein Haus am Kai der Stadt [target_location.GetNameWithNoTooltip], das Recht, im Landesinneren einzukaufen, und eine Audienz bei Hofe. Unsere eigenen Händler wollen genau das Gegenteil.'''

["rnw_contact.2.a"]
source = "532b58aea7fb3c34"
text = '''Gebt ihnen ihr Haus am Kai.'''

["rnw_contact.2.b"]
source = "0c029953515255ad"
text = '''Haltet sie an der Küste und fern der Straßen ins Landesinnere.'''

["rnw_contact.3.title"]
source = "079ea349cfe3a666"
text = '''Wache am einzigen Hafen'''

["rnw_contact.3.desc"]
source = "bd655dadc4c1ee5f"
text = '''Die Fremden halten sich an den einen Hafen, der ihnen zugewiesen wurde, und die Wächter der Stadt [target_location.GetNameWithNoTooltip] zählen jede Woche ihre Schiffe. Im Landesinneren flüstert man, die Fremden brächten Krankheiten und fremde Götter. Die Ältesten fragen, ob der eine offene Hafen Klugheit war oder bloße Angst.'''

["rnw_contact.3.a"]
source = "1e43074d26db018a"
text = '''Behaltet die Wache und den einen Hafen bei.'''

["rnw_contact.3.b"]
source = "18a10769a3286589"
text = '''Öffnet einen zweiten Hafen, um den Streit zu dämpfen.'''

["rnw_contact.4.title"]
source = "b4aca21e2ef18f6d"
text = '''Die Küste steht bereit'''

["rnw_contact.4.desc"]
source = "1e9691bfcfdd1bf4"
text = '''Eine ganze Jahreszeit lang standen die Aufgebote am Ufer bei der Stadt [target_location.GetNameWithNoTooltip], und die Fremden sind nicht gelandet. Ihre Schiffe kommen und gehen jenseits des Riffs, und auf den Feldern werden die Männer gebraucht.'''

["rnw_contact.4.a"]
source = "02c8d386760acd8b"
text = '''Entlasst die Aufgebote und schickt einen Gesandten.'''

["rnw_contact.4.b"]
source = "1b2c4caead85259b"
text = '''Haltet die Wache das ganze Jahr über.'''

["STATIC_MODIFIER_NAME_rnw_contact_envoys"]
source = "3a4b29a9714541fa"
text = '''Willkommen für die Fremden'''

["STATIC_MODIFIER_DESC_rnw_contact_envoys"]
source = "729e657d6aa92bd0"
text = '''Gesandte von jenseits des Ozeans bringen neues Wissen, und unsere Stimme reicht weiter.'''

["STATIC_MODIFIER_NAME_rnw_contact_one_port"]
source = "56ce4ad09470858c"
text = '''Der eine offene Hafen'''

["STATIC_MODIFIER_DESC_rnw_contact_one_port"]
source = "5d539180c62a73a6"
text = '''Jedes fremde Schiff muss einen einzigen Hafen anlaufen, und dessen Kais und Lagerhäuser wachsen.'''

["STATIC_MODIFIER_NAME_rnw_contact_coast_levies"]
source = "509d6eec1459b499"
text = '''Aufgebote der Küste'''

["STATIC_MODIFIER_DESC_rnw_contact_coast_levies"]
source = "fce2c8d02af1c098"
text = '''Die Küste hat zu den Waffen gegriffen, und mehr Männer können einberufen werden.'''

["STATIC_MODIFIER_NAME_rnw_contact_coast_watch"]
source = "88485444dd90d0e9"
text = '''Die Küstenwache'''

["STATIC_MODIFIER_DESC_rnw_contact_coast_watch"]
source = "609d59a2ba620e2a"
text = '''Ausgucke und Leuchtfeuer entlang der Küste machen jede Landung kostspielig.'''

["STATIC_MODIFIER_NAME_rnw_contact_trading_house"]
source = "a65956d37608b7b4"
text = '''Ein Haus am Kai'''

["STATIC_MODIFIER_DESC_rnw_contact_trading_house"]
source = "677d5a04d51ada02"
text = '''Die Kaufleute der Fremden unterhalten ein Haus und ein Lagerhaus am Kai.'''

["rnw_colony.1.title"]
source = "3bafba0715862ffc"
text = '''Eine Kolonialversammlung'''

["rnw_colony.1.desc"]
source = "c8d8e5f0a246762b"
text = '''Zum ersten Mal sind die Siedler der Stadt [target_location.GetNameWithNoTooltip] ohne Erlaubnis des Statthalters zur Versammlung zusammengetreten. Sie zahlen Steuern an das Reich [target_country.GetName], kämpfen selbst gegen ihre Nachbarn und bestellen ein Land, das nicht das ihrer Väter ist. Nun wollen sie wissen, was sie sind: Untertanen, ein Volk oder ein Land.'''

["rnw_colony.1.a"]
source = "18ea970c2dae5691"
text = '''Bittet das alte Land um Sitze in seinem Rat.'''

["rnw_colony.1.b"]
source = "78883393dc15b435"
text = '''Wir sind weder das alte Land noch die Eingeborenen. Wir sind ein eigenes Volk.'''

["rnw_colony.1.c"]
source = "83c0be28b1a43ab7"
text = '''Fordert die Selbstverwaltung.'''

["rnw_colony.2.title"]
source = "4c9d51a8c556a96d"
text = '''Der Rat antwortet'''

["rnw_colony.2.desc"]
source = "49e5e4450323965e"
text = '''Der Rat des Reiches [target_country.GetName] hat die Bittschrift angehört. Sitze, antworten seine Mitglieder, könnten vergeben werden, mit der Zeit und an jene, die am meisten zahlen. Die reichsten Kolonisten finden den Preis angemessen und zählen schon ihre Münzen. Die ärmeren Siedler kommen nicht mehr zur Versammlung.'''

["rnw_colony.2.a"]
source = "dadb41b04277541c"
text = '''Zahlt den Preis für einen Sitz.'''

["rnw_colony.2.b"]
source = "4c832e53c147637c"
text = '''Ein mit Münzen gekaufter Sitz ist kein Sitz.'''

["rnw_colony.3.title"]
source = "f4bf7d63a4d3a1bd"
text = '''Ein Volk zweier Welten'''

["rnw_colony.3.desc"]
source = "72874c1b77edcded"
text = '''In der Stadt [target_location.GetNameWithNoTooltip] ist eine Generation herangewachsen, die das alte Land nie gesehen hat. Sie spricht eine eigene Mundart, halb die alte Sprache und halb die Worte der Küste, und sie singt vom Fluss und nicht vom Meer. Die Offiziere des alten Landes klagen, es sei schwer, einem Volk zu befehlen, das nicht auf seinen eigenen Namen hört.'''

["rnw_colony.3.a"]
source = "4dccb1f3aa419324"
text = '''Lasst die Gerichte in der Kolonialmundart verhandeln.'''

["rnw_colony.3.b"]
source = "25ca88317c73e9fe"
text = '''Haltet an Sprache und Recht des alten Landes fest.'''

["rnw_colony.4.title"]
source = "cc28034e30b28491"
text = '''Der Weg in die Unabhängigkeit'''

["rnw_colony.4.desc"]
source = "4afe03380f72542d"
text = '''Seit einer ganzen Jahreszeit verweigert die Versammlung der Stadt [target_location.GetNameWithNoTooltip] ihre Abgaben. Das Reich [target_country.GetName] hat mit einem strengen Brief und einigen Schiffen geantwortet. Die Hauptleute der Miliz sagen, sie seien bereit. Die älteren Mitglieder der Versammlung sagen, Unabhängigkeit sei ein Wort, das mehr koste, als es einbringe.'''

["rnw_colony.4.a"]
source = "e0b50e27ca5752a0"
text = '''Ruft die Miliz auf und rüstet zum Krieg.'''

["rnw_colony.4.b"]
source = "f81a5ccc554b892b"
text = '''Handelt Selbstverwaltung gegen die Abgaben aus.'''

["STATIC_MODIFIER_NAME_rnw_colony_seats"]
source = "19b05cd1227a3987"
text = '''Sitze am Tisch'''

["STATIC_MODIFIER_DESC_rnw_colony_seats"]
source = "35d8070d605cc25c"
text = '''Eine Stimme im Rat des alten Landes bindet die Kolonie an es.'''

["STATIC_MODIFIER_NAME_rnw_colony_people"]
source = "965f2f1d27c77c16"
text = '''Ein Kolonialvolk'''

["STATIC_MODIFIER_DESC_rnw_colony_people"]
source = "cbdc8f7671baa079"
text = '''Ein Volk mit eigener Mundart und eigenen Liedern verdient den Respekt seiner Nachbarn.'''

["STATIC_MODIFIER_NAME_rnw_colony_agitation"]
source = "2c4e3678ec504b17"
text = '''Aufrufe zur Freiheit'''

["STATIC_MODIFIER_DESC_rnw_colony_agitation"]
source = "566573d138563416"
text = '''Reden in der Versammlung lockern die Treue der Kolonie zum alten Land.'''

["STATIC_MODIFIER_NAME_rnw_colony_ties"]
source = "38fd2d27ec0c93ad"
text = '''Bande der Verwandtschaft'''

["STATIC_MODIFIER_DESC_rnw_colony_ties"]
source = "11ab605470b32411"
text = '''Mit Münzen gekaufte Ratssitze binden die großen Familien an das alte Land.'''

["STATIC_MODIFIER_NAME_rnw_colony_militia"]
source = "c71fedb49a6849da"
text = '''Die Miliz steht'''

["STATIC_MODIFIER_DESC_rnw_colony_militia"]
source = "0d44147d7a9b13de"
text = '''Jeder Mann, der Waffen tragen kann, steht in den Listen, und sie sind gut gedrillt.'''

["STATIC_MODIFIER_NAME_rnw_colony_autonomy"]
source = "075e0c03d12b32d2"
text = '''Gewährte Selbstverwaltung'''

["STATIC_MODIFIER_DESC_rnw_colony_autonomy"]
source = "1aab7d35e37c0d1d"
text = '''Die Kolonie verwaltet sich selbst, zahlt weniger und ist dafür treu.'''

["rnw_formation_river_union_desc"]
source = "5b8b5e625bb3285e"
text = '''Die Städte an einem Fluss handeln, bauen und stehen seit Generationen füreinander ein. Eine Macht, die die meisten von ihnen hält, kann sie zu einem Staat verbinden: {name}.'''

["STATIC_MODIFIER_NAME_rnw_union_markets"]
source = "1758a19ed6f78b11"
text = '''Märkte eines Flusses'''

["STATIC_MODIFIER_DESC_rnw_union_markets"]
source = "35e82961b75fd09a"
text = '''Die Flussstädte verkaufen ihre Waren wie auf einem einzigen Markt.'''

["rnw_formation_highland_confederation_desc"]
source = "5ff11ac4c39084b3"
text = '''Die Täler eines Gebirges leben getrennt hinter ihren Pässen und sind sich in wenig einig außer in ihrer Freiheit. Eine Macht, die die meisten von ihnen hält, kann sie zu einer Eidgenossenschaft verbinden, {name}, und jedem Tal seinen eigenen Rat lassen.'''

["STATIC_MODIFIER_NAME_rnw_confederation_compact"]
source = "c828bbbe1c9caffb"
text = '''Bund der Täler'''

["STATIC_MODIFIER_DESC_rnw_confederation_compact"]
source = "2b00edec1dbe262f"
text = '''Die Täler behalten ihre eigenen Räte und stehen zusammen gegen jede fremde Macht.'''

["rnw_formation_maritime_league_desc"]
source = "b09619f6c5942d64"
text = '''Die Häfen einer Küste befahren dieselben Gewässer und fürchten dieselben Stürme. Eine Macht, die die meisten von ihnen hält, kann sie zu einem Bund vereinen, {name}, um gemeinsam Handel zu treiben und ihr Meer zu verteidigen.'''

["STATIC_MODIFIER_NAME_rnw_league_charter"]
source = "777162eb8d78057f"
text = '''Satzung des Bundes'''

["STATIC_MODIFIER_DESC_rnw_league_charter"]
source = "6a6dc6321e67a016"
text = '''Eine einzige Satzung bindet die Kaufleute und die Räte aller Häfen.'''

["rnw_formation_cultural_union_desc"]
source = "8b80689c689faa06"
text = '''Die Städte eines Volkes sprechen eine Sprache und pflegen dieselben Bräuche, auch unter vielen Herrschern. Eine Macht, die die meisten von ihnen hält, kann sie zu einem Gemeinwesen vereinen: {name}.'''

["STATIC_MODIFIER_NAME_rnw_commonwealth_unity"]
source = "b38f452e164c7f27"
text = '''Ein Volk'''

["STATIC_MODIFIER_DESC_rnw_commonwealth_unity"]
source = "5ae17460ed132f2e"
text = '''Eine Sprache und ein Brauch halten das Gemeinwesen zusammen und mehren sein Ansehen.'''

["rnw_formation_regional_realm_desc"]
source = "c52eb5c1af067a93"
text = '''Eine ganze Region ist unter vielen Herrschern aufgeteilt, von denen jeder nur ein paar ihrer Städte hält. Eine Macht, die den größten Teil davon hält, kann sie zu einem Reich vereinen: {name}.'''

["STATIC_MODIFIER_NAME_rnw_realm_administration"]
source = "cabaec1d33271337"
text = '''Verwaltung des Reiches'''

["STATIC_MODIFIER_DESC_rnw_realm_administration"]
source = "55a8e093ca32dc59"
text = '''Eine neue Verwaltung erstreckt sich über die ganze Region, und ihre Provinzen fügen sich.'''

["rnw_formation_postcolonial_federation_desc"]
source = "d73fc53c1ceb15cf"
text = '''Kolonien an einer Küste, besiedelt aus einem alten Land oder aus mehreren, teilen inzwischen einen Groll und eine Zukunft. Ein Siedlerstaat, der genug von dieser Küste hält und dessen Hauptstadt unter ihnen liegt, kann sich zu einer Föderation erklären: {name}.'''

["STATIC_MODIFIER_NAME_rnw_federation_founded"]
source = "25d53c2568486691"
text = '''Eine Nation gegründet'''

["STATIC_MODIFIER_DESC_rnw_federation_founded"]
