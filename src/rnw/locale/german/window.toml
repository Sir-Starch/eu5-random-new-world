text = '''Weltweit insgesamt: etwa {count} Orte (EU5-Engine-Limit: ~32.000).'''

["estimate_tip"]
source = "34f3f38a503b4cdc"
text = "In EU5 zählen neben Landprovinzen auch Seezonen und Seen weltweit als Orte (rund 22.000 davon entfallen auf die unveränderte Alte Welt).\n\nDie Engine nutzt einen 16-Bit-Index (maximal ~32.767). Um Abstürze zu verhindern, hält der Generator die Gesamtzahl sicher unter 31.200.\n\nWarum bei „viel Land“ weniger Orte angezeigt werden können:\nSeezonen sind ebenfalls Orte. Mehr Land bedeutet weniger Meeresfläche (weniger Seezonen), und bei großen Landmassen werden die Landorte automatisch vergrößert, um das Limit nicht zu überschreiten. Die Gesamtzahl kann dadurch sinken – dies ist eine reguläre Budgetanpassung und kein Fehler."

