["rnw_formation_restoration_desc"]
source = "744415b1555053f9"
text = '''Um reino dominou outrora estas terras, até se partir entre seus herdeiros, que ainda se lembram dele. Um herdeiro que domine o bastante de seu antigo território, com sua capital nele, pode erguê-lo de novo e reivindicar o resto como seu: {name}. Os demais herdeiros devem aceitar a restauração ou contestá-la.'''

["STATIC_MODIFIER_NAME_rnw_restoration_heirs"]
source = "02fcf0134a6e1a2c"
text = '''Herdeiros do Antigo Reino'''

["STATIC_MODIFIER_DESC_rnw_restoration_heirs"]
source = "3841570bacb1bb5a"
text = '''A coroa restaurada reúne os antigos cargos e traz suas províncias perdidas de volta a um só governo.'''

["rnw_restoration_heirs_tt"]
source = "14637a30b3e66320"
text = '''Cada um dos demais herdeiros do antigo reino deve reconhecer a restauração ou contestá-la.'''

["rnw_restoration.title"]
source = "4e9f16af60fc9717"
text = '''O Antigo Reino Restaurado'''

["rnw_restoration.desc"]
source = "3862bfaf3cd1696c"
text = '''Enviados de [restorer.GetNameWithNoTooltip] chegaram com uma proclamação: o reino que nossos antepassados partilhavam foi restaurado, e sua nova coroa reivindica como suas todas as terras que um dia teve, inclusive as nossas. Nosso conselho deve decidir se se curva ao antigo nome ou o nega.'''

["rnw_restoration.a"]
source = "8de73f015f26ce75"
text = '''Reconhecemos a coroa restaurada.'''

["rnw_restoration.b"]
source = "5b9a238653e7fbf8"
text = '''A antiga coroa não é mais deles do que nossa.'''

["rnw_memory.lost_land.title"]
source = "6d03784bc71649e4"
text = '''A Perda de [target_location.GetNameWithNoTooltip]'''

["rnw_memory.lost_land.desc"]
source = "313947eafa71e8c2"
text = '''Nossos anciãos ainda chamam de nossos os campos de [target_location.GetNameWithNoTooltip], embora [partner.GetNameWithNoTooltip] os tenha tomado de nossos avós. Os jovens perguntam se essa perda deve durar para sempre.'''

["rnw_memory.lost_land.a"]
source = "515594395bbab00e"
text = '''O que foi nosso voltará a ser nosso.'''

["rnw_memory.lost_land.b"]
source = "6211a94e051ab224"
text = '''Que a velha ferida se feche.'''

["rnw_memory.old_pact.title"]
source = "11c48fbce58796de"
text = '''O Antigo Pacto'''

["rnw_memory.old_pact.desc"]
source = "27565aab96e7c826"
text = '''Nosso povo e [partner.GetNameWithNoTooltip] juraram outrora permanecer unidos, e cumpriram a palavra. Seus enviados vieram perguntar se a antiga promessa ainda nos obriga.'''

["rnw_memory.old_pact.a"]
source = "b94ae141c5a67bf2"
text = '''A antiga promessa ainda nos obriga.'''

["rnw_memory.old_pact.b"]
source = "deae4afc797b2fb4"
text = '''Essa promessa foi de nossos avós, não nossa.'''

["rnw_memory.kin.title"]
source = "6c53f1166e3b144c"
text = '''Parentes Além da Fronteira'''

["rnw_memory.kin.desc"]
source = "7025ad0a09571fe0"
text = '''Há muito tempo, famílias de nosso povo se mudaram entre nossa terra e [partner.GetNameWithNoTooltip], e se estabeleceram em [target_location.GetNameWithNoTooltip]. Seus filhos ainda se lembram uns dos outros e pedem que o caminho entre eles continue aberto.'''

["rnw_memory.kin.a"]
source = "e63fcfb7dc836c71"
text = '''Nossas portas estão abertas aos nossos parentes.'''

["rnw_memory.kin.b"]
source = "bd82b91057f1971b"
text = '''Escolheram outra terra; que fiquem com ela.'''

["rnw_memory.shrine.title"]
source = "af02fa220fb67956"
text = '''Peregrinos a [target_location.GetNameWithNoTooltip]'''

["rnw_memory.shrine.desc"]
source = "8079fdc623e79727"
text = '''Por gerações, nossos peregrinos caminharam até o santuário de [target_location.GetNameWithNoTooltip], sob a paz que [partner.GetNameWithNoTooltip] lhes concede. Alguns de nossos sacerdotes dizem agora que um lugar sagrado não deveria pertencer a estranhos.'''

["rnw_memory.shrine.a"]
source = "501fa6cb9698be73"
text = '''Honrar a paz do santuário.'''

["rnw_memory.shrine.b"]
source = "20bde48b4bda8b21"
text = '''O santuário deveria ser nosso.'''

["rnw_memory.heir.title"]
source = "42df00d9ae3f528e"
text = '''A Memória do Antigo Reino'''

["rnw_memory.heir.desc"]
source = "1b8d09cdc1575552"
text = '''Nossos cronistas recordam os dias em que nossa terra era uma só com suas vizinhas sob uma única coroa, sediada em [target_location.GetNameWithNoTooltip]. Esse reino não existe mais, mas não foi esquecido, e quem reunir o bastante de seu antigo território poderá erguê-lo de novo.'''

["rnw_memory.heir.a"]
source = "6dfe52d00f4856ad"
text = '''Ergueremos de novo o antigo reino.'''

["rnw_memory.heir.b"]
source = "981a1c5531732d0e"
text = '''O antigo reino não existe mais; deixem-no descansar.'''

["rnw_reform_river_markets"]
source = "c98e0101001dfd1a"
text = '''Carta dos Mercados do Rio'''

["rnw_reform_river_markets_desc"]
source = "07319bc21fe9bfb3"
text = '''As cidades do rio comerciam sob uma só carta, e seus mercadores percorrem todo o seu curso.'''

["rnw_reform_valley_council"]
source = "7fe79434140a15d2"
text = '''Conselho dos Vales'''

["rnw_reform_valley_council_desc"]
source = "ebe81586e732414b"
text = '''Os chefes de cada vale sentam-se num só conselho, e nada se decide até que todos concordem.'''

["rnw_reform_port_council"]
source = "229cf1f8d7a5629c"
text = '''Conselho dos Portos'''

["rnw_reform_port_council_desc"]
source = "b1b09e8b01fe91dc"
text = '''As casas mercantis de cada porto governam juntas a liga, e seus navios levam suas mercadorias a todas as costas.'''

["rnw_reform_one_people"]
source = "fd6c4d4b18166d99"
text = '''Lei do Povo Único'''

["rnw_reform_one_people_desc"]
source = "82e5c34f269f9d61"
text = '''Uma só lei une os povos da comunidade e mantém a paz entre suas muitas cidades.'''

["rnw_reform_realm_provinces"]
source = "041fbf884f30138c"
text = '''Províncias do Reino'''

["rnw_reform_realm_provinces_desc"]
source = "6d2906868d241c91"
text = '''O reino está dividido em províncias sob seus governadores, e suas cidades crescem sob seus cuidados.'''

["rnw_reform_national_articles"]
source = "03468bdf1a6efa04"
text = '''Artigos da Nação'''

["rnw_reform_national_articles_desc"]
source = "67501e96229f51f7"
text = '''Artigos escritos unem os estados da nação e a assembleia que fala por eles.'''

["rnw_reform_restored_crown"]
source = "c8fe56425fcf3bb3"
text = '''Lei da Coroa Restaurada'''

["rnw_reform_restored_crown_desc"]
source = "4d83a205137e54bb"
text = '''A coroa restaurada retoma os antigos direitos de seus predecessores e governa de novo a partir de uma só sede.'''

["rnw_decline.1.title"]
source = "3dd1b7659844a1e4"
text = '''O Ocaso de [target_location.GetNameWithNoTooltip]'''

["rnw_decline.1.desc"]
source = "c5fae87ab12e8259"
text = '''[target_location.GetNameWithNoTooltip] foi outrora a sede de um reino que governava todos os vales ao redor. O reino se partiu há muito tempo. Seus grandes pátios estão meio vazios, os bairros externos voltam a ser floresta, e as famílias que os habitavam partem para cidades mais jovens.\n\nOs anciãos da cidade perguntam se ela voltará a ser grande, ou apenas segura.'''

["rnw_decline.1.a"]
source = "ebec51f47bb012d8"
text = '''Reconstruir os velhos pátios e chamar as famílias de volta.'''

["rnw_decline.1.b"]
source = "2822afffd76cf9be"
text = '''Murar o coração da cidade e deixar o resto ir.'''

["rnw_decline.2.title"]
source = "f07c4c037a05e3eb"
text = '''Uma Nova Era de Ouro'''

["rnw_decline.2.desc"]
source = "fe3cb50f1780e463"
text = '''Os pátios de [target_location.GetNameWithNoTooltip] estão cheios de novo. Artesãos trabalham nos velhos terraços, e peregrinos vêm ver o que os ancestrais construíram. Alguns na corte dizem que a cidade deveria agora liderar a terra como antes.'''

["rnw_decline.2.a"]
source = "52923b04d9eac118"
text = '''Que a cidade volte a liderar.'''

["rnw_decline.2.b"]
source = "e221439368027a4b"
text = '''Contentar-se com a cidade restaurada.'''

["rnw_decline.3.title"]
source = "c2c80a4020d94373"
text = '''A Sombra sobre [target_location.GetNameWithNoTooltip]'''

["rnw_decline.3.desc"]
source = "9088c57e95aede13"
text = '''Atrás de suas novas muralhas, [target_location.GetNameWithNoTooltip] está segura, e menor a cada ano. Os bairros vazios lá fora viraram campos e matagais, e os viajantes falam da cidade como de uma ruína com guarnição.'''

["rnw_decline.3.a"]
source = "6e51bbc634b77e3d"
text = '''As muralhas valeram a pena.'''

["rnw_decline.3.b"]
source = "a49ba0633c7d61c0"
text = '''Convidar colonos para os bairros vazios.'''

["STATIC_MODIFIER_NAME_rnw_decline_rebuilding"]
source = "ed85686f202140d9"
text = '''Reconstrução dos Velhos Pátios'''

["STATIC_MODIFIER_DESC_rnw_decline_rebuilding"]
source = "e9c2af8b2b9fc5fc"
text = '''Pedreiros e famílias voltam aos pátios da antiga sede.'''

["STATIC_MODIFIER_NAME_rnw_decline_fortified"]
source = "78040151a1a67f82"
text = '''O Coração Murado'''

["STATIC_MODIFIER_DESC_rnw_decline_fortified"]
source = "57cf3f4fa3374287"
text = '''O coração da antiga sede está murado e guarnecido.'''

["STATIC_MODIFIER_NAME_rnw_decline_golden_age"]
source = "145441a99b625ab8"
text = '''A Antiga Sede Lidera de Novo'''

["STATIC_MODIFIER_DESC_rnw_decline_golden_age"]
source = "cf3b7ff492ed1a96"
text = '''A cidade restaurada atrai artesãos, estudiosos e tributos de toda a terra.'''

["STATIC_MODIFIER_NAME_rnw_decline_shadow"]
source = "296709711159011b"
text = '''Uma Ruína com Guarnição'''

["STATIC_MODIFIER_DESC_rnw_decline_shadow"]
source = "11a730ce7bb2fe79"
text = '''Os viajantes falam da antiga sede como de uma sombra do que foi.'''

["STATIC_MODIFIER_NAME_rnw_decline_resettled"]
source = "8274df482f4588de"
text = '''Colonos nos Bairros Vazios'''

["STATIC_MODIFIER_DESC_rnw_decline_resettled"]
source = "5ea7a09878b27a82"
text = '''Novas famílias enchem os bairros vazios da antiga sede.'''

["rnw_council.1.title"]
source = "b4e7094533513141"
text = '''O Grande Conselho'''

["rnw_council.1.desc"]
source = "e8fa63c6638665fc"
text = '''Os chefes de todos os povos de nossa confederação se reuniram em [target_location.GetNameWithNoTooltip] para o Grande Conselho. Pela velha lei, nada se decide até que todos concordem, e este ano há muito em que concordar.\n\nNosso próprio chefe pode deixar o conselho falar com uma só voz lenta, ou falar primeiro e mais alto.'''

["rnw_council.1.a"]
source = "0503a3f754419f6f"
text = '''Que o conselho decida em conjunto.'''

["rnw_council.1.b"]
source = "3d0cadb02d62b4d3"
text = '''Nossa voz guiará o conselho.'''

["rnw_council.2.title"]
source = "bdd492090bb9debb"
text = '''Uma Nova Delegação'''

["rnw_council.2.desc"]
source = "c98b72faac08d982"
text = '''Um povo de além de nossas fronteiras enviou uma delegação ao conselho de [target_location.GetNameWithNoTooltip]. Seus enviados pedem para sentar-se entre os chefes e guardar a lei da confederação como sua.'''

["rnw_council.2.a"]
source = "567fa5f1e3a6044d"
text = '''Deem-lhes um lugar junto ao fogo.'''

["rnw_council.2.b"]
source = "9471fe0792fa23db"
text = '''O conselho está completo.'''

["rnw_council.3.title"]
source = "874b725a727a0a9b"
text = '''Os Chefes Estão Irados'''

["rnw_council.3.desc"]
source = "5c3955cce944b26b"
text = '''Os chefes que tiveram a palavra cortada no conselho voltaram de [target_location.GetNameWithNoTooltip] cheios de raiva. Alguns falam em deixar a confederação.'''

["rnw_council.3.a"]
source = "c44abb77c015f05c"
text = '''Enviar presentes a cada chefe.'''

["rnw_council.3.b"]
source = "514be8b6eec366bf"
text = '''A raiva deles passará.'''

["STATIC_MODIFIER_NAME_rnw_council_peace"]
source = "4315d2c7eee55c49"
text = '''Uma Só Voz do Conselho'''

["STATIC_MODIFIER_DESC_rnw_council_peace"]
source = "2d412c8f4e3f1d44"
text = '''Os chefes decidem juntos, devagar, e seus povos cumprem o que decidem.'''

["STATIC_MODIFIER_NAME_rnw_council_assertive"]
source = "44e0dd172a716cae"
text = '''Um Conselho Desconsiderado'''

["STATIC_MODIFIER_DESC_rnw_council_assertive"]
source = "c126f271e8ab388a"
text = '''Nosso chefe fala pelo conselho, e os outros chefes se ressentem disso.'''

["rnw_senior.1.title"]
source = "8a0392279a2c60ed"
text = '''O Equilíbrio da Aliança'''

["rnw_senior.1.desc"]
source = "c60827cfe5e974c4"
text = '''Por uma geração nossa corte e seus aliados permaneceram unidos, e nenhum vizinho ousou testá-los. Agora nossa corte é a mais forte de todas, e nossos nobres perguntam por que o espólio de cada guerra deve ser dividido igualmente com [target_country.GetName].'''

["rnw_senior.1.a"]
source = "a42b01208b4b1ada"
text = '''Tomaremos o primeiro lugar entre nossos aliados.'''

["rnw_senior.1.b"]
source = "5300de972d911391"
text = '''Estivemos juntos como iguais, e assim permaneceremos.'''

["rnw_senior.2.title"]
source = "aada9ff26807d3c0"
text = '''O Parceiro Menor Protesta'''

["rnw_senior.2.desc"]
source = "56f863fcfc28ea25"
text = '''Enviados de [target_country.GetName] lembram nossa corte de que seus guerreiros sangraram ao lado dos nossos. Pedem uma parte igual do tributo, ou repensarão a aliança.'''

["rnw_senior.2.a"]
source = "57b81bcae2e47aef"
text = '''Deem-lhes sua parte do tributo.'''

["rnw_senior.2.b"]
source = "2e41afb4ddc50636"
text = '''Eles precisam mais de nós do que nós deles.'''

["rnw_senior.3.title"]
source = "f33618a6e39b1ac4"
text = '''Presentes entre Iguais'''

["rnw_senior.3.desc"]
source = "31a432876c7d6948"
text = '''A corte de [target_country.GetName] enviou presentes para honrar a velha aliança, e espera para ver o que a nossa mandará em troca.'''

["rnw_senior.3.a"]
source = "eebec55c40a0fd41"
text = '''Retribuir com presentes ainda mais ricos.'''

["rnw_senior.3.b"]
source = "8c56d76df18a23e8"
text = '''Nosso agradecimento bastará.'''

["rnw_nation.1.title"]
source = "be38d247de5f8725"
text = '''A Assembleia dos Delegados'''

["rnw_nation.1.desc"]
source = "454f7eca77815ade"
text = '''Delegados de todas as cidades da nova nação se reuniram em [target_location.GetNameWithNoTooltip] para decidir como ela será governada. Alguns querem uma república de cidades livres; outros dizem que uma nação jovem precisa de uma coroa para mantê-la unida.'''

["rnw_nation.1.a"]
source = "dac2a7edd2cc8b83"
text = '''Uma república de cidades livres.'''

["rnw_nation.1.b"]
source = "7ab2b89252812153"
text = '''Uma coroa para manter a nação unida.'''

["rnw_nation.2.title"]
source = "16ff1ee78d2287cd"
text = '''A Ordenança da Fronteira'''

["rnw_nation.2.desc"]
source = "837b55fe72b75d71"
text = '''A assembleia de [target_location.GetNameWithNoTooltip] deve decidir o que será da terra além da costa povoada. Os agrimensores querem medi-la, vendê-la e ligá-la por estradas; outros dizem que ela pertence aos povos que vivem lá.'''

["rnw_nation.2.a"]
source = "a66b4892ba0f52a4"
text = '''Medir a fronteira e abrir estradas nela.'''

["rnw_nation.2.b"]
source = "d89dfe8abb0da82d"
text = '''Deixar a fronteira aos seus povos.'''

["rnw_nation.3.title"]
source = "e0d3ebbd474754be"
text = '''Uma Coroa para a Nação'''

["rnw_nation.3.desc"]
source = "b44240c9bf06e2fa"
text = '''Os delegados escolheram uma coroa, e a nova corte de [target_location.GetNameWithNoTooltip] deve decidir a quem recompensa: aos fundadores das cidades ou às velhas famílias que vieram de além-mar.'''

["rnw_nation.3.a"]
source = "a8122d8c264b7555"
text = '''Recompensar os fundadores das cidades.'''

["rnw_nation.3.b"]
source = "08d05dbcb8725972"
text = '''Honrar as velhas famílias.'''

["STATIC_MODIFIER_NAME_rnw_nation_roads"]
source = "69bccd5fa130c0bd"
text = '''Estradas para a Fronteira'''

["STATIC_MODIFIER_DESC_rnw_nation_roads"]
source = "671d8ac3385e6289"
text = '''Agrimensores e construtores de estradas levam as estradas da nação além da costa povoada.'''

["rnw_naming.title"]
source = "82708204008b5b60"
text = '''Um Nome para o Novo Estado'''

["rnw_naming.desc"]
source = "360aafa7c1166035"
text = '''O novo Estado precisa de um nome pelo qual seus vizinhos o conhecerão. Alguns na corte preferem o nome com que foi proclamado; outros o chamariam pela terra que agora governa.'''

["rnw_naming.keep"]
source = "83549dc6c7c223ec"
text = '''Manter o nome: {name}.'''

["rnw_naming.take"]
source = "0eff740f9b97f82f"
text = '''Adotar o nome: {name}.'''

["rnw_formation_two_shores_name"]
source = "3bc268bf8490e630"
text = '''Império das Duas Margens'''

["rnw_formation_two_shores_name_adj"]
source = "400671422a0de267"
text = '''transoceânico'''

["rnw_formation_two_worlds_name"]
source = "2f85382541be3bad"
text = '''Coroa dos Dois Mundos'''

["rnw_formation_two_worlds_name_adj"]
source = "1349ccd918705484"
text = '''transatlântico'''

["rnw_formation_two_oceans_name"]
source = "13126384cc6effe8"
text = '''Império dos Dois Oceanos'''

["rnw_formation_two_oceans_name_adj"]
source = "00f9e76a2534af31"
text = '''bioceânico'''

["rnw_formation_two_peoples_name"]
source = "be9e07854a4e2e6b"
text = '''Reino dos Dois Povos'''

["rnw_formation_two_peoples_name_adj"]
source = "aab153dd88cc8043"
text = '''dos dois povos'''

["rnw_formation_two_shores_desc"]
source = "473b50435cb358d9"
text = '''Nenhum povo deste continente jamais governou além do grande oceano. Uma potência de seus próprios povos que possua terras na margem distante e boa parte de seu continente natal pode proclamar um império das duas margens: {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_shores_voyagers"]
source = "dec7efd625ab7d44"
text = '''Navegantes rumo à Margem Distante'''

["STATIC_MODIFIER_DESC_rnw_two_shores_voyagers"]
source = "b17650f2a8d54598"
text = '''Nossos navios cruzam o grande oceano rumo a terras que nenhum ancestral conheceu.'''

["rnw_formation_two_worlds_desc"]
source = "8933a92bcf6a6335"
text = '''A corte de um velho país cruzou o oceano e se estabeleceu neste continente, enquanto sua antiga pátria ainda lhe obedece. Uma coroa que reine dos dois lados do oceano, com sua capital aqui, pode proclamar uma só coroa sobre os dois mundos: {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_worlds_union"]
source = "9bb6203ca44ee2f1"
text = '''Uma Coroa, Dois Mundos'''

["STATIC_MODIFIER_DESC_rnw_two_worlds_union"]
source = "ec15c579d765b459"
text = '''A antiga pátria e a nova corte obedecem à mesma coroa.'''

["rnw_formation_two_oceans_desc"]
source = "287d1ce2e64d72e3"
text = '''Este continente se estende entre dois oceanos, e nenhuma potência jamais navegou por ambos. Uma que possua portos nos dois e boa parte da terra entre eles pode proclamar um império dos dois oceanos: {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_oceans_sea_power"]
source = "5240aa554bdc6edf"
text = '''Senhora de Dois Oceanos'''

["STATIC_MODIFIER_DESC_rnw_two_oceans_sea_power"]
source = "5997155c1a0aa978"
text = '''Nossas frotas guardam as rotas marítimas dos dois oceanos.'''

["rnw_formation_great_law_desc"]
source = "984cd3a2649f2fa6"
text = '''Os povos de uma confederação vivem há gerações sob uma só grande lei, cada um com seu próprio conselho. O chefe que os lidera e domina o bastante de suas terras pode uni-los num só Estado sob essa lei: {name}.'''

["STATIC_MODIFIER_NAME_rnw_great_law_league"]
source = "06e46ef8dffbd992"
text = '''Povos da Grande Lei'''

["STATIC_MODIFIER_DESC_rnw_great_law_league"]
source = "ae42b7744b3395cf"
text = '''Os povos da antiga confederação lutam e comerciam como um só.'''

["rnw_formation_two_peoples_desc"]
source = "7a91ebd282c9e756"
text = '''Os colonos e os povos deste continente se casaram, comerciaram e rezaram juntos até que ninguém sabe onde um termina. Um Estado que tenha os dois povos como seus e boa parte do continente pode proclamar um reino dos dois povos: {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_peoples_integration"]
source = "0fd80ff5371517ee"
text = '''Dois Povos, Um Reino'''

["STATIC_MODIFIER_DESC_rnw_two_peoples_integration"]
source = "77bf4dd8870d78b3"
text = '''O reino toma os dois povos como seus e acolhe seus costumes.'''

["rnw_road.name"]
source = "2a2a11954c349bc8"
text = '''O Caminho para {name}'''

["rnw_road.desc"]
source = "e6619312e0e3825f"
text = '''Reunir as terras sob nosso domínio e proclamar o novo Estado: {name}.'''

["rnw_road.seat"]
source = "c50808a05e63c6f2"
text = '''Tomar a Sede'''

["rnw_road.seat_desc"]
source = "d248d862f432b46c"
text = '''A sede do novo Estado deve ser nossa antes que suas terras a sigam.'''

["rnw_road.land"]
source = "9df238c90f736f30"
text = '''Reunir as Terras'''

["rnw_road.land_desc"]
source = "0f35b903317a3f42"
text = '''Devemos dominar boa parte de suas terras antes de poder proclamar o novo Estado.'''

["rnw_road.proclaim"]
source = "a3422fb1ef9d8d24"
text = '''Proclamar o Novo Estado'''

["rnw_road.proclaim_desc"]
source = "faed96e7a4804d75"
text = '''Com as terras em nossas mãos, podemos proclamar {name}.'''
