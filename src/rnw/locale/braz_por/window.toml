["estimate_tip"]
source = "34f3f38a503b4cdc"
text = "No EU5, as localizações incluem províncias terrestres, zonas marítimas e lagos em todo o mundo (~22.000 pertencem ao Velho Mundo fixo).\n\nO motor usa um índice de 16 bits (máximo de ~32.767). Para evitar travamentos, o gerador mantém o total abaixo de 31.200.\n\nPor que «muita terra» pode exibir menos localizações:\nZonas marítimas também são localizações. Mais terra significa menos oceano (menos zonas marítimas), e o tamanho das células terrestres aumenta automaticamente para grandes massas a fim de respeitar o limite. O total pode diminuir; isso é um balanceamento de orçamento esperado, não um erro."

