text = '''No início de uma campanha, o país de cada jogador descobre todas as áreas deste Novo Mundo, terra e mar, para que todos os jogadores o vejam desde o primeiro dia. Os países controlados pelo computador não o recebem: eles encontram o Novo Mundo explorando, como no jogo. Desativado por padrão: o Novo Mundo fica então à espera de ser descoberto por todos. O evento do próprio jogo que anuncia a descoberta do Novo Mundo não ocorre, porque a descoberta já foi feita.'''

