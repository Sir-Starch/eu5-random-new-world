["control.new_world.keep_geography"]
source = "e0e1cb42b1884575"
text = '''Manter as Américas reais'''

["control.new_world.keep_geography.about"]
source = "8a604db947b5994e"
text = '''Apenas povos'''

["control.new_world.keep_geography.info"]
source = "ec2c59bae05bf945"
text = '''As Américas ficam exatamente como o jogo as desenha: nenhuma terra, costa, relevo, rio ou lugar é gerado ou alterado. Apenas os povos são gerados: estados, culturas, religiões, história, leis e o resto da sociedade de 1337. As configurações de terra, oceano, mapa e recursos não se aplicam, e o Novo Mundo não é coberto no lobby.'''

["error.candidates.real"]
