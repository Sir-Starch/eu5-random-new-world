["type.wall"]
source = "e302f89b5d80c74c"
text = "A Muralha"

["type.wall.about"]
source = "ca86859f0c629220"
text = "Um continente reto de norte a sul, com uma cordilheira e terras dos dois lados. As costas procedurais podem formar ilhas e estreitos se interrupções forem permitidas."

["group.wall"]
source = "e302f89b5d80c74c"
text = "A Muralha"

["control.new_world.wall_width_permille"]
source = "7587d042711fcdc6"
text = "Largura da muralha"

["control.new_world.wall_width_permille.about"]
source = "ed46ede2804adb86"
text = "Largura máxima como proporção da área de geração. A muralha toma a sua terra primeiro da quantidade de Terra: quanto mais larga, menos sobra para os continentes ao lado, até restarem só algumas ilhas."

["control.new_world.wall_position_permille"]
source = "0dd527cf2049760f"
text = "Posição da muralha"

["control.new_world.wall_position_permille.about"]
source = "e24180840c880c30"
text = "Posição de oeste a leste. A muralha contorna as ilhas protegidas que estiverem no caminho."

["control.new_world.wall_coast_permille"]
source = "8b5e30417714cb5b"
text = "Irregularidade costeira"

["control.new_world.wall_coast_permille.about"]
source = "baf46134e0eb032f"
text = "Intensidade de baías, ilhas e variações costeiras dentro da faixa reta do continente."

["control.new_world.wall_ridge_permille"]
