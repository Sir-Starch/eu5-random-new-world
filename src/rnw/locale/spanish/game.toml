["rnw_formation_restoration_desc"]
source = "744415b1555053f9"
text = '''Un reino dominó antaño estas tierras, hasta que se rompió entre sus herederos, que aún lo recuerdan. Un heredero que domine lo bastante de su antiguo territorio, con su capital en él, puede alzarlo de nuevo y reclamar el resto como suyo: {name}. Los demás herederos deben aceptar la restauración o disputarla.'''

["STATIC_MODIFIER_NAME_rnw_restoration_heirs"]
source = "02fcf0134a6e1a2c"
text = '''Herederos del antiguo reino'''

["STATIC_MODIFIER_DESC_rnw_restoration_heirs"]
source = "3841570bacb1bb5a"
text = '''La corona restaurada reúne los antiguos cargos y devuelve sus provincias perdidas a un solo gobierno.'''

["rnw_restoration_heirs_tt"]
source = "14637a30b3e66320"
text = '''Cada uno de los demás herederos del antiguo reino debe reconocer la restauración o disputarla.'''

["rnw_restoration.title"]
source = "4e9f16af60fc9717"
text = '''El antiguo reino restaurado'''

["rnw_restoration.desc"]
source = "3862bfaf3cd1696c"
text = '''Enviados de [restorer.GetNameWithNoTooltip] han llegado con una proclama: el reino que compartían nuestros antepasados ha sido restaurado, y su nueva corona reclama como suyas todas las tierras que antaño tuvo, las nuestras incluidas. Nuestro consejo debe decidir si inclinarse ante el antiguo nombre o negarlo.'''

["rnw_restoration.a"]
source = "8de73f015f26ce75"
text = '''Reconocemos la corona restaurada.'''

["rnw_restoration.b"]
source = "5b9a238653e7fbf8"
text = '''La antigua corona no es más suya que nuestra.'''

["rnw_memory.lost_land.title"]
source = "6d03784bc71649e4"
text = '''La pérdida de [target_location.GetNameWithNoTooltip]'''

["rnw_memory.lost_land.desc"]
source = "313947eafa71e8c2"
text = '''Nuestros ancianos aún llaman nuestros a los campos de [target_location.GetNameWithNoTooltip], aunque [partner.GetNameWithNoTooltip] se los arrebató a nuestros abuelos. Los jóvenes preguntan si esa pérdida ha de durar para siempre.'''

["rnw_memory.lost_land.a"]
source = "515594395bbab00e"
text = '''Lo que fue nuestro volverá a serlo.'''

["rnw_memory.lost_land.b"]
source = "6211a94e051ab224"
text = '''Que la vieja herida se cierre.'''

["rnw_memory.old_pact.title"]
source = "11c48fbce58796de"
text = '''El antiguo pacto'''

["rnw_memory.old_pact.desc"]
source = "27565aab96e7c826"
text = '''Nuestro pueblo y [partner.GetNameWithNoTooltip] juraron antaño mantenerse unidos, y cumplieron su palabra. Sus enviados han venido a preguntar si la antigua promesa aún nos obliga.'''

["rnw_memory.old_pact.a"]
source = "b94ae141c5a67bf2"
text = '''La antigua promesa aún nos obliga.'''

["rnw_memory.old_pact.b"]
source = "deae4afc797b2fb4"
text = '''Esa promesa fue de nuestros abuelos, no nuestra.'''

["rnw_memory.kin.title"]
source = "6c53f1166e3b144c"
text = '''Parientes al otro lado de la frontera'''

["rnw_memory.kin.desc"]
source = "7025ad0a09571fe0"
text = '''Hace mucho tiempo, familias de nuestro pueblo se trasladaron entre nuestra tierra y [partner.GetNameWithNoTooltip], y se asentaron en [target_location.GetNameWithNoTooltip]. Sus hijos aún se recuerdan unos a otros y piden que el camino entre ellos siga abierto.'''

["rnw_memory.kin.a"]
source = "e63fcfb7dc836c71"
text = '''Nuestras puertas están abiertas a nuestros parientes.'''

["rnw_memory.kin.b"]
source = "bd82b91057f1971b"
text = '''Eligieron otra tierra; que se queden con ella.'''

["rnw_memory.shrine.title"]
source = "af02fa220fb67956"
text = '''Peregrinos a [target_location.GetNameWithNoTooltip]'''

["rnw_memory.shrine.desc"]
source = "8079fdc623e79727"
text = '''Durante generaciones, nuestros peregrinos han caminado hasta el santuario de [target_location.GetNameWithNoTooltip], bajo la paz que les concede [partner.GetNameWithNoTooltip]. Algunos de nuestros sacerdotes dicen ahora que un lugar sagrado no debería pertenecer a extraños.'''

["rnw_memory.shrine.a"]
source = "501fa6cb9698be73"
text = '''Honrar la paz del santuario.'''

["rnw_memory.shrine.b"]
source = "20bde48b4bda8b21"
text = '''El santuario debería ser nuestro.'''

["rnw_memory.heir.title"]
source = "42df00d9ae3f528e"
text = '''El recuerdo del antiguo reino'''

["rnw_memory.heir.desc"]
source = "1b8d09cdc1575552"
text = '''Nuestros cronistas recuerdan los días en que nuestra tierra era una con sus vecinas bajo una sola corona, con sede en [target_location.GetNameWithNoTooltip]. Ese reino ya no existe, pero no ha sido olvidado, y quien reúna lo bastante de su antiguo territorio podrá alzarlo de nuevo.'''

["rnw_memory.heir.a"]
source = "6dfe52d00f4856ad"
text = '''Alzaremos de nuevo el antiguo reino.'''

["rnw_memory.heir.b"]
source = "981a1c5531732d0e"
text = '''El antiguo reino ya no existe; dejadlo descansar.'''

["rnw_reform_river_markets"]
source = "c98e0101001dfd1a"
text = '''Carta de los mercados del río'''

["rnw_reform_river_markets_desc"]
source = "07319bc21fe9bfb3"
text = '''Las ciudades del río comercian bajo una misma carta, y sus mercaderes recorren todo su curso.'''

["rnw_reform_valley_council"]
source = "7fe79434140a15d2"
text = '''Consejo de los valles'''

["rnw_reform_valley_council_desc"]
source = "ebe81586e732414b"
text = '''Los jefes de cada valle se sientan en un mismo consejo, y nada se decide hasta que todos estén de acuerdo.'''

["rnw_reform_port_council"]
source = "229cf1f8d7a5629c"
text = '''Consejo de los puertos'''

["rnw_reform_port_council_desc"]
source = "b1b09e8b01fe91dc"
text = '''Las casas mercantiles de cada puerto gobiernan juntas la liga, y sus barcos llevan sus mercancías a todas las costas.'''

["rnw_reform_one_people"]
source = "fd6c4d4b18166d99"
text = '''Ley del pueblo único'''

["rnw_reform_one_people_desc"]
source = "82e5c34f269f9d61"
text = '''Una sola ley une a los pueblos de la mancomunidad y mantiene la paz entre sus muchas ciudades.'''

["rnw_reform_realm_provinces"]
source = "041fbf884f30138c"
text = '''Provincias del reino'''

["rnw_reform_realm_provinces_desc"]
source = "6d2906868d241c91"
text = '''El reino está dividido en provincias bajo sus gobernadores, y sus ciudades crecen bajo su cuidado.'''

["rnw_reform_national_articles"]
source = "03468bdf1a6efa04"
text = '''Artículos de la nación'''

["rnw_reform_national_articles_desc"]
source = "67501e96229f51f7"
text = '''Unos artículos escritos unen a los estados de la nación y a la asamblea que habla por ellos.'''

["rnw_reform_restored_crown"]
source = "c8fe56425fcf3bb3"
text = '''Ley de la corona restaurada'''

["rnw_reform_restored_crown_desc"]
source = "4d83a205137e54bb"
text = '''La corona restaurada recupera los antiguos derechos de sus predecesores y gobierna de nuevo desde una sola sede.'''

["rnw_decline.1.title"]
source = "3dd1b7659844a1e4"
text = '''El ocaso de [target_location.GetNameWithNoTooltip]'''

["rnw_decline.1.desc"]
source = "c5fae87ab12e8259"
text = '''[target_location.GetNameWithNoTooltip] fue antaño la sede de un reino que gobernaba todos los valles de alrededor. El reino se rompió hace mucho. Sus grandes patios están medio vacíos, los barrios exteriores vuelven a ser bosque y las familias que los habitaban se marchan a ciudades más jóvenes.\n\nLos ancianos de la ciudad preguntan si volverá a ser grande, o solo segura.'''

["rnw_decline.1.a"]
source = "ebec51f47bb012d8"
text = '''Reconstruir los viejos patios y llamar a las familias de vuelta.'''

["rnw_decline.1.b"]
source = "2822afffd76cf9be"
text = '''Amurallar el corazón de la ciudad y dejar ir el resto.'''

["rnw_decline.2.title"]
source = "f07c4c037a05e3eb"
text = '''Una nueva edad dorada'''

["rnw_decline.2.desc"]
source = "fe3cb50f1780e463"
text = '''Los patios de [target_location.GetNameWithNoTooltip] vuelven a estar llenos. Los artesanos trabajan en las viejas terrazas y los peregrinos acuden a ver lo que construyeron los antepasados. Algunos en la corte dicen que la ciudad debería ahora guiar la tierra como antaño.'''

["rnw_decline.2.a"]
source = "52923b04d9eac118"
text = '''Que la ciudad vuelva a guiar.'''

["rnw_decline.2.b"]
source = "e221439368027a4b"
text = '''Conformarse con la ciudad restaurada.'''

["rnw_decline.3.title"]
source = "c2c80a4020d94373"
text = '''La sombra sobre [target_location.GetNameWithNoTooltip]'''

["rnw_decline.3.desc"]
source = "9088c57e95aede13"
text = '''Tras sus nuevas murallas, [target_location.GetNameWithNoTooltip] está a salvo, y es más pequeña cada año. Los barrios vacíos de fuera se han vuelto campos y matorrales, y los viajeros hablan de la ciudad como de una ruina con guarnición.'''

["rnw_decline.3.a"]
source = "6e51bbc634b77e3d"
text = '''Las murallas valieron la pena.'''

["rnw_decline.3.b"]
source = "a49ba0633c7d61c0"
text = '''Invitar a colonos a los barrios vacíos.'''

["STATIC_MODIFIER_NAME_rnw_decline_rebuilding"]
source = "ed85686f202140d9"
text = '''Reconstrucción de los viejos patios'''

["STATIC_MODIFIER_DESC_rnw_decline_rebuilding"]
source = "e9c2af8b2b9fc5fc"
text = '''Canteros y familias regresan a los patios de la antigua sede.'''

["STATIC_MODIFIER_NAME_rnw_decline_fortified"]
source = "78040151a1a67f82"
text = '''El corazón amurallado'''

["STATIC_MODIFIER_DESC_rnw_decline_fortified"]
source = "57cf3f4fa3374287"
text = '''El corazón de la antigua sede está amurallado y guarnecido.'''

["STATIC_MODIFIER_NAME_rnw_decline_golden_age"]
source = "145441a99b625ab8"
text = '''La antigua sede vuelve a guiar'''

["STATIC_MODIFIER_DESC_rnw_decline_golden_age"]
source = "cf3b7ff492ed1a96"
text = '''La ciudad restaurada atrae artesanos, eruditos y tributos de toda la tierra.'''

["STATIC_MODIFIER_NAME_rnw_decline_shadow"]
source = "296709711159011b"
text = '''Una ruina con guarnición'''

["STATIC_MODIFIER_DESC_rnw_decline_shadow"]
source = "11a730ce7bb2fe79"
text = '''Los viajeros hablan de la antigua sede como de una sombra de lo que fue.'''

["STATIC_MODIFIER_NAME_rnw_decline_resettled"]
source = "8274df482f4588de"
text = '''Colonos en los barrios vacíos'''

["STATIC_MODIFIER_DESC_rnw_decline_resettled"]
source = "5ea7a09878b27a82"
text = '''Nuevas familias llenan los barrios vacíos de la antigua sede.'''

["rnw_council.1.title"]
source = "b4e7094533513141"
text = '''El Gran Consejo'''

["rnw_council.1.desc"]
source = "e8fa63c6638665fc"
text = '''Los jefes de todos los pueblos de nuestra confederación se han reunido en [target_location.GetNameWithNoTooltip] para el Gran Consejo. Según la vieja ley, nada se decide hasta que todos estén de acuerdo, y este año tienen mucho en que ponerse de acuerdo.\n\nNuestro propio jefe puede dejar que el consejo hable con una sola voz pausada, o hablar el primero y más alto.'''

["rnw_council.1.a"]
source = "0503a3f754419f6f"
text = '''Que el consejo decida en común.'''

["rnw_council.1.b"]
source = "3d0cadb02d62b4d3"
text = '''Nuestra voz guiará el consejo.'''

["rnw_council.2.title"]
source = "bdd492090bb9debb"
text = '''Una nueva delegación'''

["rnw_council.2.desc"]
source = "c98b72faac08d982"
text = '''Un pueblo de más allá de nuestras fronteras ha enviado una delegación al consejo de [target_location.GetNameWithNoTooltip]. Sus enviados piden sentarse entre los jefes y guardar la ley de la confederación como propia.'''

["rnw_council.2.a"]
source = "567fa5f1e3a6044d"
text = '''Dadles un sitio junto al fuego.'''

["rnw_council.2.b"]
source = "9471fe0792fa23db"
text = '''El consejo está completo.'''

["rnw_council.3.title"]
source = "874b725a727a0a9b"
text = '''Los jefes están enojados'''

["rnw_council.3.desc"]
source = "5c3955cce944b26b"
text = '''Los jefes a quienes se cortó la palabra en el consejo han vuelto de [target_location.GetNameWithNoTooltip] llenos de ira. Algunos hablan de abandonar la confederación.'''

["rnw_council.3.a"]
source = "c44abb77c015f05c"
text = '''Enviar regalos a cada jefe.'''

["rnw_council.3.b"]
source = "514be8b6eec366bf"
text = '''Su enojo pasará.'''

["STATIC_MODIFIER_NAME_rnw_council_peace"]
source = "4315d2c7eee55c49"
text = '''Una sola voz del consejo'''

["STATIC_MODIFIER_DESC_rnw_council_peace"]
source = "2d412c8f4e3f1d44"
text = '''Los jefes deciden juntos, despacio, y sus pueblos cumplen lo que deciden.'''

["STATIC_MODIFIER_NAME_rnw_council_assertive"]
source = "44e0dd172a716cae"
text = '''Un consejo desoído'''

["STATIC_MODIFIER_DESC_rnw_council_assertive"]
source = "c126f271e8ab388a"
text = '''Nuestro jefe habla por el consejo, y los demás jefes se lo reprochan.'''

["rnw_senior.1.title"]
source = "8a0392279a2c60ed"
text = '''El equilibrio de la alianza'''

["rnw_senior.1.desc"]
source = "c60827cfe5e974c4"
text = '''Durante una generación nuestra corte y sus aliados se han mantenido unidos, y ningún vecino se ha atrevido a ponerlos a prueba. Ahora nuestra corte es la más fuerte de todas, y nuestros nobles preguntan por qué el botín de cada guerra debe repartirse a partes iguales con [target_country.GetName].'''

["rnw_senior.1.a"]
source = "a42b01208b4b1ada"
text = '''Ocuparemos el primer lugar entre nuestros aliados.'''

["rnw_senior.1.b"]
source = "5300de972d911391"
text = '''Estuvimos juntos como iguales, y así seguiremos.'''

["rnw_senior.2.title"]
source = "aada9ff26807d3c0"
text = '''El socio menor protesta'''

["rnw_senior.2.desc"]
source = "56f863fcfc28ea25"
text = '''Enviados de [target_country.GetName] recuerdan a nuestra corte que sus guerreros sangraron junto a los nuestros. Piden una parte igual del tributo, o reconsiderarán la alianza.'''

["rnw_senior.2.a"]
source = "57b81bcae2e47aef"
text = '''Dadles su parte del tributo.'''

["rnw_senior.2.b"]
source = "2e41afb4ddc50636"
text = '''Nos necesitan más que nosotros a ellos.'''

["rnw_senior.3.title"]
source = "f33618a6e39b1ac4"
text = '''Regalos entre iguales'''

["rnw_senior.3.desc"]
source = "31a432876c7d6948"
text = '''La corte de [target_country.GetName] ha enviado regalos para honrar la vieja alianza, y espera a ver qué enviará la nuestra a cambio.'''

["rnw_senior.3.a"]
source = "eebec55c40a0fd41"
text = '''Devolver regalos aún más ricos.'''

["rnw_senior.3.b"]
source = "8c56d76df18a23e8"
text = '''Bastará con nuestro agradecimiento.'''

["rnw_nation.1.title"]
source = "be38d247de5f8725"
text = '''La asamblea de los delegados'''

["rnw_nation.1.desc"]
source = "454f7eca77815ade"
text = '''Los delegados de todas las ciudades de la nueva nación se han reunido en [target_location.GetNameWithNoTooltip] para decidir cómo se gobernará. Unos quieren una república de ciudades libres; otros dicen que una nación joven necesita una corona que la mantenga unida.'''

["rnw_nation.1.a"]
source = "dac2a7edd2cc8b83"
text = '''Una república de ciudades libres.'''

["rnw_nation.1.b"]
source = "7ab2b89252812153"
text = '''Una corona que mantenga unida a la nación.'''

["rnw_nation.2.title"]
source = "16ff1ee78d2287cd"
text = '''La ordenanza de la frontera'''

["rnw_nation.2.desc"]
source = "837b55fe72b75d71"
text = '''La asamblea de [target_location.GetNameWithNoTooltip] debe decidir qué será de la tierra más allá de la costa poblada. Los agrimensores quieren medirla, venderla y unirla con caminos; otros dicen que pertenece a los pueblos que viven allí.'''

["rnw_nation.2.a"]
source = "a66b4892ba0f52a4"
text = '''Medir la frontera y abrir caminos en ella.'''

["rnw_nation.2.b"]
source = "d89dfe8abb0da82d"
text = '''Dejar la frontera a sus pueblos.'''

["rnw_nation.3.title"]
source = "e0d3ebbd474754be"
text = '''Una corona para la nación'''

["rnw_nation.3.desc"]
source = "b44240c9bf06e2fa"
text = '''Los delegados han elegido una corona, y la nueva corte de [target_location.GetNameWithNoTooltip] debe decidir a quién recompensa: a los fundadores de las ciudades o a las viejas familias que llegaron del otro lado del mar.'''

["rnw_nation.3.a"]
source = "a8122d8c264b7555"
text = '''Recompensar a los fundadores de las ciudades.'''

["rnw_nation.3.b"]
source = "08d05dbcb8725972"
text = '''Honrar a las viejas familias.'''

["STATIC_MODIFIER_NAME_rnw_nation_roads"]
source = "69bccd5fa130c0bd"
text = '''Caminos hacia la frontera'''

["STATIC_MODIFIER_DESC_rnw_nation_roads"]
source = "671d8ac3385e6289"
text = '''Agrimensores y constructores de caminos llevan los caminos de la nación más allá de la costa poblada.'''

["rnw_naming.title"]
source = "82708204008b5b60"
text = '''Un nombre para el nuevo Estado'''

["rnw_naming.desc"]
source = "360aafa7c1166035"
text = '''El nuevo Estado necesita un nombre por el que lo conozcan sus vecinos. Algunos en la corte prefieren el nombre con que fue proclamado; otros lo llamarían por la tierra que ahora gobierna.'''

["rnw_naming.keep"]
source = "83549dc6c7c223ec"
text = '''Conservar el nombre: {name}.'''

["rnw_naming.take"]
source = "0eff740f9b97f82f"
text = '''Tomar el nombre: {name}.'''

["rnw_formation_two_shores_name"]
source = "3bc268bf8490e630"
text = '''Imperio de las Dos Orillas'''

["rnw_formation_two_shores_name_adj"]
source = "400671422a0de267"
text = '''de las Dos Orillas'''

["rnw_formation_two_worlds_name"]
source = "2f85382541be3bad"
text = '''Corona de los Dos Mundos'''

["rnw_formation_two_worlds_name_adj"]
source = "1349ccd918705484"
text = '''de los Dos Mundos'''

["rnw_formation_two_oceans_name"]
source = "13126384cc6effe8"
text = '''Imperio de los Dos Océanos'''

["rnw_formation_two_oceans_name_adj"]
source = "00f9e76a2534af31"
text = '''de los Dos Océanos'''

["rnw_formation_two_peoples_name"]
source = "be9e07854a4e2e6b"
text = '''Reino de los Dos Pueblos'''

["rnw_formation_two_peoples_name_adj"]
source = "aab153dd88cc8043"
text = '''de los Dos Pueblos'''

["rnw_formation_two_shores_desc"]
source = "473b50435cb358d9"
text = '''Ningún pueblo de este continente ha gobernado jamás al otro lado del gran océano. Una potencia de sus propios pueblos que posea tierras en la orilla lejana y buena parte de su continente natal puede proclamar un imperio de ambas orillas: {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_shores_voyagers"]
source = "dec7efd625ab7d44"
text = '''Navegantes a la orilla lejana'''

["STATIC_MODIFIER_DESC_rnw_two_shores_voyagers"]
source = "b17650f2a8d54598"
text = '''Nuestros barcos cruzan el gran océano hacia tierras que ningún antepasado conoció.'''

["rnw_formation_two_worlds_desc"]
source = "8933a92bcf6a6335"
text = '''La corte de un viejo país ha cruzado el océano y se ha establecido en este continente, mientras su antigua patria aún le obedece. Una corona que reine a ambos lados del océano, con su capital aquí, puede proclamar una sola corona sobre ambos mundos: {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_worlds_union"]
source = "9bb6203ca44ee2f1"
text = '''Una corona, dos mundos'''

["STATIC_MODIFIER_DESC_rnw_two_worlds_union"]
source = "ec15c579d765b459"
text = '''La antigua patria y la nueva corte obedecen a la misma corona.'''

["rnw_formation_two_oceans_desc"]
source = "287d1ce2e64d72e3"
text = '''Este continente se extiende entre dos océanos, y ninguna potencia ha navegado jamás por ambos. Una que posea puertos en los dos y buena parte de la tierra entre ellos puede proclamar un imperio de los dos océanos: {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_oceans_sea_power"]
source = "5240aa554bdc6edf"
text = '''Señora de dos océanos'''

["STATIC_MODIFIER_DESC_rnw_two_oceans_sea_power"]
source = "5997155c1a0aa978"
text = '''Nuestras flotas dominan las rutas marítimas de ambos océanos.'''

["rnw_formation_great_law_desc"]
source = "984cd3a2649f2fa6"
text = '''Los pueblos de una confederación viven desde hace generaciones bajo una sola gran ley, cada uno con su propio consejo. El jefe que los guía y domina lo bastante de sus tierras puede unirlos en un solo Estado bajo esa ley: {name}.'''

["STATIC_MODIFIER_NAME_rnw_great_law_league"]
source = "06e46ef8dffbd992"
text = '''Pueblos de la gran ley'''

["STATIC_MODIFIER_DESC_rnw_great_law_league"]
source = "ae42b7744b3395cf"
text = '''Los pueblos de la antigua confederación luchan y comercian como uno solo.'''

["rnw_formation_two_peoples_desc"]
source = "7a91ebd282c9e756"
text = '''Los colonos y los pueblos de este continente se han casado, comerciado y rezado juntos hasta que nadie sabe dónde acaba uno. Un Estado que tenga a ambos pueblos por suyos y buena parte del continente puede proclamar un reino de los dos pueblos: {name}.'''

["STATIC_MODIFIER_NAME_rnw_two_peoples_integration"]
source = "0fd80ff5371517ee"
text = '''Dos pueblos, un reino'''

["STATIC_MODIFIER_DESC_rnw_two_peoples_integration"]
source = "77bf4dd8870d78b3"
text = '''El reino toma a ambos pueblos como suyos y acoge sus costumbres.'''

["rnw_road.name"]
source = "2a2a11954c349bc8"
text = '''El camino hacia {name}'''

["rnw_road.desc"]
source = "e6619312e0e3825f"
text = '''Reunir las tierras bajo nuestro dominio y proclamar el nuevo Estado: {name}.'''

["rnw_road.seat"]
source = "c50808a05e63c6f2"
text = '''Tomar la sede'''

["rnw_road.seat_desc"]
source = "d248d862f432b46c"
text = '''La sede del nuevo Estado debe ser nuestra antes de que sus tierras la sigan.'''

["rnw_road.land"]
source = "9df238c90f736f30"
text = '''Reunir las tierras'''

["rnw_road.land_desc"]
source = "0f35b903317a3f42"
text = '''Debemos dominar buena parte de sus tierras antes de poder proclamar el nuevo Estado.'''

["rnw_road.proclaim"]
source = "a3422fb1ef9d8d24"
text = '''Proclamar el nuevo Estado'''

["rnw_road.proclaim_desc"]
source = "faed96e7a4804d75"
text = '''Con las tierras en nuestras manos, podemos proclamar {name}.'''

