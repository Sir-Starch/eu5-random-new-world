["estimate_tip"]
source = "34f3f38a503b4cdc"
text = "En EU5, las localizaciones incluyen provincias terrestres, zonas marítimas y lagos de todo el mundo (~22 000 pertenecen al Viejo Mundo fijo).\n\nEl motor utiliza un índice de 16 bits (~32 767 como máximo). Para evitar fallos, el generador se mantiene por debajo de 31 200.\n\nPor qué «mucha tierra» puede mostrar menos localizaciones:\nLas zonas marítimas también son localizaciones. Más tierra significa menos océano (menos zonas marítimas), y el tamaño de las celdas terrestres aumenta automáticamente en grandes masas de tierra para no superar el límite. En consecuencia, el total puede disminuir; es un ajuste de presupuesto normal y no un error."

