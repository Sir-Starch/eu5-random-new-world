source = "bc1247e7baf206f8"

[meta]
title = "Random New World · 玩家指南"
description = "为Europa Universalis V打造属于你的新世界：四步开始第一场战役，了解世界类型、设置、兼容性，以及常见问题的解答。"
language = "语言"
contents = "目录"
skip = "跳到指南"
image_hero = "RNW在Europa Universalis V中生成的新世界，西半部仍是Terra Incognita"

[nav]
start = "第一个世界"
rules = "开始之前"
types = "世界类型"
settings = "设置"
hidden = "隐藏地图"
library = "你的世界"
