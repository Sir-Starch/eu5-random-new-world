[hero]
kicker = "玩家指南"
lead = "在下一场EU5战役中，用一个全新的世界取代美洲。向西驶入未知的海域，或者领导一个原住民国家。旧世界保持原版不变。"
fact_generator = "生成器 {v:version}"
fact_game = "EU5 {v:game}"
fact_languages = "11种语言"
cta = "创建第一个世界"
cta_help = "遇到问题？"

[start]
title = "四步创建第一个世界"
lead = "第一场战役用默认设置就足够了。本页的其他内容可以以后再看。"
"1_title" = "打开生成器"
"1_text" = "在EU5中打开{game:mods_dlcs}，找到**Random New World (RNW)**，点击{game:open_folder}。在该文件夹中运行**Random New World Generator**。"
"1_note" = "生成器打开后，你可以关闭EU5以释放内存。"
"2_title" = "选择世界"
"2_text" = "点击{ui:new_world}，在{ui:new_tab.world}标签页中选择{ui:type}。初次游玩推荐{ui:type.continents}。其他保持不变，或粘贴朋友给你的{ui:code}。"
"3_title" = "生成"
"3_text" = "在{ui:new_tab.output}标签页中保留{ui:destination.library}，并勾选{ui:install}。点击{ui:generate}，等待几分钟。"
"3_note" = "生成需要约7.5GB空闲内存。"
"4_title" = "启用并开始游戏"
"4_text" = "在{game:mods_dlcs}中勾选你的新世界，例如**RNW: Small continents 7K3Q**，点击{game:apply}，然后开始一场1337年的新战役。"
"4_note" = "不要勾选**Random New World (RNW)**本身：它只包含生成器。战役所需的一切都在你的世界模组里。"
ready_title = "只想直接开玩？"
ready_text = "订阅现成的世界[RNW: The Wall CWYS](https://steamcommunity.com/sharedfiles/filedetails/?id=3832180151)，无需生成器。"

[rules]
title = "开始之前"
lead = "生成的地图和其他模组一样，只是有几条自己的规则。"
"1_title" = "仅限新战役"
"1_text" = "地图无法加入正在进行的战役。请在1337年开始新游戏。"
"2_title" = "一次一个世界"
"2_text" = "只勾选你正在玩的世界。生成器条目保持不勾选。"
"3_title" = "切换需重启"
"3_text" = "在玩另一个世界或替换已加载的世界之前，请完全关闭EU5。在同一次运行中切换，可能导致地图混杂、游戏崩溃。"
"4_title" = "模组与存档一起保留"
"4_text" = "为每场战役保留它的世界模组和EU5版本。世界代码是配方，不是备份：换一个游戏或生成器版本，同一代码可能生成不同的世界。"

[types]
title = "世界类型"
lead = "世界类型就是一套初始设置。选择你喜欢的形状，再在{ui:new_tab.world}标签页或{ui:new_tab.advanced}中调整。"
wall_note = "关闭{ui:control.new_world.wall_allow_gaps}后，高墙会成为一道连续的屏障，船只既无法穿越，也无法绕行。"

[settings]
title = "按你的想法"
lead = "任何数值都能生成可玩的世界。以下是值得了解的设置；{ui:reset_all}可撤销你的更改。"
seed_title = "{ui:seed}与{ui:code}"
seed_text = "种子决定世界，{ui:random}会抽取一个新种子。世界代码包含种子和全部设置：复制它即可分享世界，粘贴代码即可生成世界。使用相同的生成器版本和游戏文件，同一代码会生成同一个世界。"
sketch_title = "{ui:candidates}"
sketch_text = "在生成完整世界之前，先显示六张陆地草图。选择其中一张，即可沿用它的种子和设置。草图会暴露陆地形状，最终海岸线仍可能略有变化。"
draw_title = "亲手绘制大陆"
draw_text = "{ui:land_template}会给你一张可供填充区域的图片。用白色画陆地、黑色画海洋，再用{ui:land_image}载入。地形、河流和民族会在你的轮廓上生成。"
ocean_title = "{ui:control.new_world.expand_oceans}"
ocean_text = "默认开启：大陆可以越过美洲原有的轮廓向外延伸。在{ui:new_tab.advanced}中调高{ui:control.new_world.centre_permille}，可让陆地移向大洋中部。"
peoples_title = "原住民社会"
peoples_text = "{ui:new_tab.world}标签页中的{ui:quick.states}是快速选项。在{ui:new_tab.advanced}中，{ui:control.natives.state_share_permille}决定有人居住的土地中国家所占的比例（3–60%），{ui:control.natives.peasant_peak_permille}限制定居地中农民所占比例的上限（30–80%）。贫瘠的耕地更多保持部落形态。"
resources_title = "资源"
resources_text = "在{ui:new_tab.advanced}中，每种资源都有自己的出现频率：1×与原版相同，0则完全移除。一种资源越多，留给其他资源的地点就越少。每种资源能出现在哪里，仍由气候和地形决定。"

[hidden]
title = "保留惊喜"
lead = "新世界一开始是隐藏的。选择国家时，新世界所在处显示为Terra Incognita，但你仍可以从列表中选择原住民国家。"
covered = "隐藏：新世界是Terra Incognita"
shown = "显示：1337年的原住民国家"
reveal_text = "在生成器内显示该世界的地图。游戏中的设置另行保存。"
show_text = "显示EU5中的模组图片和选择国家时的地图。可在{ui:new_tab.output}标签页中设置，也可以之后在该世界的{ui:tab.world}标签页中更改，无需重新生成；然后关闭并重新打开模组菜单。"
atlas = "显示后的世界在{ui:tab.maps}中提供十种地图：陆地、国家、文化、宗教、资源等。{ui:compare}可将两个世界并排对照。"

[library]
title = "你的世界"
lead = "你生成的一切都会连同代码、地图和笔记一起保存在生成器的库中。"
versions_title = "{ui:world_versions}"
versions_text = "选择一个已完成的世界。{ui:part.peoples.button}会在同一片陆地上生成新的国家、文化和宗教；{ui:part.resources.button}只重新分配资源。旧版本会保留在库中。"
queue_title = "连续生成多个世界"
queue_text = "{ui:enqueue}会把当前设置保存为一项任务，{ui:run_queue}则依次生成这些世界。生成过程中也可以继续添加。"
share_title = "分享世界"
share_text = "发送世界代码，或使用{ui:export_file}得到一个包含地图和笔记的`.rnworld`文件。朋友可以用自己的游戏从中生成可游玩的模组。"
move_title = "把世界转移到另一台电脑"
move_text = "{ui:send_built}会把整个已构建的模组保存为`.rnworld-mod`文件，便于带到你的另一台电脑上。两台电脑需要相同的游戏版本。"
clean_title = "整理"
clean_text = "{ui:library_remove}会把世界从游戏中移除，但保留记录。{ui:library_delete}会将其彻底删除。"

[compat]
title = "兼容性"
game = "游戏版本"
game_text = "EU5 {v:game}。1.4分支的新补丁通常无需更新生成器即可使用；最近一次完整验证的版本为{v:verified}。"
saves = "存档"
saves_text = "仅限新战役。更新生成器不会改变已有的世界及其存档。"
pillars = "Across the Pillars"
pillars_text = "支持，且非必需。新大陆探险和宝藏船队使用生成的地图。"
refined = "Refined Colonization"
refined_text = "兼容。加载顺序：先Refined Colonization，再你的世界模组。"
multiplayer = "多人游戏"
multiplayer_text = "支持，并已由社区测试。所有玩家都需要相同的游戏版本、相同的世界模组和相同的其他模组。"
ironman = "铁人模式与成就"
ironman_text = "按游戏的常规规则生效。"
maps = "地图大改模组"
maps_text = "替换美洲的模组与RNW冲突。其他组合未经测试。"
system = "系统"
system_text = "Windows，或通过Proton运行的Linux和Steam Deck。不支持macOS。"

[help]
title = "遇到问题时"
found_q = "生成器找不到EU5"
found_a = "打开{ui:settings_title}，选择缺少的文件夹。如果你从未启动过EU5，请先启动一次以创建配置文件，然后重新打开生成器。"
memory_q = "内存不足"
memory_a = "生成需要约7.5GB空闲内存，而EU5即使停在主菜单也可能占用16GB中的大部分。生成器打开后请关闭EU5，或者不启动游戏直接运行生成器：它位于Steam的`steamapps/workshop/content/3450310/3829217331`文件夹中。"
blank_q = "窗口空白或显示错乱"
blank_a = "打开{ui:settings_title}，选择{ui:settings.classic_window}，然后重新启动生成器。如果窗口根本打不开，请加上`--classic`启动程序。"
classic_q = "打开了一个更简朴的窗口"
classic_a = "这是经典窗口，主窗口能做的它都能做。当系统没有WebView2（Windows）或WebKitGTK 4.1（Linux）时，例如EU5常见的Proton环境，它会自动打开。"
error_q = "生成因错误而中止"
error_a = "请阅读提示信息：它会说明问题出在游戏文件、保存位置、设置还是地图上。某些种子和设置无法生成有效的世界；{ui:retry_new_seed}会换一个种子再试。"
blocked_q = "Windows或杀毒软件拦截了生成器"
blocked_a = "生成器没有数字签名，因此Smart App Control或杀毒软件可能会提出警告。它不需要管理员权限。[发布说明](https://github.com/Sir-Starch/eu5-random-new-world/releases)列出了每个文件的扫描结果；如遇拦截，请在GitHub上反馈。"
picture_q = "模组菜单仍显示旧的地图图片"
picture_a = "从EU5主菜单关闭模组菜单后重新打开。如果是世界本身发生了变化，请完全重启游戏。"
library_q = "我的世界保存在哪里？"
library_a = "保存在模组文件夹之外的库中，因此生成器的每个副本都能看到相同的世界。Windows：`%LOCALAPPDATA%\\RandomNewWorld`。Linux：`~/.local/share/random-new-world`。Proton：EU5的Proton前缀中的Windows位置。"
bug_q = "我发现了一个bug"
bug_a = "请附上世界代码，[在GitHub上提交问题](https://github.com/Sir-Starch/eu5-random-new-world/issues)。{ui:settings_title}中的{ui:diagnostics}会把生成器日志打包成一个文件供你附上；任何内容都不会自动发送。"

