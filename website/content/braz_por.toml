[hero]
kicker = "Guia do jogador"
lead = "Troque as Américas por um novo mundo na sua próxima campanha de EU5. Navegue para o oeste rumo a águas desconhecidas ou comande um dos seus países nativos. O Velho Mundo continua intacto."
fact_generator = "Gerador {v:version}"
fact_game = "EU5 {v:game}"
fact_languages = "11 idiomas"
cta = "Criar meu primeiro mundo"
cta_help = "Algo deu errado?"

[start]
title = "Seu primeiro mundo em quatro passos"
lead = "As configurações padrão bastam para uma primeira campanha. Todo o resto desta página pode esperar."
"1_title" = "Abra o gerador"
"1_text" = "No EU5, abra {game:mods_dlcs}, encontre **Random New World (RNW)** e clique em {game:open_folder}. Nessa pasta, execute **Random New World Generator**."
"1_note" = "Com o gerador aberto, você pode fechar o EU5 para liberar memória."
"2_title" = "Escolha um mundo"
"2_text" = "Clique em {ui:new_world} e, na aba {ui:new_tab.world}, escolha um {ui:type}. {ui:type.continents} é uma boa primeira escolha. Deixe o resto como está ou cole o {ui:code} de um amigo."
"3_title" = "Gere o mundo"
"3_text" = "Na aba {ui:new_tab.output}, mantenha {ui:destination.library} e marque {ui:install}. Clique em {ui:generate} e espere alguns minutos."
"3_note" = "A geração precisa de cerca de 9 GB de RAM livre."
"4_title" = "Ative e jogue"
"4_text" = "Em {game:mods_dlcs}, marque o seu novo mundo, por exemplo **RNW: Small continents 7K3Q**, clique em {game:apply} e comece uma nova campanha em 1337."
"4_note" = "Deixe o próprio **Random New World (RNW)** desmarcado: ele só contém o gerador. O mod do seu mundo tem tudo de que a campanha precisa."
ready_title = "Só quer jogar?"
ready_text = "Inscreva-se em [RNW: The Wall CWYS](https://steamcommunity.com/sharedfiles/filedetails/?id=3832180151), um mundo pronto. Não precisa do gerador."

[rules]
title = "Antes de jogar"
lead = "Um mapa gerado é um mod como qualquer outro, com algumas regras próprias."
"1_title" = "Só campanhas novas"
"1_text" = "Não dá para adicionar um mapa a uma campanha em andamento. Comece um novo jogo em 1337."
"2_title" = "Um mundo por vez"
"2_text" = "Marque só o mundo que você está jogando. O item do gerador fica desmarcado."
"3_title" = "Reinicie para trocar"
"3_text" = "Feche o EU5 por completo antes de jogar outro mundo ou substituir um que já foi carregado. Trocar na mesma sessão pode misturar os mapas e travar o jogo."
"4_title" = "O mod fica com os saves"
"4_text" = "Guarde o mod de mundo de cada campanha e a versão do EU5 dela. Um código de mundo é uma receita, não um backup: outra versão do jogo ou do gerador pode criar um mundo diferente a partir dele."

[types]
title = "Tipos de mundo"
lead = "Um tipo de mundo é um conjunto inicial de configurações. Escolha o formato que preferir e depois ajuste na aba {ui:new_tab.world} ou em {ui:new_tab.advanced}."
wall_note = "Com {ui:control.new_world.wall_allow_gaps} desmarcado, a Muralha vira uma barreira contínua que os navios não conseguem atravessar nem contornar."

[settings]
title = "Do seu jeito"
lead = "Qualquer valor ainda gera um mundo jogável. Estas são as opções que vale a pena conhecer; {ui:reset_all} desfaz suas mudanças."
seed_title = "{ui:seed} e {ui:code}"
seed_text = "A semente define o mundo, e {ui:random} sorteia uma nova. Um código de mundo guarda a semente e todas as configurações: copie para compartilhar um mundo ou cole um para criá-lo. O mesmo código gera o mesmo mundo com a mesma versão do gerador e os mesmos arquivos do jogo."
sketch_title = "{ui:candidates}"
sketch_text = "Mostra seis esboços de terra antes de construir o mundo inteiro. Escolha um para usar a semente e as configurações dele. Os esboços revelam a terra, e o litoral final ainda pode mudar um pouco."
draw_title = "Seu próprio continente"
draw_text = "{ui:land_template} dá uma imagem da área que você pode preencher. Pinte a terra de branco e o mar de preto e carregue a imagem com {ui:land_image}. Relevo, rios e povos são gerados sobre o seu contorno."
ocean_title = "{ui:control.new_world.expand_oceans}"
ocean_text = "Ligado por padrão: os continentes ganham espaço além do antigo contorno das Américas. Aumente {ui:control.new_world.centre_permille} em {ui:new_tab.advanced} para levar a terra para o meio do oceano."
peoples_title = "Sociedades nativas"
peoples_text = "{ui:quick.states} na aba {ui:new_tab.world} é a escolha rápida. Em {ui:new_tab.advanced}, {ui:control.natives.state_share_permille} define quanto da terra habitada fica com Estados (3–60%), e {ui:control.natives.peasant_peak_permille} limita a parcela de camponeses numa localidade sedentária (30–80%). Terras pobres continuam mais tribais."
resources_title = "Recursos"
resources_text = "Em {ui:new_tab.advanced}, cada recurso tem a sua própria frequência: 1× é o jogo base, 0 remove o recurso. Mais de um deixa menos localidades para os outros. O clima e o terreno continuam decidindo onde cada um pode aparecer."

[hidden]
title = "Mantenha a surpresa"
lead = "Novos mundos começam ocultos. A seleção de país mostra a Terra Incognita no lugar do Novo Mundo, e você ainda pode escolher um país nativo na lista."
covered = "Oculto: o Novo Mundo é Terra Incognita"
shown = "Visível: os países nativos de 1337"
reveal_text = "Revela os mapas do mundo dentro do gerador. O jogo mantém a própria configuração."
show_text = "Revela a imagem do mod e o mapa de seleção de país no EU5. Defina isso na aba {ui:new_tab.output} ou depois na aba {ui:tab.world} do mundo, sem gerar de novo; em seguida, feche e abra de novo o menu de mods."
atlas = "Um mundo revelado abre dez mapas em {ui:tab.maps}: terra, países, culturas, religiões, recursos e mais. {ui:compare} coloca dois mundos lado a lado."

[library]
title = "Seus mundos"
lead = "Tudo o que você gera fica na biblioteca do gerador, com código, mapas e anotações."
versions_title = "{ui:world_versions}"
versions_text = "Selecione um mundo pronto. {ui:part.peoples.button} cria novos países, culturas e religiões na mesma terra; {ui:part.resources.button} sorteia de novo só os recursos. A versão anterior continua na biblioteca."
queue_title = "Vários mundos em sequência"
queue_text = "{ui:enqueue} guarda as configurações atuais como uma tarefa, e {ui:run_queue} cria os mundos um depois do outro. Dá para adicionar mais enquanto um está sendo gerado."
share_title = "Compartilhe um mundo"
share_text = "Envie o código do mundo ou use {ui:export_file} para gerar um arquivo `.rnworld` com mapas e anotações. Seu amigo cria o mod jogável a partir dele com o próprio jogo."
move_title = "Leve um mundo para outro computador"
move_text = "{ui:send_built} salva o mod construído inteiro num arquivo `.rnworld-mod` para levar a outro computador seu. Os dois precisam da mesma versão do jogo."
clean_title = "Faxina"
clean_text = "{ui:library_remove} tira os mundos do jogo e mantém os registros deles. {ui:library_delete} apaga tudo de vez."

[compat]
title = "Compatibilidade"
game = "Versão do jogo"
game_text = "EU5 {v:game}. Novos patches da versão 1.4 costumam funcionar sem atualizar o gerador; última verificação completa na {v:verified}."
saves = "Saves"
saves_text = "Só campanhas novas. Atualizar o gerador não muda os mundos existentes nem os saves deles."
pillars = "Across the Pillars"
pillars_text = "Compatível e opcional. Expedições ao Novo Mundo e frotas de tesouros usam o mapa gerado."
refined = "Refined Colonization"
refined_text = "Compatível. Ordem de carregamento: primeiro Refined Colonization, depois o mod do seu mundo."
multiplayer = "Multiplayer"
multiplayer_text = "Compatível e testado pela comunidade. Todos os jogadores precisam da mesma versão do jogo, do mesmo mod de mundo e dos mesmos outros mods."
ironman = "Homem de Ferro e conquistas"
ironman_text = "Funcionam pelas regras normais do jogo."
maps = "Reformulações do mapa"
maps_text = "Mods que substituem as Américas entram em conflito com o RNW. Outras combinações não foram testadas."
system = "Sistema"
system_text = "Windows, ou Linux e Steam Deck via Proton. O macOS não é suportado."

[help]
title = "Se algo der errado"
found_q = "O gerador não encontra o EU5"
found_a = "Abra {ui:settings_title} e escolha a pasta que falta. Se você nunca abriu o EU5, abra uma vez para ele criar o perfil e depois abra o gerador de novo."
memory_q = "Falta memória"
memory_a = "A geração precisa de cerca de 9 GB de RAM livre, e o EU5 pode ocupar quase 16 GB mesmo no menu principal. Feche o EU5 depois que o gerador abrir ou inicie o gerador sem o jogo: ele fica na pasta da Steam `steamapps/workshop/content/3450310/3829217331`."
blank_q = "A janela fica vazia ou é desenhada errado"
blank_a = "Abra {ui:settings_title}, escolha {ui:settings.classic_window} e reinicie o gerador. Se a janela nem abrir, inicie o programa com `--classic`."
classic_q = "Abriu uma janela mais simples"
classic_a = "É a janela clássica, e ela faz tudo o que a principal faz. Ela abre sozinha quando o sistema não tem WebView2 (Windows) ou WebKitGTK 4.1 (Linux), como na instalação comum do EU5 via Proton."
error_q = "A geração parou com um erro"
error_a = "Leia a mensagem: ela diz se o problema está nos arquivos do jogo, no destino, nas configurações ou no mapa. Algumas sementes e configurações não formam um mundo válido; {ui:retry_new_seed} tenta outra."
blocked_q = "O Windows ou um antivírus bloqueia o gerador"
blocked_a = "O gerador não tem assinatura digital, então o Smart App Control ou um antivírus podem reclamar. Ele não precisa de permissão de administrador. As [notas da versão](https://github.com/Sir-Starch/eu5-random-new-world/releases) trazem o resultado da análise de cada arquivo; se houver bloqueio, avise no GitHub."
picture_q = "O menu de mods ainda mostra a imagem antiga do mapa"
picture_a = "Feche o menu de mods pelo menu principal do EU5 e abra de novo. Se o próprio mundo mudou, reinicie o jogo por completo."
library_q = "Onde ficam meus mundos?"
library_a = "Numa biblioteca fora das pastas de mods, para que todas as cópias do gerador vejam os mesmos mundos. Windows: `%LOCALAPPDATA%\\RandomNewWorld`. Linux: `~/.local/share/random-new-world`. Proton: o caminho do Windows dentro do prefixo do Proton do EU5."
bug_q = "Encontrei um bug"
bug_a = "[Abra uma issue no GitHub](https://github.com/Sir-Starch/eu5-random-new-world/issues) com o código do seu mundo. {ui:diagnostics} em {ui:settings_title} junta os logs do gerador num arquivo para anexar; nada é enviado sozinho."

