[meta]
title = "Random New World · Guia do jogador"
description = "Crie seu próprio Novo Mundo para Europa Universalis V: quatro passos até a primeira campanha, tipos de mundo, configurações, compatibilidade e respostas para problemas comuns."
language = "Idioma"
contents = "Sumário"
skip = "Pular para o guia"
image_hero = "Um Novo Mundo gerado pelo RNW em Europa Universalis V, com a metade oeste ainda como Terra Incognita"

[nav]
start = "Primeiro mundo"
rules = "Antes de jogar"
types = "Tipos de mundo"
