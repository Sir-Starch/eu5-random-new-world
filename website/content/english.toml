cta = "Make your first world"
cta_help = "Something went wrong?"

[start]
title = "Your first world in four steps"
lead = "The default settings are enough for a first campaign. Everything else on this page can wait."
"1_title" = "Open the generator"
"1_text" = "In EU5, open {game:mods_dlcs}, find **Random New World (RNW)** and click {game:open_folder}. Launch **Random New World Generator** from that folder."
"1_note" = "Once the generator is open, you can close EU5 to free memory."
"2_title" = "Choose a world"
"2_text" = "Click {ui:new_world} and pick a {ui:type} on the {ui:new_tab.world} tab. {ui:type.continents} is a good first choice. Leave the rest as it is, or paste a friend's {ui:code}."
"3_title" = "Generate it"
"3_text" = "On {ui:new_tab.output}, keep {ui:destination.library} and tick {ui:install}. Click {ui:generate} and wait a few minutes."
"3_note" = "Generation needs about 8 GB of free RAM."
"4_title" = "Enable it and play"
"4_text" = "In {game:mods_dlcs}, tick your new world, for example **RNW: Small continents 7K3Q**, click {game:apply} and start a new 1337 campaign."
"4_note" = "Leave **Random New World (RNW)** itself unticked: it only holds the generator. Your world mod contains everything the campaign needs."
ready_title = "Just want to play?"
ready_text = "Subscribe to [RNW: The Wall CWYS](https://steamcommunity.com/sharedfiles/filedetails/?id=3832180151), a ready-made world. No generator needed."

[rules]
title = "Before you play"
lead = "A generated map is a mod like any other, with a few rules of its own."
"1_title" = "New campaigns only"
"1_text" = "A map cannot be added to a running campaign. Start a new game in 1337."
"2_title" = "One world at a time"
"2_text" = "Tick only the world you are playing. The generator item stays unticked."
"3_title" = "Restart to switch"
"3_text" = "Close EU5 completely before you play another world or replace a loaded one. Switching in one session can mix the maps and crash the game."
"4_title" = "Keep the mod with its saves"
"4_text" = "Keep each campaign's world mod and its EU5 version. A world code is a recipe, not a backup: another game or generator version can make a different world from it."

[types]
title = "World types"
lead = "A world type is a starting set of settings. Choose the shape you like, then adjust it on the {ui:new_tab.world} tab or in {ui:new_tab.advanced}."
wall_note = "With {ui:control.new_world.wall_allow_gaps} turned off, the Wall becomes one continuous barrier that ships can neither cross nor sail around."

[settings]
title = "Make it yours"
lead = "Every value still makes a playable world. These are the controls worth knowing; {ui:reset_all} undoes your changes."
seed_title = "{ui:seed} and {ui:code}"
seed_text = "The seed picks the world, and {ui:random} draws a new one. A world code holds the seed and every setting: copy it to share a world, paste one to make it. The same code makes the same world with the same generator release and game files."
sketch_title = "{ui:candidates}"
sketch_text = "Shows six land sketches before you build a whole world. Pick one to take its seed and settings. Sketches reveal the land, and the final coast can still shift a little."
draw_title = "Your own continent"
draw_text = "{ui:land_template} gives you an image of the area to fill. Paint land white and sea black, then load it with {ui:land_image}. Relief, rivers and peoples are generated on your outline."
ocean_title = "{ui:control.new_world.expand_oceans}"
ocean_text = "On by default: continents get room beyond the old outline of the Americas. Raise {ui:control.new_world.centre_permille} in {ui:new_tab.advanced} to move the land toward the middle of the ocean."
peoples_title = "Native societies"
peoples_text = "{ui:quick.states} on the {ui:new_tab.world} tab is the quick choice. In {ui:new_tab.advanced}, {ui:control.natives.state_share_permille} sets how much inhabited land states hold (3–60%), and {ui:control.natives.peasant_peak_permille} caps the share of peasants in a settled location (30–80%). Poor farmland stays more tribal."
resources_title = "Resources"
resources_text = "In {ui:new_tab.advanced}, each resource has its own frequency: 1× is the base game, 0 removes it. More of one leaves fewer locations for the others. Climate and terrain still decide where each one can appear."

[hidden]
title = "Keep the surprise"
lead = "New worlds start covered. Country selection shows Terra Incognita in place of the New World, and you can still pick a native country from the list."
covered = "Covered: the New World is Terra Incognita"
shown = "Shown: native countries of 1337"
reveal_text = "Uncovers the world's maps inside the generator. The game keeps its own setting."
show_text = "Uncovers the mod picture and the country-selection map in EU5. Set it on {ui:new_tab.output}, or later on the world's {ui:tab.world} tab without generating again; then close and reopen the mods menu."
atlas = "A revealed world opens ten maps under {ui:tab.maps}: land, countries, cultures, religions, resources and more. {ui:compare} sets two worlds side by side."

[library]
title = "Your worlds"
lead = "Everything you generate stays in the generator's library, with its code, maps and notes."
versions_title = "{ui:world_versions}"
versions_text = "Select a finished world. {ui:part.peoples.button} makes new countries, cultures and religions on the same land; {ui:part.resources.button} draws only the resources again. The earlier version stays in the library."
queue_title = "Several worlds in a row"
queue_text = "{ui:enqueue} keeps the current settings as a job, and {ui:run_queue} makes the worlds one after another. You can add more while one is generating."
share_title = "Share a world"
share_text = "Send the world code, or {ui:export_file} for a `.rnworld` file with its maps and notes. Your friend makes the playable mod from it with their own game."
move_title = "Move a world between your computers"
move_text = "{ui:send_built} saves the whole built mod as a `.rnworld-mod` file to carry to another of your computers. Both need the same game version."
clean_title = "Clean up"
clean_text = "{ui:library_remove} takes worlds out of the game and keeps their records. {ui:library_delete} deletes them for good."

[compat]
title = "Compatibility"
game = "Game version"
game_text = "EU5 {v:game}. New patches of the 1.4 branch usually work without a generator update; last fully verified on {v:verified}."
saves = "Saves"
saves_text = "New campaigns only. Updating the generator does not change existing worlds or their saves."
pillars = "Across the Pillars"
pillars_text = "Supported and optional. New World expeditions and treasure fleets use the generated map."
refined = "Refined Colonization"
refined_text = "Compatible. Load order: Refined Colonization first, then your world mod."
multiplayer = "Multiplayer"
multiplayer_text = "Supported and tested by the community. Every player needs the same game version, world mod and other mods."
ironman = "Ironman and achievements"
ironman_text = "Work under the standard game rules."
maps = "Map overhauls"
maps_text = "Mods that replace the Americas conflict with RNW. Other combinations are untested."
system = "System"
system_text = "Windows, or Linux and Steam Deck through Proton. macOS is not supported."

[help]
title = "If something goes wrong"
found_q = "The generator cannot find EU5"
found_a = "Open {ui:settings_title} and choose the missing folder. If you have never started EU5, launch it once so that it creates its profile, then reopen the generator."
memory_q = "Not enough memory"
memory_a = "Generation needs about 8 GB of free RAM, and EU5 can hold most of 16 GB even in its main menu. Close EU5 once the generator is open, or start the generator without the game: it lives in Steam's `steamapps/workshop/content/3450310/3829217331` folder."
blank_q = "The window is blank or draws badly"
blank_a = "Open {ui:settings_title}, select {ui:settings.classic_window} and start the generator again. If the window does not open at all, start the launcher with `--classic`."
classic_q = "A plainer window opened instead"
classic_a = "That is the classic window, and it does everything the main one does. It opens by itself when the system has no WebView2 on Windows or WebKitGTK 4.1 on Linux, as in EU5's usual Proton setup."
error_q = "Generation stopped with an error"
error_a = "Read the message: it says whether the trouble lies with game files, a destination, the settings or the map. Some seeds and settings cannot make a valid world; {ui:retry_new_seed} tries another."
blocked_q = "Windows or an antivirus blocks the generator"
blocked_a = "The generator is not code-signed, so Smart App Control or an antivirus may object. It needs no administrator rights. The [release notes](https://github.com/Sir-Starch/eu5-random-new-world/releases) list the scan results of every file; please report a block on GitHub."
picture_q = "The mods menu still shows the old map picture"
picture_a = "Close and reopen the mods menu from EU5's main menu. A changed world itself needs a full restart of the game."
library_q = "Where are my worlds kept?"
library_a = "In a library outside the mod folders, so every copy of the generator sees the same worlds. Windows: `%LOCALAPPDATA%\\RandomNewWorld`. Linux: `~/.local/share/random-new-world`. Proton: the Windows location inside EU5's Proton prefix."
bug_q = "I found a bug"
bug_a = "[Open an issue on GitHub](https://github.com/Sir-Starch/eu5-random-new-world/issues) with your world code. {ui:diagnostics} in {ui:settings_title} packs the generator's logs into one file to attach; nothing is sent anywhere by itself."

