# The player's guide at rnw.sirstarch.com, in English. Every other language
# translates these keys and records the fingerprint of this file (website/sitegen.py).
#
# Markup inside a text:
#   {ui:KEY}     a control of the generator, in the window's own words (rnw/gui/text.py)
#   {game:KEY}   a part of EU5's interface, in the game's own words (sitegen.py GAME_TERMS)
#   {v:KEY}      a release fact (sitegen.py RELEASE)
#   **text**     emphasis        `text`  a file, folder or command
#   [text](url)  a link

