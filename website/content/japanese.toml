source = "f462402450b2b2b9"

[meta]
title = "Random New World · プレイヤーガイド"
description = "Europa Universalis V のための自分だけの新世界を作りましょう。最初のキャンペーンまでの4ステップ、ワールドの種類、設定、互換性、よくある問題への答えをまとめています。"
language = "言語"
contents = "目次"
skip = "ガイドへ移動"
image_hero = "Europa Universalis V で RNW が生成した新世界。西半分はまだ Terra Incognita のまま"

[nav]
start = "最初のワールド"
rules = "遊ぶ前に"
types = "ワールドの種類"
settings = "設定"
hidden = "隠された地図"
library = "あなたのワールド"
compat = "互換性"
help = "困ったとき"
workshop = "ワークショップ"

[hero]
kicker = "プレイヤーガイド"
lead = "次のEU5キャンペーンでは、南北アメリカを新しい世界に置き換えましょう。未知の海へ西に漕ぎ出すもよし、先住民の国を率いるもよし。旧世界はバニラのままです。"
fact_generator = "生成ツール {v:version}"
fact_game = "EU5 {v:game}"
fact_languages = "11言語"
cta = "最初のワールドを作る"
cta_help = "うまくいかないときは"

[start]
title = "4ステップで最初のワールド"
lead = "最初のキャンペーンなら初期設定で十分です。このページのほかの内容は後回しで構いません。"
"1_title" = "生成ツールを開く"
"1_text" = "EU5で{game:mods_dlcs}を開き、**Random New World (RNW)** を探して{game:open_folder}を押します。そのフォルダにある **Random New World Generator** を起動します。"
"1_note" = "生成ツールが開いたら、メモリを空けるためにEU5を終了して構いません。"
"2_title" = "ワールドを選ぶ"
"2_text" = "{ui:new_world}を押し、{ui:new_tab.world}タブで{ui:type}を選びます。最初は{ui:type.continents}がおすすめです。ほかはそのままにするか、友人の{ui:code}を貼り付けます。"
"3_title" = "生成する"
"3_text" = "{ui:new_tab.output}タブで{ui:destination.library}を選んだまま、{ui:install}にチェックを入れます。{ui:generate}を押して数分待ちます。"
"3_note" = "生成には約8GBの空きRAMが必要です。"
"4_title" = "有効にして遊ぶ"
"4_text" = "{game:mods_dlcs}で新しいワールド（例：**RNW: Small continents 7K3Q**）にチェックを入れ、{game:apply}を押して1337年の新規キャンペーンを始めます。"
"4_note" = "**Random New World (RNW)** 自体にはチェックを入れないでください。中身は生成ツールだけです。キャンペーンに必要なものはすべてワールドModに入っています。"
ready_title = "すぐに遊びたいなら"
ready_text = "完成済みのワールド [RNW: The Wall CWYS](https://steamcommunity.com/sharedfiles/filedetails/?id=3832180151) をサブスクライブしてください。生成ツールは不要です。"

[rules]
title = "遊ぶ前に"
lead = "生成した地図もほかと同じMODの一つですが、守るべきルールがいくつかあります。"
"1_title" = "新規キャンペーン専用"
"1_text" = "進行中のキャンペーンに地図を追加することはできません。1337年から新しくゲームを始めてください。"
"2_title" = "ワールドは一度に1つ"
"2_text" = "遊ぶワールドだけにチェックを入れます。生成ツールの項目はチェックなしのままです。"
"3_title" = "切り替えは再起動で"
"3_text" = "別のワールドで遊ぶ前や、読み込み済みのワールドを差し替える前には、EU5を完全に終了してください。同じセッション内で切り替えると地図が混ざり、ゲームがクラッシュすることがあります。"
"4_title" = "Modはセーブと一緒に保管"
"4_text" = "キャンペーンごとにワールドModとEU5のバージョンを保管してください。ワールドコードはレシピであって、バックアップではありません。ゲームや生成ツールのバージョンが違えば、同じコードから別の世界ができることがあります。"

[types]
title = "ワールドの種類"
lead = "ワールドの種類とは、最初の設定一式のことです。好みの形を選んでから、{ui:new_tab.world}タブや{ui:new_tab.advanced}で調整します。"
wall_note = "{ui:control.new_world.wall_allow_gaps}をオフにすると、壁は途切れのない障壁になり、船は越えることも回り込むこともできません。"

[settings]
title = "自分好みに"
lead = "どの値でも遊べるワールドになります。知っておきたい設定は次のとおりです。{ui:reset_all}で変更を元に戻せます。"
seed_title = "{ui:seed}と{ui:code}"
seed_text = "シードがワールドを決め、{ui:random}で新しいシードを引きます。ワールドコードにはシードとすべての設定が入っています。ワールドを共有するときはコピーし、作るときは貼り付けます。生成ツールのバージョンとゲームファイルが同じなら、同じコードから同じワールドができます。"
sketch_title = "{ui:candidates}"
sketch_text = "ワールド全体を作る前に、陸地の下書きを6つ表示します。1つ選ぶと、そのシードと設定を使えます。下書きでは陸地の形が見えてしまい、最終的な海岸線は少しずれることがあります。"
draw_title = "自分で描く大陸"
draw_text = "{ui:land_template}で、描き込める範囲の画像が手に入ります。陸地を白、海を黒で塗り、{ui:land_image}で読み込みます。地形、川、民族はその輪郭の上に生成されます。"
ocean_title = "{ui:control.new_world.expand_oceans}"
ocean_text = "初期設定でオンです。大陸は南北アメリカの元の輪郭を越えて広がれます。{ui:new_tab.advanced}で{ui:control.new_world.centre_permille}を上げると、陸地が大洋の中ほどへ移ります。"
peoples_title = "先住民の社会"
peoples_text = "{ui:new_tab.world}タブの{ui:quick.states}で手早く選べます。{ui:new_tab.advanced}では、{ui:control.natives.state_share_permille}が人の住む土地のうち国家が持つ割合（3〜60%）を、{ui:control.natives.peasant_peak_permille}が定住地での農民の割合の上限（30〜80%）を決めます。痩せた土地では部族社会が多く残ります。"
resources_title = "資源"
resources_text = "{ui:new_tab.advanced}では資源ごとに出現頻度を設定できます。1×は基本ゲームと同じ、0はその資源をなくします。ある資源を増やすと、ほかの資源に回る場所は減ります。どこに何が出るかは、引き続き気候と地形が決めます。"

[hidden]
title = "驚きを取っておく"
lead = "新しいワールドは最初は隠されています。国の選択画面では新世界の代わりにTerra Incognitaが表示されますが、リストから先住民の国を選ぶことはできます。"
covered = "非表示：新世界はTerra Incognita"
shown = "表示：1337年の先住民の国々"
reveal_text = "生成ツールの中でワールドの地図を表示します。ゲーム側の設定は別です。"
show_text = "EU5のMod画像と国の選択画面の地図を表示します。{ui:new_tab.output}タブで設定するか、あとからワールドの{ui:tab.world}タブで、生成し直さずに変更できます。そのあとMODメニューを閉じて開き直してください。"
atlas = "表示したワールドでは、{ui:tab.maps}で陸地、国、文化、宗教、資源など10種類の地図を見られます。{ui:compare}で2つのワールドを並べられます。"

[library]
title = "あなたのワールド"
lead = "生成したものはすべて、コード・地図・メモとともに生成ツールのライブラリに残ります。"
versions_title = "{ui:world_versions}"
versions_text = "完成したワールドを選びます。{ui:part.peoples.button}は同じ陸地に新しい国・文化・宗教を作り、{ui:part.resources.button}は資源だけを配り直します。前のバージョンはライブラリに残ります。"
queue_title = "複数のワールドを続けて"
queue_text = "{ui:enqueue}で現在の設定をジョブとして保存し、{ui:run_queue}でワールドを1つずつ順に作ります。生成中でもジョブを追加できます。"
share_title = "ワールドを共有する"
share_text = "ワールドコードを送るか、{ui:export_file}で地図とメモ入りの`.rnworld`ファイルを作ります。友人は自分のゲームで、そこからプレイ可能なModを作ります。"
move_title = "別のPCにワールドを移す"
move_text = "{ui:send_built}は、作成済みのModを丸ごと`.rnworld-mod`ファイルに保存し、自分の別のPCへ持っていけるようにします。両方で同じゲームバージョンが必要です。"
clean_title = "整理する"
clean_text = "{ui:library_remove}はワールドをゲームから外し、記録は残します。{ui:library_delete}は完全に削除します。"

[compat]
title = "互換性"
game = "ゲームのバージョン"
game_text = "EU5 {v:game}。1.4系の新しいパッチは、たいてい生成ツールを更新しなくても動きます。最後に完全確認したバージョンは{v:verified}です。"
saves = "セーブ"
saves_text = "新規キャンペーン専用です。生成ツールを更新しても、既存のワールドやそのセーブは変わりません。"
pillars = "Across the Pillars"
pillars_text = "対応しており、必須ではありません。新世界への遠征と財宝船団は生成した地図を使います。"
refined = "Refined Colonization"
refined_text = "互換性があります。読み込み順：Refined Colonizationが先、ワールドModが後です。"
multiplayer = "マルチプレイ"
multiplayer_text = "対応しており、コミュニティで動作確認済みです。全員が同じゲームバージョン、同じワールドMod、同じほかのModを使う必要があります。"
ironman = "鉄人と実績"
ironman_text = "ゲームの通常のルールどおりに機能します。"
maps = "地図の大型改変Mod"
maps_text = "南北アメリカを置き換えるModはRNWと競合します。ほかの組み合わせは未検証です。"
system = "システム"
system_text = "Windows、またはProton経由のLinuxとSteam Deck。macOSには対応していません。"

[help]
title = "困ったとき"
found_q = "生成ツールがEU5を見つけられない"
found_a = "{ui:settings_title}を開き、見つからないフォルダを選んでください。EU5を一度も起動したことがない場合は、一度起動してプロフィールを作らせてから、生成ツールを開き直してください。"
memory_q = "メモリが足りない"
memory_a = "生成には約8GBの空きRAMが必要ですが、EU5はメインメニューでも16GBの大半を使うことがあります。生成ツールが開いたらEU5を終了するか、ゲームを起動せずに生成ツールを起動してください。場所はSteamの`steamapps/workshop/content/3450310/3829217331`フォルダです。"
blank_q = "ウィンドウが空白、または正しく描画されない"
blank_a = "{ui:settings_title}を開いて{ui:settings.classic_window}を選び、生成ツールを再起動してください。ウィンドウがまったく開かない場合は、`--classic`を付けて起動します。"
classic_q = "代わりに簡素なウィンドウが開いた"
classic_a = "それはクラシックウィンドウで、メインのウィンドウと同じことがすべてできます。WebView2（Windows）やWebKitGTK 4.1（Linux）がないシステム、たとえば通常のProton環境のEU5では自動的に開きます。"
error_q = "生成がエラーで止まった"
error_a = "メッセージを読んでください。原因がゲームファイル、保存先、設定、地図のどれにあるかが書かれています。シードと設定によっては正しいワールドを作れないことがあります。{ui:retry_new_seed}で別のシードを試せます。"
blocked_q = "Windowsやウイルス対策ソフトが生成ツールをブロックする"
blocked_a = "生成ツールにはデジタル署名がないため、Smart App Controlやウイルス対策ソフトが警告することがあります。管理者権限は不要です。[リリースノート](https://github.com/Sir-Starch/eu5-random-new-world/releases)に各ファイルのスキャン結果を載せています。ブロックされた場合はGitHubでお知らせください。"
picture_q = "MODメニューに古い地図の画像が表示される"
picture_a = "EU5のメインメニューからMODメニューを閉じ、もう一度開いてください。ワールドそのものを変えた場合は、ゲームを完全に再起動してください。"
library_q = "ワールドはどこに保存されている？"
library_a = "Modフォルダとは別のライブラリです。そのため、どの生成ツールのコピーからも同じワールドが見えます。Windows：`%LOCALAPPDATA%\\RandomNewWorld`。Linux：`~/.local/share/random-new-world`。Proton：EU5のProtonプレフィックス内にあるWindowsの場所です。"
bug_q = "バグを見つけた"
bug_a = "ワールドコードを添えて[GitHubでissueを作成](https://github.com/Sir-Starch/eu5-random-new-world/issues)してください。{ui:settings_title}の{ui:diagnostics}で、生成ツールのログを添付用の1ファイルにまとめられます。勝手にどこかへ送信されることはありません。"

