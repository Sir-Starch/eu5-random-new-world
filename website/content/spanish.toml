[meta]
title = "Random New World · Guía del jugador"
description = "Crea tu propio Nuevo Mundo para Europa Universalis V: cuatro pasos hasta la primera campaña, tipos de mundo, ajustes, compatibilidad y respuestas a los problemas más comunes."
language = "Idioma"
contents = "Contenido"
skip = "Ir a la guía"
image_hero = "Un Nuevo Mundo generado por RNW en Europa Universalis V, con su mitad oeste aún como Terra Incognita"

[nav]
start = "Primer mundo"
rules = "Antes de jugar"
types = "Tipos de mundo"
settings = "Ajustes"
hidden = "Mapa oculto"
library = "Tus mundos"
compat = "Compatibilidad"
help = "Problemas"
workshop = "Workshop"

[hero]
kicker = "Guía del jugador"
lead = "Sustituye las Américas por un mundo nuevo para tu próxima campaña de EU5. Navega hacia el oeste por aguas desconocidas o dirige uno de sus países nativos. El Viejo Mundo queda intacto."
fact_generator = "Generador {v:version}"
fact_game = "EU5 {v:game}"
fact_languages = "11 idiomas"
cta = "Crea tu primer mundo"
cta_help = "¿Algo ha fallado?"

[start]
title = "Tu primer mundo en cuatro pasos"
lead = "Para una primera campaña bastan los ajustes predeterminados. Todo lo demás de esta página puede esperar."
"1_title" = "Abre el generador"
"1_text" = "En EU5, abre {game:mods_dlcs}, busca **Random New World (RNW)** y pulsa {game:open_folder}. En esa carpeta, ejecuta **Random New World Generator**."
"1_note" = "Cuando el generador esté abierto, puedes cerrar EU5 para liberar memoria."
"2_title" = "Elige un mundo"
"2_text" = "Pulsa {ui:new_world} y, en la pestaña {ui:new_tab.world}, elige un {ui:type}. {ui:type.continents} es una buena primera opción. Deja lo demás como está o pega el {ui:code} de un amigo."
"3_title" = "Genéralo"
"3_text" = "En la pestaña {ui:new_tab.output}, deja marcado {ui:destination.library} y marca {ui:install}. Pulsa {ui:generate} y espera unos minutos."
"3_note" = "La generación necesita unos 9 GB de RAM libre."
"4_title" = "Actívalo y juega"
"4_text" = "En {game:mods_dlcs}, marca tu nuevo mundo, por ejemplo **RNW: Small continents 7K3Q**, pulsa {game:apply} e inicia una nueva campaña en 1337."
"4_note" = "Deja **Random New World (RNW)** sin marcar: solo contiene el generador. Tu mod de mundo incluye todo lo que necesita la campaña."
ready_title = "¿Solo quieres jugar?"
ready_text = "Suscríbete a [RNW: The Wall CWYS](https://steamcommunity.com/sharedfiles/filedetails/?id=3832180151), un mundo ya hecho. No necesitas el generador."

[rules]
title = "Antes de jugar"
lead = "Un mapa generado es un mod como cualquier otro, con algunas reglas propias."
"1_title" = "Solo campañas nuevas"
"1_text" = "Un mapa no se puede añadir a una campaña en curso. Empieza una partida nueva en 1337."
"2_title" = "Un mundo cada vez"
"2_text" = "Marca solo el mundo al que juegas. El elemento del generador queda sin marcar."
"3_title" = "Reinicia para cambiar"
"3_text" = "Cierra EU5 del todo antes de jugar otro mundo o de sustituir uno ya cargado. Cambiar en la misma sesión puede mezclar los mapas y colgar el juego."
"4_title" = "El mod va con sus partidas"
"4_text" = "Conserva el mod de mundo de cada campaña y su versión de EU5. Un código de mundo es una receta, no una copia de seguridad: otra versión del juego o del generador puede crear con él un mundo distinto."

[types]
title = "Tipos de mundo"
lead = "Un tipo de mundo es un conjunto de ajustes iniciales. Elige la forma que te guste y luego ajústala en la pestaña {ui:new_tab.world} o en {ui:new_tab.advanced}."
wall_note = "Si desmarcas {ui:control.new_world.wall_allow_gaps}, el Muro se convierte en una barrera continua que los barcos no pueden cruzar ni rodear."

[settings]
title = "A tu manera"
lead = "Cualquier valor sigue dando un mundo jugable. Estos son los ajustes que conviene conocer; {ui:reset_all} deshace tus cambios."
seed_title = "{ui:seed} y {ui:code}"
seed_text = "La semilla decide el mundo, y {ui:random} saca una nueva. Un código de mundo guarda la semilla y todos los ajustes: cópialo para compartir un mundo o pega uno para crearlo. El mismo código da el mismo mundo con la misma versión del generador y los mismos archivos del juego."
sketch_title = "{ui:candidates}"
sketch_text = "Muestra seis bocetos de tierra antes de construir un mundo entero. Elige uno para quedarte con su semilla y sus ajustes. Los bocetos revelan la tierra, y la costa final aún puede moverse un poco."
draw_title = "Tu propio continente"
draw_text = "{ui:land_template} te da una imagen de la zona que puedes rellenar. Pinta la tierra de blanco y el mar de negro, y cárgala con {ui:land_image}. El relieve, los ríos y los pueblos se generan sobre tu contorno."
ocean_title = "{ui:control.new_world.expand_oceans}"
ocean_text = "Activado por defecto: los continentes tienen sitio más allá del antiguo contorno de las Américas. Sube {ui:control.new_world.centre_permille} en {ui:new_tab.advanced} para llevar la tierra hacia el centro del océano."
peoples_title = "Sociedades nativas"
peoples_text = "{ui:quick.states} en la pestaña {ui:new_tab.world} es la opción rápida. En {ui:new_tab.advanced}, {ui:control.natives.state_share_permille} fija cuánta tierra habitada tienen los estados (3–60 %), y {ui:control.natives.peasant_peak_permille} limita la proporción de campesinos en una localización sedentaria (30–80 %). Las tierras pobres siguen siendo más tribales."
resources_title = "Recursos"
resources_text = "En {ui:new_tab.advanced}, cada recurso tiene su propia frecuencia: 1× es el juego base y 0 lo elimina. Más de uno deja menos localizaciones para los demás. El clima y el terreno siguen decidiendo dónde puede aparecer cada uno."

[hidden]
title = "Conserva la sorpresa"
lead = "Los mundos nuevos empiezan ocultos. La selección de país muestra Terra Incognita en lugar del Nuevo Mundo, y aun así puedes elegir un país nativo de la lista."
covered = "Oculto: el Nuevo Mundo es Terra Incognita"
shown = "Visible: los países nativos de 1337"
reveal_text = "Muestra los mapas del mundo dentro del generador. El juego mantiene su propio ajuste."
show_text = "Muestra la imagen del mod y el mapa de selección de país en EU5. Actívalo en la pestaña {ui:new_tab.output} o más tarde en la pestaña {ui:tab.world} del mundo, sin volver a generarlo; después cierra y vuelve a abrir el menú de mods."
atlas = "Un mundo visible abre diez mapas en {ui:tab.maps}: tierra, países, culturas, religiones, recursos y más. {ui:compare} pone dos mundos lado a lado."

[library]
title = "Tus mundos"
lead = "Todo lo que generas queda en la biblioteca del generador, con su código, sus mapas y sus notas."
versions_title = "{ui:world_versions}"
versions_text = "Selecciona un mundo terminado. {ui:part.peoples.button} crea países, culturas y religiones nuevos sobre la misma tierra; {ui:part.resources.button} solo vuelve a repartir los recursos. La versión anterior se queda en la biblioteca."
queue_title = "Varios mundos seguidos"
queue_text = "{ui:enqueue} guarda los ajustes actuales como una tarea, y {ui:run_queue} crea los mundos uno tras otro. Puedes añadir más mientras se genera uno."
share_title = "Comparte un mundo"
share_text = "Envía el código del mundo o usa {ui:export_file} para obtener un archivo `.rnworld` con sus mapas y notas. Tu amigo crea con él el mod jugable en su propio juego."
move_title = "Lleva un mundo a otro ordenador"
move_text = "{ui:send_built} guarda el mod construido completo en un archivo `.rnworld-mod` para llevarlo a otro de tus ordenadores. Ambos necesitan la misma versión del juego."
clean_title = "Limpieza"
clean_text = "{ui:library_remove} saca los mundos del juego y conserva sus registros. {ui:library_delete} los elimina para siempre."

[compat]
title = "Compatibilidad"
game = "Versión del juego"
game_text = "EU5 {v:game}. Los nuevos parches de la rama 1.4 suelen funcionar sin actualizar el generador; última verificación completa en {v:verified}."
saves = "Partidas guardadas"
saves_text = "Solo campañas nuevas. Actualizar el generador no cambia los mundos existentes ni sus partidas."
pillars = "Across the Pillars"
pillars_text = "Compatible y opcional. Las expediciones al Nuevo Mundo y las flotas del tesoro usan el mapa generado."
refined = "Refined Colonization"
refined_text = "Compatible. Orden de carga: primero Refined Colonization y después tu mod de mundo."
multiplayer = "Multijugador"
multiplayer_text = "Compatible y probado por la comunidad. Todos los jugadores necesitan la misma versión del juego, el mismo mod de mundo y los mismos mods adicionales."
ironman = "Ironman y logros"
ironman_text = "Funcionan con las reglas normales del juego."
maps = "Revisiones del mapa"
maps_text = "Los mods que sustituyen las Américas entran en conflicto con RNW. Las demás combinaciones no se han probado."
system = "Sistema"
system_text = "Windows, o Linux y Steam Deck mediante Proton. macOS no es compatible."

[help]
title = "Si algo falla"
found_q = "El generador no encuentra EU5"
found_a = "Abre {ui:settings_title} y elige la carpeta que falta. Si nunca has iniciado EU5, ábrelo una vez para que cree su perfil y vuelve a abrir el generador."
memory_q = "No hay memoria suficiente"
memory_a = "La generación necesita unos 9 GB de RAM libre, y EU5 puede ocupar casi 16 GB incluso en el menú principal. Cierra EU5 cuando el generador esté abierto o inicia el generador sin el juego: está en la carpeta de Steam `steamapps/workshop/content/3450310/3829217331`."
blank_q = "La ventana sale vacía o se dibuja mal"
blank_a = "Abre {ui:settings_title}, elige {ui:settings.classic_window} y vuelve a iniciar el generador. Si la ventana no llega a abrirse, inicia el programa con `--classic`."
classic_q = "Se ha abierto una ventana más sencilla"
classic_a = "Es la ventana clásica, y hace todo lo que hace la principal. Se abre sola cuando el sistema no tiene WebView2 (Windows) o WebKitGTK 4.1 (Linux), como en la instalación habitual de EU5 con Proton."
error_q = "La generación se detuvo con un error"
error_a = "Lee el mensaje: indica si el problema está en los archivos del juego, el destino, los ajustes o el mapa. Algunas semillas y ajustes no pueden dar un mundo válido; {ui:retry_new_seed} prueba con otra."
blocked_q = "Windows o un antivirus bloquea el generador"
blocked_a = "El generador no tiene firma digital, así que Smart App Control o un antivirus pueden ponerle pegas. No necesita permisos de administrador. Las [notas de la versión](https://github.com/Sir-Starch/eu5-random-new-world/releases) recogen los resultados del análisis de cada archivo; si te lo bloquea, avisa en GitHub."
picture_q = "El menú de mods sigue mostrando la imagen antigua del mapa"
picture_a = "Cierra el menú de mods desde el menú principal de EU5 y vuelve a abrirlo. Si ha cambiado el propio mundo, reinicia el juego por completo."
library_q = "¿Dónde se guardan mis mundos?"
library_a = "En una biblioteca fuera de las carpetas de mods, para que todas las copias del generador vean los mismos mundos. Windows: `%LOCALAPPDATA%\\RandomNewWorld`. Linux: `~/.local/share/random-new-world`. Proton: la ruta de Windows dentro del prefijo de Proton de EU5."
bug_q = "He encontrado un error"
bug_a = "[Abre una incidencia en GitHub](https://github.com/Sir-Starch/eu5-random-new-world/issues) con tu código de mundo. {ui:diagnostics} en {ui:settings_title} reúne los registros del generador en un archivo para adjuntarlo; no se envía nada por sí solo."

