source = "bc1247e7baf206f8"

[meta]
title = "Random New World · Poradnik gracza"
description = "Stwórz własny Nowy Świat do Europa Universalis V: cztery kroki do pierwszej kampanii, rodzaje świata, ustawienia, zgodność i odpowiedzi na częste problemy."
language = "Język"
contents = "Spis treści"
skip = "Przejdź do poradnika"
image_hero = "Nowy Świat wygenerowany przez RNW w Europa Universalis V; jego zachodnia część to wciąż Terra Incognita"

[nav]
start = "Pierwszy świat"
rules = "Przed grą"
types = "Rodzaje świata"
settings = "Ustawienia"
hidden = "Ukryta mapa"
library = "Twoje światy"
compat = "Zgodność"
help = "Problemy"
workshop = "Warsztat"

[hero]
kicker = "Poradnik gracza"
lead = "Zastąp obie Ameryki nowym światem w następnej kampanii EU5. Popłyń na zachód, na nieznane wody, albo poprowadź jeden z tubylczych krajów. Stary Świat pozostaje nietknięty."
fact_generator = "Generator {v:version}"
fact_game = "EU5 {v:game}"
fact_languages = "11 języków"
cta = "Stwórz pierwszy świat"
cta_help = "Coś poszło nie tak?"

[start]
title = "Pierwszy świat w czterech krokach"
lead = "Do pierwszej kampanii wystarczą ustawienia domyślne. Cała reszta tej strony może poczekać."
"1_title" = "Otwórz generator"
"1_text" = "W EU5 otwórz menu {game:mods_dlcs}, znajdź **Random New World (RNW)** i kliknij {game:open_folder}. W tym folderze uruchom **Random New World Generator**."
"1_note" = "Gdy generator się otworzy, możesz zamknąć EU5, żeby zwolnić pamięć."
"2_title" = "Wybierz świat"
"2_text" = "Kliknij {ui:new_world} i na karcie {ui:new_tab.world} ustaw pole {ui:type}; na początek dobrze sprawdzą się {ui:type.continents}. Resztę zostaw bez zmian albo wklej w pole {ui:code} kod od znajomego."
"3_title" = "Wygeneruj go"
"3_text" = "Na karcie {ui:new_tab.output} zostaw opcję {ui:destination.library} i zaznacz {ui:install}. Kliknij {ui:generate} i poczekaj kilka minut."
"3_note" = "Generowanie wymaga około 7,5 GB wolnej pamięci RAM."
"4_title" = "Włącz go i graj"
"4_text" = "W menu {game:mods_dlcs} zaznacz nowy świat, np. **RNW: Small continents 7K3Q**, kliknij {game:apply} i rozpocznij nową kampanię w 1337 roku."
"4_note" = "Samego moda **Random New World (RNW)** nie zaznaczaj: zawiera tylko generator. Mod świata ma wszystko, czego potrzebuje kampania."
ready_title = "Chcesz po prostu grać?"
ready_text = "Zasubskrybuj gotowy świat [RNW: The Wall CWYS](https://steamcommunity.com/sharedfiles/filedetails/?id=3832180151). Generator nie jest potrzebny."

[rules]
title = "Przed grą"
lead = "Wygenerowana mapa to mod jak każdy inny, ale z kilkoma własnymi zasadami."
"1_title" = "Tylko nowe kampanie"
"1_text" = "Mapy nie da się dodać do trwającej kampanii. Zacznij nową grę w 1337 roku."
"2_title" = "Jeden świat naraz"
"2_text" = "Zaznacz tylko świat, w który grasz. Pozycja generatora zostaje odznaczona."
"3_title" = "Zmiana tylko po restarcie"
"3_text" = "Zamknij EU5 całkowicie, zanim zagrasz w inny świat albo podmienisz już wczytany. Zmiana w jednej sesji może pomieszać mapy i wywołać awarię gry."
"4_title" = "Mod trzymaj razem z zapisami"
"4_text" = "Zachowaj mod świata każdej kampanii i jej wersję EU5. Kod świata to przepis, nie kopia zapasowa: inna wersja gry lub generatora może stworzyć z niego inny świat."

[types]
title = "Rodzaje świata"
lead = "Rodzaj świata to zestaw ustawień początkowych. Wybierz kształt, który ci odpowiada, a potem dopasuj go na karcie {ui:new_tab.world} lub {ui:new_tab.advanced}."
wall_note = "Gdy odznaczysz opcję {ui:control.new_world.wall_allow_gaps}, Mur stanie się ciągłą barierą, której statki nie przepłyną ani nie opłyną."

[settings]
title = "Po swojemu"
lead = "Każda wartość nadal daje grywalny świat. Oto ustawienia, które warto znać; przycisk {ui:reset_all} cofa twoje zmiany."
seed_title = "{ui:seed} i {ui:code}"
seed_text = "Ziarno wyznacza świat, a przycisk {ui:random} losuje nowe. Kod świata zawiera ziarno i wszystkie ustawienia: skopiuj go, by podzielić się światem, albo wklej czyjś, by go stworzyć. Ten sam kod daje ten sam świat przy tej samej wersji generatora i tych samych plikach gry."
sketch_title = "{ui:candidates}"
sketch_text = "Pokazuje sześć szkiców lądu, zanim powstanie cały świat. Wybierz jeden, by przejąć jego ziarno i ustawienia. Szkice odsłaniają ląd, a ostateczne wybrzeże może się jeszcze nieco przesunąć."
draw_title = "Własny kontynent"
draw_text = "Przycisk {ui:land_template} daje obraz obszaru do wypełnienia. Pomaluj ląd na biało, a morze na czarno, i wczytaj obraz przyciskiem {ui:land_image}. Rzeźba terenu, rzeki i ludy powstaną na twoim konturze."
ocean_title = "{ui:control.new_world.expand_oceans}"
ocean_text = "Domyślnie włączone: kontynenty mają miejsce poza dawnym zarysem obu Ameryk. Zwiększ wartość {ui:control.new_world.centre_permille} na karcie {ui:new_tab.advanced}, by przesunąć ląd ku środkowi oceanu."
peoples_title = "Społeczności tubylcze"
peoples_text = "Szybki wybór to {ui:quick.states} na karcie {ui:new_tab.world}. Na karcie {ui:new_tab.advanced} suwak {ui:control.natives.state_share_permille} określa, ile zamieszkanej ziemi należy do państw (3–60%), a {ui:control.natives.peasant_peak_permille} ogranicza udział chłopów w osiadłej lokacji (30–80%). Na ubogiej ziemi życie pozostaje bardziej plemienne."
resources_title = "Zasoby"
resources_text = "Na karcie {ui:new_tab.advanced} każdy zasób ma własną częstość: 1× to gra podstawowa, 0 go usuwa. Więcej jednego zostawia mniej lokacji dla pozostałych. O tym, gdzie który może się pojawić, nadal decydują klimat i teren."

[hidden]
title = "Zachowaj niespodziankę"
lead = "Nowe światy są na początku zakryte. Wybór kraju pokazuje Terra Incognita zamiast Nowego Świata, a mimo to możesz wybrać z listy tubylczy kraj."
covered = "Zakryty: Nowy Świat to Terra Incognita"
shown = "Odkryty: tubylcze kraje roku 1337"
reveal_text = "Odsłania mapy świata w generatorze. Gra zachowuje własne ustawienie."
show_text = "Odsłania obraz moda i mapę wyboru kraju w EU5. Ustaw to na karcie {ui:new_tab.output} albo później na karcie {ui:tab.world} gotowego świata, bez ponownego generowania; potem zamknij i ponownie otwórz menu modów."
atlas = "Odkryty świat ma na karcie {ui:tab.maps} dziesięć map: ląd, kraje, kultury, religie, zasoby i inne. Przycisk {ui:compare} stawia dwa światy obok siebie."

[library]
title = "Twoje światy"
lead = "Wszystko, co wygenerujesz, zostaje w bibliotece generatora razem z kodem, mapami i notatkami."
versions_title = "{ui:world_versions}"
versions_text = "Wybierz gotowy świat. Przycisk {ui:part.peoples.button} tworzy nowe kraje, kultury i religie na tym samym lądzie; {ui:part.resources.button} losuje od nowa tylko zasoby. Poprzednia wersja zostaje w bibliotece."
queue_title = "Kilka światów po kolei"
queue_text = "Przycisk {ui:enqueue} zapisuje bieżące ustawienia jako zadanie, a {ui:run_queue} tworzy światy jeden po drugim. Możesz dodawać kolejne, gdy jeden się generuje."
share_title = "Podziel się światem"
share_text = "Wyślij kod świata albo użyj przycisku {ui:export_file}, by dostać plik `.rnworld` z mapami i notatkami. Znajomy stworzy z niego grywalny mod na swojej kopii gry."
move_title = "Przenieś świat na inny komputer"
move_text = "Przycisk {ui:send_built} zapisuje cały gotowy mod w pliku `.rnworld-mod`, który przeniesiesz na inny swój komputer. Na obu potrzebna jest ta sama wersja gry."
clean_title = "Porządki"
clean_text = "Przycisk {ui:library_remove} usuwa światy z gry, ale zachowuje ich wpisy. Przycisk {ui:library_delete} kasuje je na dobre."

[compat]
title = "Zgodność"
game = "Wersja gry"
game_text = "EU5 {v:game}. Nowe łatki gałęzi 1.4 zwykle działają bez aktualizacji generatora; ostatnio w pełni sprawdzono na {v:verified}."
saves = "Zapisy"
saves_text = "Tylko nowe kampanie. Aktualizacja generatora nie zmienia istniejących światów ani ich zapisów."
pillars = "Across the Pillars"
pillars_text = "Obsługiwane i opcjonalne. Wyprawy do Nowego Świata i floty skarbów korzystają z wygenerowanej mapy."
refined = "Refined Colonization"
refined_text = "Zgodny. Kolejność wczytywania: najpierw Refined Colonization, potem mod twojego świata."
multiplayer = "Multiplayer"
multiplayer_text = "Obsługiwany i przetestowany przez społeczność. Każdy gracz potrzebuje tej samej wersji gry, tego samego moda świata i tych samych pozostałych modów."
ironman = "Ironman i osiągnięcia"
ironman_text = "Działają na zwykłych zasadach gry."
maps = "Przeróbki mapy"
maps_text = "Mody zastępujące obie Ameryki są niezgodne z RNW. Inne połączenia nie były testowane."
system = "System"
system_text = "Windows albo Linux i Steam Deck przez Proton. macOS nie jest obsługiwany."

[help]
title = "Gdy coś pójdzie nie tak"
found_q = "Generator nie znajduje EU5"
found_a = "Otwórz {ui:settings_title} i wskaż brakujący folder. Jeśli gra nie była jeszcze nigdy uruchamiana, uruchom ją raz, by utworzyła profil, a potem ponownie otwórz generator."
memory_q = "Brakuje pamięci"
memory_a = "Generowanie wymaga około 7,5 GB wolnej pamięci RAM, a EU5 potrafi zająć prawie 16 GB już w menu głównym. Zamknij EU5, gdy generator się otworzy, albo uruchamiaj generator bez gry: znajduje się w folderze Steam `steamapps/workshop/content/3450310/3829217331`."
blank_q = "Okno jest puste lub źle się rysuje"
blank_a = "Otwórz {ui:settings_title}, zaznacz {ui:settings.classic_window} i uruchom generator ponownie. Jeśli okno w ogóle się nie otwiera, uruchom program z opcją `--classic`."
classic_q = "Otworzyło się prostsze okno"
classic_a = "To okno klasyczne i potrafi wszystko to, co główne. Otwiera się samo, gdy w systemie nie ma WebView2 (Windows) ani WebKitGTK 4.1 (Linux), jak w zwykłej instalacji EU5 przez Proton."
error_q = "Generowanie przerwał błąd"
error_a = "Przeczytaj komunikat: mówi, czy kłopot dotyczy plików gry, miejsca docelowego, ustawień czy mapy. Z niektórych ziaren i ustawień nie da się zbudować poprawnego świata; przycisk {ui:retry_new_seed} spróbuje innego."
blocked_q = "Windows lub antywirus blokuje generator"
blocked_a = "Generator nie ma podpisu cyfrowego, więc Smart App Control lub antywirus mogą zgłaszać zastrzeżenia. Nie potrzebuje uprawnień administratora. W [informacjach o wydaniu](https://github.com/Sir-Starch/eu5-random-new-world/releases) są wyniki skanowania każdego pliku; blokadę zgłoś, proszę, na GitHubie."
picture_q = "Menu modów wciąż pokazuje stary obraz mapy"
picture_a = "Zamknij menu modów z poziomu menu głównego EU5 i otwórz je ponownie. Jeśli zmienił się sam świat, uruchom grę od nowa."
library_q = "Gdzie są moje światy?"
library_a = "W bibliotece poza folderami modów, dzięki czemu każda kopia generatora widzi te same światy. Windows: `%LOCALAPPDATA%\\RandomNewWorld`. Linux: `~/.local/share/random-new-world`. Proton: ścieżka Windows wewnątrz prefiksu Protona dla EU5."
bug_q = "Trafił się błąd"
bug_a = "[Zgłoś go na GitHubie](https://github.com/Sir-Starch/eu5-random-new-world/issues) i podaj kod świata. Przycisk {ui:diagnostics} w oknie {ui:settings_title} pakuje dzienniki generatora do jednego pliku, który możesz dołączyć; nic nie jest wysyłane samo."

