[meta]
title = "Random New World · Spielerhandbuch"
description = "Erschaffe deine eigene Neue Welt für Europa Universalis V: vier Schritte zur ersten Kampagne, Weltarten, Einstellungen, Kompatibilität und Hilfe bei häufigen Problemen."
language = "Sprache"
contents = "Inhalt"
skip = "Zum Handbuch springen"
image_hero = "Eine von RNW erzeugte Neue Welt in Europa Universalis V, ihr Westen noch Terra Incognita"

