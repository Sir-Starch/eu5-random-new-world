[hero]
kicker = "Spielerhandbuch"
lead = "Ersetze die Amerikas durch eine neue Welt für deine nächste EU5-Kampagne. Segle nach Westen in unbekannte Gewässer oder führe eines ihrer einheimischen Länder. Die Alte Welt bleibt unverändert."
fact_generator = "Generator {v:version}"
fact_game = "EU5 {v:game}"
fact_languages = "11 Sprachen"
cta = "Erste Welt erschaffen"
cta_help = "Etwas läuft schief?"

[start]
title = "Deine erste Welt in vier Schritten"
lead = "Für die erste Kampagne reichen die Standardeinstellungen. Alles andere auf dieser Seite hat Zeit."
"1_title" = "Öffne den Generator"
"1_text" = "Öffne in EU5 das Menü {game:mods_dlcs}, suche **Random New World (RNW)** und klicke auf {game:open_folder}. Starte in diesem Ordner **Random New World Generator**."
"1_note" = "Sobald der Generator offen ist, kannst du EU5 schließen, um Speicher freizugeben."
"2_title" = "Wähle eine Welt"
"2_text" = "Klicke auf {ui:new_world} und wähle auf dem Reiter {ui:new_tab.world} eine {ui:type}. {ui:type.continents} sind für den Anfang eine gute Wahl. Lass den Rest, wie er ist, oder füge den {ui:code} eines Freundes ein."
"3_title" = "Erzeuge sie"
"3_text" = "Lass auf dem Reiter {ui:new_tab.output} die Option {ui:destination.library} gewählt und setze das Häkchen bei {ui:install}. Klicke auf {ui:generate} und warte ein paar Minuten."
"3_note" = "Die Erzeugung braucht etwa 8 GB freien Arbeitsspeicher."
"4_title" = "Aktivieren und spielen"
"4_text" = "Hake im Menü {game:mods_dlcs} deine neue Welt an, etwa **RNW: Small continents 7K3Q**, klicke auf {game:apply} und beginne eine neue Kampagne im Jahr 1337."
"4_note" = "Lass **Random New World (RNW)** selbst deaktiviert: Diese Mod enthält nur den Generator. Deine Welt-Mod bringt alles mit, was die Kampagne braucht."
ready_title = "Einfach nur spielen?"
ready_text = "Abonniere [RNW: The Wall CWYS](https://steamcommunity.com/sharedfiles/filedetails/?id=3832180151), eine fertige Welt. Kein Generator nötig."

[rules]
title = "Vor dem Spiel"
lead = "Eine erzeugte Karte ist eine Mod wie jede andere, mit ein paar eigenen Regeln."
"1_title" = "Nur neue Kampagnen"
"1_text" = "Eine Karte lässt sich nicht in eine laufende Kampagne einfügen. Beginne ein neues Spiel im Jahr 1337."
"2_title" = "Eine Welt auf einmal"
"2_text" = "Aktiviere nur die Welt, die du spielst. Der Eintrag des Generators bleibt deaktiviert."
"3_title" = "Neustart beim Wechsel"
"3_text" = "Schließe EU5 vollständig, bevor du eine andere Welt spielst oder eine geladene ersetzt. Ein Wechsel in derselben Sitzung kann die Karten vermischen und das Spiel abstürzen lassen."
"4_title" = "Mod und Spielstände gehören zusammen"
"4_text" = "Bewahre für jede Kampagne ihre Welt-Mod und ihre EU5-Version auf. Ein Weltcode ist ein Rezept, keine Sicherung: Eine andere Spiel- oder Generatorversion kann daraus eine andere Welt machen."

[types]
title = "Weltarten"
lead = "Eine Weltart ist ein Satz Starteinstellungen. Wähle die Form, die dir gefällt, und passe sie auf dem Reiter {ui:new_tab.world} oder unter {ui:new_tab.advanced} an."
wall_note = "Ohne {ui:control.new_world.wall_allow_gaps} wird die Mauer zu einer durchgehenden Barriere, die Schiffe weder durchqueren noch umsegeln können."

[settings]
title = "Nach deinem Geschmack"
lead = "Jeder Wert ergibt eine spielbare Welt. Diese Regler solltest du kennen; {ui:reset_all} macht deine Änderungen rückgängig."
seed_title = "{ui:seed} und {ui:code}"
seed_text = "Der Startwert bestimmt die Welt, {ui:random} würfelt einen neuen. Ein Weltcode enthält den Startwert und alle Einstellungen: Kopiere ihn, um eine Welt zu teilen, oder füge einen ein, um sie zu erzeugen. Derselbe Code ergibt dieselbe Welt mit derselben Generatorversion und denselben Spieldateien."
sketch_title = "{ui:candidates}"
sketch_text = "Zeigt sechs Landskizzen, bevor eine ganze Welt entsteht. Wähle eine, um ihren Startwert und ihre Einstellungen zu übernehmen. Die Skizzen verraten das Land, und die endgültige Küste kann sich noch leicht verschieben."
draw_title = "Dein eigener Kontinent"
draw_text = "{ui:land_template} liefert ein Bild des Bereichs, den du füllen kannst. Male Land weiß und Meer schwarz und lade das Bild mit {ui:land_image}. Relief, Flüsse und Völker entstehen auf deinem Umriss."
ocean_title = "{ui:control.new_world.expand_oceans}"
ocean_text = "Standardmäßig an: Die Kontinente bekommen Platz über den alten Umriss der Amerikas hinaus. Erhöhe {ui:control.new_world.centre_permille} unter {ui:new_tab.advanced}, um das Land zur Mitte des Ozeans zu rücken."
peoples_title = "Einheimische Gesellschaften"
peoples_text = "{ui:quick.states} auf dem Reiter {ui:new_tab.world} ist die schnelle Wahl. Unter {ui:new_tab.advanced} legt {ui:control.natives.state_share_permille} fest, wie viel bewohntes Land Staaten halten (3–60 %), und {ui:control.natives.peasant_peak_permille} begrenzt den Anteil der Bauern an einem sesshaften Ort (30–80 %). Auf kargem Ackerland bleiben eher Stämme."
resources_title = "Rohstoffe"
resources_text = "Unter {ui:new_tab.advanced} hat jeder Rohstoff seine eigene Häufigkeit: 1× entspricht dem Grundspiel, 0 entfernt ihn. Mehr von einem lässt weniger Orte für die anderen. Wo was vorkommen kann, bestimmen weiterhin Klima und Gelände."

[hidden]
title = "Die Überraschung bewahren"
lead = "Neue Welten beginnen verdeckt. Bei der Länderwahl zeigt die Karte Terra Incognita statt der Neuen Welt, und trotzdem kannst du ein einheimisches Land aus der Liste wählen."
covered = "Verdeckt: Die Neue Welt ist Terra Incognita"
shown = "Aufgedeckt: einheimische Länder im Jahr 1337"
reveal_text = "Deckt die Karten der Welt im Generator auf. Das Spiel behält seine eigene Einstellung."
show_text = "Deckt das Mod-Bild und die Karte der Länderwahl in EU5 auf. Stell es auf dem Reiter {ui:new_tab.output} ein oder später auf dem Reiter {ui:tab.world} der fertigen Welt, ohne neu zu erzeugen; schließe danach das Mod-Menü und öffne es erneut."
atlas = "Eine aufgedeckte Welt zeigt unter {ui:tab.maps} zehn Karten: Land, Länder, Kulturen, Religionen, Rohstoffe und mehr. {ui:compare} stellt zwei Welten nebeneinander."

[library]
title = "Deine Welten"
lead = "Alles, was du erzeugst, bleibt in der Bibliothek des Generators, mit Code, Karten und Notizen."
versions_title = "{ui:world_versions}"
versions_text = "Wähle eine fertige Welt. Mit {ui:part.peoples.button} entstehen neue Länder, Kulturen und Religionen auf demselben Land; mit {ui:part.resources.button} werden nur die Rohstoffe neu verteilt. Die frühere Fassung bleibt in der Bibliothek."
queue_title = "Mehrere Welten nacheinander"
queue_text = "{ui:enqueue} speichert die aktuellen Einstellungen als Auftrag, {ui:run_queue} erzeugt die Welten nacheinander. Du kannst weitere hinzufügen, während eine entsteht."
share_title = "Eine Welt teilen"
share_text = "Schicke den Weltcode oder nutze {ui:export_file} für eine `.rnworld`-Datei mit Karten und Notizen. Deine Freunde erzeugen daraus mit ihrem eigenen Spiel die spielbare Mod."
move_title = "Eine Welt auf einen anderen Rechner bringen"
move_text = "{ui:send_built} speichert die ganze fertige Mod als `.rnworld-mod`-Datei für einen anderen deiner Rechner. Beide brauchen dieselbe Spielversion."
clean_title = "Aufräumen"
clean_text = "{ui:library_remove} nimmt Welten aus dem Spiel und behält ihre Einträge. {ui:library_delete} löscht sie endgültig."

[compat]
title = "Kompatibilität"
game = "Spielversion"
game_text = "EU5 {v:game}. Neue Patches des 1.4-Zweigs laufen meist ohne Generator-Update; zuletzt vollständig geprüft mit {v:verified}."
saves = "Spielstände"
saves_text = "Nur neue Kampagnen. Ein Generator-Update ändert bestehende Welten und ihre Spielstände nicht."
pillars = "Across the Pillars"
pillars_text = "Unterstützt und optional. Expeditionen in die Neue Welt und Schatzflotten nutzen die erzeugte Karte."
refined = "Refined Colonization"
refined_text = "Kompatibel. Ladereihenfolge: zuerst Refined Colonization, dann deine Welt-Mod."
multiplayer = "Mehrspieler"
multiplayer_text = "Unterstützt und von der Community getestet. Alle brauchen dieselbe Spielversion, dieselbe Welt-Mod und dieselben anderen Mods."
ironman = "Ironman und Errungenschaften"
ironman_text = "Funktionieren nach den normalen Spielregeln."
maps = "Kartenüberarbeitungen"
maps_text = "Mods, die die Amerikas ersetzen, vertragen sich nicht mit RNW. Andere Kombinationen sind ungetestet."
system = "System"
system_text = "Windows oder Linux und Steam Deck über Proton. macOS wird nicht unterstützt."

[help]
title = "Wenn etwas schiefgeht"
found_q = "Der Generator findet EU5 nicht"
found_a = "Öffne {ui:settings_title} und wähle den fehlenden Ordner. Hast du EU5 noch nie gestartet, starte es einmal, damit es sein Profil anlegt, und öffne dann den Generator erneut."
memory_q = "Zu wenig Arbeitsspeicher"
memory_a = "Die Erzeugung braucht etwa 8 GB freien Arbeitsspeicher, und EU5 kann schon im Hauptmenü fast 16 GB belegen. Schließe EU5, sobald der Generator offen ist, oder starte den Generator ohne das Spiel: Er liegt im Steam-Ordner `steamapps/workshop/content/3450310/3829217331`."
blank_q = "Das Fenster bleibt leer oder wird falsch gezeichnet"
blank_a = "Öffne {ui:settings_title}, wähle {ui:settings.classic_window} und starte den Generator neu. Öffnet sich das Fenster gar nicht, starte das Programm mit `--classic`."
classic_q = "Stattdessen öffnet sich ein schlichteres Fenster"
classic_a = "Das ist das klassische Fenster, und es kann alles, was das Hauptfenster kann. Es öffnet sich von selbst, wenn das System kein WebView2 (Windows) oder WebKitGTK 4.1 (Linux) hat, wie in der üblichen Proton-Umgebung von EU5."
error_q = "Die Erzeugung bricht mit einem Fehler ab"
error_a = "Lies die Meldung: Sie sagt, ob es an Spieldateien, am Zielort, an den Einstellungen oder an der Karte liegt. Manche Startwerte und Einstellungen ergeben keine gültige Welt; {ui:retry_new_seed} versucht einen anderen."
blocked_q = "Windows oder ein Virenscanner blockiert den Generator"
blocked_a = "Der Generator ist nicht digital signiert, daher können Smart App Control oder ein Virenscanner anschlagen. Er braucht keine Administratorrechte. Die [Versionshinweise](https://github.com/Sir-Starch/eu5-random-new-world/releases) nennen die Prüfergebnisse jeder Datei; melde eine Blockade bitte auf GitHub."
picture_q = "Das Mod-Menü zeigt noch das alte Kartenbild"
picture_a = "Schließe das Mod-Menü im Hauptmenü von EU5 und öffne es erneut. Hat sich die Welt selbst geändert, starte das Spiel komplett neu."
library_q = "Wo liegen meine Welten?"
library_a = "In einer Bibliothek außerhalb der Mod-Ordner, damit jede Kopie des Generators dieselben Welten sieht. Windows: `%LOCALAPPDATA%\\RandomNewWorld`. Linux: `~/.local/share/random-new-world`. Proton: der Windows-Pfad im Proton-Präfix von EU5."
bug_q = "Ich habe einen Fehler gefunden"
bug_a = "[Eröffne ein Issue auf GitHub](https://github.com/Sir-Starch/eu5-random-new-world/issues) und nenne deinen Weltcode. {ui:diagnostics} unter {ui:settings_title} packt die Protokolle des Generators in eine Datei zum Anhängen; von selbst wird nichts verschickt."

