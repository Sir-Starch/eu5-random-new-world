[meta]
title = "Random New World · Руководство игрока"
description = "Создайте свой Новый Свет для Europa Universalis V: четыре шага до первой кампании, типы миров, настройки, совместимость и ответы на частые вопросы."
language = "Язык"
contents = "Содержание"
skip = "Перейти к руководству"
image_hero = "Новый Свет, созданный RNW в Europa Universalis V; его запад ещё скрыт как Terra Incognita"

[nav]
start = "Первый мир"
rules = "Перед игрой"
types = "Типы миров"
settings = "Настройки"
hidden = "Скрытая карта"
library = "Ваши миры"
compat = "Совместимость"
help = "Проблемы"
workshop = "Мастерская"

[hero]
kicker = "Руководство игрока"
lead = "Новый мир вместо Америк для вашей следующей кампании в EU5. Плывите на запад в неведомые воды или возглавьте одну из коренных стран. Старый Свет остаётся нетронутым."
fact_generator = "Генератор {v:version}"
fact_game = "EU5 {v:game}"
fact_languages = "11 языков"
cta = "Создать первый мир"
cta_help = "Что-то пошло не так?"

[start]
title = "Первый мир за четыре шага"
lead = "Для первой кампании хватит настроек по умолчанию. Всё остальное на этой странице подождёт."
"1_title" = "Откройте генератор"
"1_text" = "В EU5 откройте меню {game:mods_dlcs}, найдите **Random New World (RNW)** и нажмите {game:open_folder}. В этой папке запустите **Random New World Generator**."
"1_note" = "Когда генератор откроется, EU5 можно закрыть, чтобы освободить память."
"2_title" = "Выберите мир"
"2_text" = "Нажмите {ui:new_world} и на вкладке {ui:new_tab.world} укажите {ui:type}; для начала хорошо подойдут {ui:type.continents}. Остальное оставьте как есть или вставьте в поле {ui:code} код, присланный другом."
"3_title" = "Создайте его"
"3_text" = "На вкладке {ui:new_tab.output} оставьте вариант {ui:destination.library} и отметьте {ui:install}. Нажмите {ui:generate} и подождите несколько минут."
"3_note" = "Для генерации нужно около 9 ГБ свободной оперативной памяти."
"4_title" = "Включите и играйте"
"4_text" = "В меню {game:mods_dlcs} отметьте новый мир, например **RNW: Small continents 7K3Q**, нажмите {game:apply} и начните новую кампанию с 1337 года."
"4_note" = "Сам мод **Random New World (RNW)** не включайте: в нём только генератор. В моде мира есть всё, что нужно для кампании."
ready_title = "Хотите сразу играть?"
ready_text = "Подпишитесь на готовый мир [RNW: The Wall CWYS](https://steamcommunity.com/sharedfiles/filedetails/?id=3832180151). Генератор не нужен."

[rules]
title = "Перед игрой"
lead = "Созданная карта — такой же мод, как другие, но со своими правилами."
"1_title" = "Только новые кампании"
"1_text" = "Карту нельзя добавить в начатую кампанию. Начните новую игру в 1337 году."
"2_title" = "Один мир за раз"
"2_text" = "Включайте только тот мир, в который играете. Мод с генератором остаётся выключенным."
"3_title" = "Смена — через перезапуск"
"3_text" = "Полностью закройте EU5, прежде чем играть в другой мир или заменить уже загруженный. Смена в одном сеансе может смешать карты и обрушить игру."
"4_title" = "Храните мод вместе с сохранениями"
"4_text" = "Для каждой кампании храните её мод мира и версию EU5. Код мира — это рецепт, а не резервная копия: другая версия игры или генератора может создать по нему иной мир."

[types]
title = "Типы миров"
lead = "Тип мира — это готовый набор настроек. Выберите форму по вкусу, а затем меняйте её на вкладке {ui:new_tab.world} или {ui:new_tab.advanced}."
wall_note = "Если снять флажок {ui:control.new_world.wall_allow_gaps}, Стена станет сплошным барьером: корабли не смогут ни пересечь её, ни обогнуть."

[settings]
title = "Настройте под себя"
lead = "При любых значениях мир остаётся играбельным. Вот настройки, которые стоит знать; кнопка {ui:reset_all} отменяет ваши изменения."
seed_title = "{ui:seed} и {ui:code}"
seed_text = "Зерно определяет мир, а кнопка {ui:random} выбирает новое. Код мира хранит зерно и все настройки: скопируйте его, чтобы поделиться миром, или вставьте чужой, чтобы создать такой же. Один и тот же код даёт тот же мир при той же версии генератора и тех же файлах игры."
sketch_title = "{ui:candidates}"
sketch_text = "Показывает шесть набросков суши до того, как будет создан весь мир. Выберите один, чтобы взять его зерно и настройки. Наброски раскрывают сушу, а итоговый берег ещё может немного сместиться."
draw_title = "Свой материк"
draw_text = "Кнопка {ui:land_template} сохраняет картинку с областью, которую можно заполнить. Нарисуйте сушу белым, море чёрным и загрузите рисунок кнопкой {ui:land_image}. Рельеф, реки и народы появятся на вашем контуре."
ocean_title = "{ui:control.new_world.expand_oceans}"
ocean_text = "Включено по умолчанию: материкам хватает места за пределами прежних очертаний Америк. Увеличьте {ui:control.new_world.centre_permille} на вкладке {ui:new_tab.advanced}, чтобы сдвинуть сушу к середине океана."
peoples_title = "Коренные общества"
peoples_text = "Быстрый выбор — {ui:quick.states} на вкладке {ui:new_tab.world}. На вкладке {ui:new_tab.advanced} параметр {ui:control.natives.state_share_permille} задаёт, сколько обжитой земли держат государства (3–60 %), а {ui:control.natives.peasant_peak_permille} ограничивает долю крестьян в оседлой локации (30–80 %). На скудной пашне жизнь остаётся племенной."
resources_title = "Ресурсы"
resources_text = "На вкладке {ui:new_tab.advanced} у каждого ресурса своя частота: 1× — как в игре, 0 — убрать совсем. Чем больше одного ресурса, тем меньше локаций остаётся другим. Где какой ресурс может появиться, по-прежнему решают климат и местность."

[hidden]
title = "Сохраните интригу"
lead = "Новые миры создаются скрытыми. При выборе страны вместо Нового Света видна Terra Incognita, но коренную страну всё равно можно выбрать из списка."
covered = "Скрыто: Новый Свет — Terra Incognita"
shown = "Открыто: коренные страны 1337 года"
reveal_text = "Открывает карты мира внутри генератора. В игре действует отдельная настройка."
show_text = "Открывает картинку мода и карту выбора страны в EU5. Включите её на вкладке {ui:new_tab.output} или позже на вкладке {ui:tab.world} готового мира, без новой генерации; затем закройте и снова откройте меню модов."
atlas = "У открытого мира на вкладке {ui:tab.maps} десять карт: суша, страны, культуры, религии, ресурсы и другие. Кнопка {ui:compare} ставит два мира рядом."

[library]
title = "Ваши миры"
lead = "Всё созданное хранится в библиотеке генератора вместе с кодом, картами и заметками."
versions_title = "{ui:world_versions}"
versions_text = "Выберите готовый мир. Кнопка {ui:part.peoples.button} создаёт новые страны, культуры и религии на той же суше; кнопка {ui:part.resources.button} заново распределяет только ресурсы. Прежняя версия остаётся в библиотеке."
queue_title = "Несколько миров подряд"
queue_text = "Кнопка {ui:enqueue} сохраняет текущие настройки как задание, а {ui:run_queue} создаёт миры один за другим. Пока один мир создаётся, можно добавлять новые."
share_title = "Поделиться миром"
share_text = "Отправьте код мира или нажмите {ui:export_file}, чтобы получить файл `.rnworld` с картами и заметками. Друг создаст из него играбельный мод на своей копии игры."
move_title = "Перенести мир на другой компьютер"
move_text = "Кнопка {ui:send_built} сохраняет весь готовый мод в файл `.rnworld-mod`, чтобы перенести его на другой ваш компьютер. На обоих нужна одна и та же версия игры."
clean_title = "Уборка"
clean_text = "Кнопка {ui:library_remove} убирает миры из игры, но сохраняет их записи. Кнопка {ui:library_delete} удаляет их насовсем."

[compat]
title = "Совместимость"
game = "Версия игры"
game_text = "EU5 {v:game}. Новые патчи ветки 1.4 обычно работают без обновления генератора; последняя полная проверка — {v:verified}."
saves = "Сохранения"
saves_text = "Только новые кампании. Обновление генератора не меняет существующие миры и их сохранения."
pillars = "Across the Pillars"
pillars_text = "Поддерживается, но не обязательно. Экспедиции в Новый Свет и флоты сокровищ используют созданную карту."
refined = "Refined Colonization"
refined_text = "Совместим. Порядок загрузки: сначала Refined Colonization, затем ваш мод мира."
multiplayer = "Мультиплеер"
multiplayer_text = "Поддерживается и проверен сообществом. Всем игрокам нужны одна версия игры, один мод мира и одинаковые прочие моды."
ironman = "Железная воля и достижения"
ironman_text = "Работают по обычным правилам игры."
maps = "Переделки карты"
maps_text = "Моды, заменяющие Америки, конфликтуют с RNW. Прочие сочетания не проверены."
system = "Система"
system_text = "Windows или Linux и Steam Deck через Proton. macOS не поддерживается."

[help]
title = "Если что-то пошло не так"
found_q = "Генератор не находит EU5"
found_a = "Откройте {ui:settings_title} и укажите недостающую папку. Если EU5 ещё ни разу не запускалась, запустите её один раз, чтобы она создала профиль, а затем снова откройте генератор."
memory_q = "Не хватает памяти"
memory_a = "Для генерации нужно около 9 ГБ свободной оперативной памяти, а EU5 может занять почти все 16 ГБ даже в главном меню. Закройте EU5, когда генератор откроется, или запускайте генератор без игры: он лежит в папке Steam `steamapps/workshop/content/3450310/3829217331`."
blank_q = "Окно пустое или рисуется с ошибками"
blank_a = "Откройте {ui:settings_title}, выберите {ui:settings.classic_window} и перезапустите генератор. Если окно не открывается совсем, запустите программу с ключом `--classic`."
classic_q = "Вместо основного открылось более простое окно"
classic_a = "Это классическое окно, и оно умеет всё то же, что и основное. Оно открывается само, если в системе нет WebView2 (Windows) или WebKitGTK 4.1 (Linux), как в обычной установке EU5 через Proton."
error_q = "Генерация остановилась с ошибкой"
error_a = "Прочитайте сообщение: в нём сказано, в чём дело — в файлах игры, месте сохранения, настройках или карте. Из некоторых зёрен и настроек правильный мир не получается; кнопка {ui:retry_new_seed} попробует другое зерно."
blocked_q = "Windows или антивирус блокирует генератор"
blocked_a = "У генератора нет цифровой подписи, поэтому Smart App Control или антивирус могут его остановить. Права администратора ему не нужны. В [примечаниях к выпуску](https://github.com/Sir-Starch/eu5-random-new-world/releases) указаны результаты проверки каждого файла; о блокировке, пожалуйста, сообщите на GitHub."
picture_q = "В меню модов осталась старая картинка карты"
picture_a = "Закройте и снова откройте меню модов из главного меню EU5. Если изменился сам мир, игру нужно полностью перезапустить."
library_q = "Где хранятся мои миры?"
library_a = "В библиотеке вне папок модов, поэтому любая копия генератора видит одни и те же миры. Windows: `%LOCALAPPDATA%\\RandomNewWorld`. Linux: `~/.local/share/random-new-world`. Proton: путь Windows внутри префикса Proton для EU5."
bug_q = "Нашлась ошибка"
bug_a = "[Сообщите о ней на GitHub](https://github.com/Sir-Starch/eu5-random-new-world/issues) и укажите код мира. Кнопка {ui:diagnostics} в окне {ui:settings_title} соберёт журналы генератора в один файл для отчёта; сам генератор ничего никуда не отправляет."

