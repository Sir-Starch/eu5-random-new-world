source = "c9141f3076460f73"

[meta]
title = "Random New World · 플레이어 가이드"
description = "Europa Universalis V를 위한 나만의 신대륙을 만들어 보세요. 첫 캠페인까지 4단계, 월드 종류, 설정, 호환성, 자주 겪는 문제의 해결법을 담았습니다."
language = "언어"
contents = "목차"
skip = "가이드로 건너뛰기"
image_hero = "Europa Universalis V에서 RNW가 생성한 신대륙. 서쪽 절반은 아직 Terra Incognita입니다"

[nav]
start = "첫 월드"
rules = "플레이 전에"
types = "월드 종류"
settings = "설정"
hidden = "숨겨진 지도"
library = "내 월드"
compat = "호환성"
help = "문제 해결"
workshop = "창작마당"

[hero]
kicker = "플레이어 가이드"
lead = "다음 EU5 캠페인에서 아메리카 대륙을 새로운 세계로 바꿔 보세요. 미지의 바다를 향해 서쪽으로 항해하거나, 그곳 원주민 국가를 이끌 수 있습니다. 구세계는 바닐라 그대로입니다."
fact_generator = "생성기 {v:version}"
fact_game = "EU5 {v:game}"
fact_languages = "11개 언어"
cta = "첫 월드 만들기"
cta_help = "문제가 생겼나요?"

[start]
title = "4단계로 만드는 첫 월드"
lead = "첫 캠페인이라면 기본 설정으로 충분합니다. 이 페이지의 나머지는 나중에 봐도 됩니다."
"1_title" = "생성기 열기"
"1_text" = "EU5에서 {game:mods_dlcs}를 열고 **Random New World (RNW)**를 찾아 {game:open_folder}를 누르세요. 그 폴더에서 **Random New World Generator**를 실행하세요."
"1_note" = "생성기가 열리면 메모리를 확보하기 위해 EU5를 꺼도 됩니다."
"2_title" = "월드 고르기"
"2_text" = "{ui:new_world}를 누르고 {ui:new_tab.world} 탭에서 {ui:type}를 고르세요. 처음에는 {ui:type.continents}이 무난합니다. 나머지는 그대로 두거나 친구에게 받은 {ui:code}를 붙여 넣으세요."
"3_title" = "생성하기"
"3_text" = "{ui:new_tab.output} 탭에서 {ui:destination.library}을 그대로 두고 {ui:install}에 체크하세요. {ui:generate}를 누르고 몇 분 기다리세요."
"3_note" = "생성에는 약 9GB의 여유 RAM이 필요합니다."
"4_title" = "켜고 플레이하기"
"4_text" = "{game:mods_dlcs}에서 새 월드(예: **RNW: Small continents 7K3Q**)에 체크하고 {game:apply}을 누른 뒤 1337년 새 캠페인을 시작하세요."
"4_note" = "**Random New World (RNW)** 자체는 체크하지 마세요. 생성기만 들어 있습니다. 캠페인에 필요한 것은 모두 월드 모드에 들어 있습니다."
ready_title = "바로 플레이하고 싶나요?"
ready_text = "완성된 월드인 [RNW: The Wall CWYS](https://steamcommunity.com/sharedfiles/filedetails/?id=3832180151)를 구독하세요. 생성기가 필요 없습니다."

[rules]
title = "플레이 전에"
lead = "생성된 지도도 여느 모드와 같지만, 몇 가지 지켜야 할 규칙이 있습니다."
"1_title" = "새 캠페인 전용"
"1_text" = "진행 중인 캠페인에는 지도를 추가할 수 없습니다. 1337년부터 새 게임을 시작하세요."
"2_title" = "한 번에 한 월드"
"2_text" = "플레이할 월드만 체크하세요. 생성기 항목은 체크하지 않은 채로 둡니다."
"3_title" = "바꿀 때는 재시작"
"3_text" = "다른 월드를 플레이하거나 불러온 월드를 교체하기 전에 EU5를 완전히 종료하세요. 한 세션 안에서 바꾸면 지도가 섞이고 게임이 튕길 수 있습니다."
"4_title" = "모드는 저장 파일과 함께"
"4_text" = "캠페인마다 그 월드 모드와 EU5 버전을 보관하세요. 월드 코드는 백업이 아니라 레시피입니다. 게임이나 생성기 버전이 다르면 같은 코드로도 다른 월드가 나올 수 있습니다."

[types]
title = "월드 종류"
lead = "월드 종류는 시작 설정의 묶음입니다. 마음에 드는 형태를 고른 뒤 {ui:new_tab.world} 탭이나 {ui:new_tab.advanced}에서 조정하세요."
wall_note = "{ui:control.new_world.wall_allow_gaps}을 끄면 장벽은 끊김 없는 장애물이 되어, 배가 건너지도 돌아가지도 못합니다."

[settings]
title = "내 마음대로"
lead = "어떤 값이든 플레이 가능한 월드가 됩니다. 알아 두면 좋은 설정은 다음과 같습니다. {ui:reset_all}로 변경 사항을 되돌릴 수 있습니다."
seed_title = "{ui:seed}와 {ui:code}"
seed_text = "시드가 월드를 정하고, {ui:random}는 새 시드를 뽑습니다. 월드 코드에는 시드와 모든 설정이 담깁니다. 월드를 공유하려면 복사하고, 만들려면 붙여 넣으세요. 생성기 버전과 게임 파일이 같다면 같은 코드에서 같은 월드가 나옵니다."
sketch_title = "{ui:candidates}"
sketch_text = "월드 전체를 만들기 전에 땅의 스케치 6개를 보여 줍니다. 하나를 고르면 그 시드와 설정을 가져옵니다. 스케치에서는 땅의 모양이 드러나며, 최종 해안선은 조금 달라질 수 있습니다."
draw_title = "직접 그린 대륙"
draw_text = "{ui:land_template}으로 채울 수 있는 영역의 그림을 받습니다. 땅은 흰색, 바다는 검은색으로 칠한 뒤 {ui:land_image}로 불러오세요. 지형과 강, 민족이 그 윤곽 위에 생성됩니다."
ocean_title = "{ui:control.new_world.expand_oceans}"
ocean_text = "기본으로 켜져 있습니다. 대륙이 아메리카의 원래 윤곽을 넘어 넓게 펼쳐질 수 있습니다. 땅을 대양 한가운데 쪽으로 옮기려면 {ui:new_tab.advanced}에서 {ui:control.new_world.centre_permille}를 높이세요."
peoples_title = "원주민 사회"
peoples_text = "{ui:new_tab.world} 탭의 {ui:quick.states}로 빠르게 고를 수 있습니다. {ui:new_tab.advanced}에서 {ui:control.natives.state_share_permille}은 사람이 사는 땅 중 국가가 차지하는 비율(3~60%)을, {ui:control.natives.peasant_peak_permille}은 정착지의 농민 비율 상한(30~80%)을 정합니다. 척박한 땅은 부족 사회로 남기 쉽습니다."
resources_title = "자원"
resources_text = "{ui:new_tab.advanced}에서 자원마다 빈도를 정할 수 있습니다. 1×는 기본 게임과 같고, 0은 그 자원을 없앱니다. 한 자원을 늘리면 다른 자원이 들어갈 지역이 줄어듭니다. 어디에 무엇이 나올지는 여전히 기후와 지형이 정합니다."

[hidden]
title = "놀라움을 남겨 두기"
lead = "새 월드는 가려진 상태로 시작합니다. 국가 선택 화면에서는 신대륙 대신 Terra Incognita가 보이지만, 목록에서 원주민 국가를 고를 수는 있습니다."
covered = "가림: 신대륙은 Terra Incognita"
shown = "공개: 1337년의 원주민 국가들"
reveal_text = "생성기 안에서 월드의 지도를 보여 줍니다. 게임은 따로 설정을 유지합니다."
show_text = "EU5의 모드 그림과 국가 선택 지도를 공개합니다. {ui:new_tab.output} 탭에서 정하거나, 나중에 월드의 {ui:tab.world} 탭에서 다시 생성하지 않고 바꿀 수 있습니다. 그다음 모드 메뉴를 닫았다가 다시 여세요."
atlas = "공개한 월드는 {ui:tab.maps}에서 땅, 국가, 문화, 종교, 자원 등 10가지 지도를 보여 줍니다. {ui:compare}로 두 월드를 나란히 볼 수 있습니다."

[library]
title = "내 월드"
lead = "생성한 모든 것은 코드, 지도, 메모와 함께 생성기 라이브러리에 남습니다."
versions_title = "{ui:world_versions}"
versions_text = "완성된 월드를 고르세요. {ui:part.peoples.button}은 같은 땅 위에 새 국가와 문화, 종교를 만들고, {ui:part.resources.button}은 자원만 다시 배치합니다. 이전 버전은 라이브러리에 남습니다."
queue_title = "여러 월드를 연달아"
queue_text = "{ui:enqueue}는 현재 설정을 작업으로 저장하고, {ui:run_queue}은 월드를 하나씩 차례로 만듭니다. 생성 중에도 더 추가할 수 있습니다."
share_title = "월드 공유하기"
share_text = "월드 코드를 보내거나, {ui:export_file}으로 지도와 메모가 담긴 `.rnworld` 파일을 만드세요. 친구는 자기 게임으로 그 파일에서 플레이 가능한 모드를 만듭니다."
move_title = "다른 컴퓨터로 월드 옮기기"
move_text = "{ui:send_built}는 완성된 모드 전체를 `.rnworld-mod` 파일로 저장해, 내 다른 컴퓨터로 옮길 수 있게 합니다. 두 컴퓨터 모두 같은 게임 버전이 필요합니다."
clean_title = "정리하기"
clean_text = "{ui:library_remove}는 월드를 게임에서 빼고 기록은 남깁니다. {ui:library_delete}는 완전히 지웁니다."

[compat]
title = "호환성"
game = "게임 버전"
game_text = "EU5 {v:game}. 1.4 계열의 새 패치는 대개 생성기 업데이트 없이 작동합니다. 마지막으로 완전히 검증한 버전은 {v:verified}입니다."
saves = "저장 파일"
saves_text = "새 캠페인 전용입니다. 생성기를 업데이트해도 기존 월드와 저장 파일은 바뀌지 않습니다."
pillars = "Across the Pillars"
pillars_text = "지원하며 필수는 아닙니다. 신대륙 탐험과 보물선단이 생성된 지도를 씁니다."
refined = "Refined Colonization"
refined_text = "호환됩니다. 로드 순서: 먼저 Refined Colonization, 그다음 월드 모드."
multiplayer = "멀티플레이"
multiplayer_text = "지원하며 커뮤니티에서 테스트했습니다. 모든 플레이어에게 같은 게임 버전, 같은 월드 모드, 같은 다른 모드가 필요합니다."
ironman = "철인과 업적"
ironman_text = "게임의 일반 규칙대로 작동합니다."
maps = "지도 개편 모드"
maps_text = "아메리카 대륙을 바꾸는 모드는 RNW와 충돌합니다. 다른 조합은 검증되지 않았습니다."
system = "시스템"
system_text = "Windows, 또는 Proton을 통한 Linux와 Steam Deck. macOS는 지원하지 않습니다."

[help]
title = "문제가 생겼을 때"
found_q = "생성기가 EU5를 찾지 못함"
found_a = "{ui:settings_title}을 열고 없는 폴더를 지정하세요. EU5를 한 번도 실행하지 않았다면 프로필이 만들어지도록 한 번 실행한 뒤 생성기를 다시 여세요."
memory_q = "메모리가 부족함"
memory_a = "생성에는 약 9GB의 여유 RAM이 필요한데, EU5는 주 메뉴에서도 16GB 대부분을 차지할 수 있습니다. 생성기가 열리면 EU5를 종료하거나, 게임 없이 생성기를 실행하세요. 생성기는 Steam의 `steamapps/workshop/content/3450310/3829217331` 폴더에 있습니다."
blank_q = "창이 비어 있거나 제대로 그려지지 않음"
blank_a = "{ui:settings_title}에서 {ui:settings.classic_window}을 선택하고 생성기를 다시 시작하세요. 창이 아예 열리지 않으면 `--classic`을 붙여 실행하세요."
classic_q = "대신 더 단순한 창이 열림"
classic_a = "클래식 창이며, 기본 창이 하는 일을 모두 할 수 있습니다. 시스템에 WebView2(Windows)나 WebKitGTK 4.1(Linux)이 없으면, 예를 들어 EU5의 일반적인 Proton 환경에서는 자동으로 열립니다."
error_q = "생성이 오류로 멈춤"
error_a = "메시지를 읽어 보세요. 문제가 게임 파일, 저장 위치, 설정, 지도 중 어디에 있는지 알려 줍니다. 어떤 시드와 설정으로는 올바른 월드를 만들 수 없습니다. {ui:retry_new_seed}으로 다른 시드를 시도하세요."
blocked_q = "Windows나 백신이 생성기를 막음"
blocked_a = "생성기에는 디지털 서명이 없어 Smart App Control이나 백신이 문제를 제기할 수 있습니다. 관리자 권한은 필요 없습니다. [릴리스 노트](https://github.com/Sir-Starch/eu5-random-new-world/releases)에 파일별 검사 결과가 있습니다. 차단되면 GitHub에 알려 주세요."
picture_q = "모드 메뉴에 예전 지도 그림이 그대로 보임"
picture_a = "EU5 주 메뉴에서 모드 메뉴를 닫았다가 다시 여세요. 월드 자체가 바뀌었다면 게임을 완전히 다시 시작하세요."
library_q = "내 월드는 어디에 저장되나요?"
library_a = "모드 폴더 밖의 라이브러리에 저장되므로, 생성기의 어느 사본에서든 같은 월드가 보입니다. Windows: `%LOCALAPPDATA%\\RandomNewWorld`. Linux: `~/.local/share/random-new-world`. Proton: EU5 Proton 프리픽스 안의 Windows 위치."
bug_q = "버그를 찾았어요"
bug_a = "월드 코드와 함께 [GitHub에 이슈를 올려 주세요](https://github.com/Sir-Starch/eu5-random-new-world/issues). {ui:settings_title}의 {ui:diagnostics}은 생성기 로그를 첨부용 파일 하나로 묶어 줍니다. 저절로 어딘가로 전송되는 것은 없습니다."

