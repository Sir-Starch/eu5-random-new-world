workshop = "Workshop"

[hero]
kicker = "Guide du joueur"
lead = "Remplacez les Amériques par un nouveau monde pour votre prochaine campagne d’EU5. Mettez le cap à l’ouest vers des eaux inconnues, ou dirigez l’un de ses pays autochtones. L’Ancien Monde reste intact."
fact_generator = "Générateur {v:version}"
fact_game = "EU5 {v:game}"
fact_languages = "11 langues"
cta = "Créer mon premier monde"
cta_help = "Un problème ?"

[start]
title = "Votre premier monde en quatre étapes"
lead = "Les réglages par défaut suffisent pour une première campagne. Tout le reste de cette page peut attendre."
"1_title" = "Ouvrez le générateur"
"1_text" = "Dans EU5, ouvrez {game:mods_dlcs}, trouvez **Random New World (RNW)** et cliquez sur {game:open_folder}. Dans ce dossier, lancez **Random New World Generator**."
"1_note" = "Une fois le générateur ouvert, vous pouvez fermer EU5 pour libérer de la mémoire."
"2_title" = "Choisissez un monde"
"2_text" = "Cliquez sur {ui:new_world} et, dans l’onglet {ui:new_tab.world}, choisissez un {ui:type}. {ui:type.continents} est un bon premier choix. Laissez le reste tel quel, ou collez le {ui:code} d’un ami."
"3_title" = "Générez-le"
"3_text" = "Dans l’onglet {ui:new_tab.output}, gardez {ui:destination.library} et cochez {ui:install}. Cliquez sur {ui:generate} et patientez quelques minutes."
"3_note" = "La génération demande environ 7,5 Go de RAM libre."
"4_title" = "Activez-le et jouez"
"4_text" = "Dans {game:mods_dlcs}, cochez votre nouveau monde, par exemple **RNW: Small continents 7K3Q**, cliquez sur {game:apply} et commencez une nouvelle campagne en 1337."
"4_note" = "Laissez **Random New World (RNW)** lui-même décoché : il ne contient que le générateur. Votre mod de monde contient tout ce dont la campagne a besoin."
ready_title = "Envie de jouer tout de suite ?"
ready_text = "Abonnez-vous à [RNW: The Wall CWYS](https://steamcommunity.com/sharedfiles/filedetails/?id=3832180151), un monde prêt à jouer. Pas besoin du générateur."

[rules]
title = "Avant de jouer"
lead = "Une carte générée est un mod comme un autre, avec quelques règles qui lui sont propres."
"1_title" = "Nouvelles campagnes uniquement"
"1_text" = "Une carte ne peut pas être ajoutée à une campagne en cours. Commencez une nouvelle partie en 1337."
"2_title" = "Un monde à la fois"
"2_text" = "Cochez uniquement le monde auquel vous jouez. L’élément du générateur reste décoché."
"3_title" = "Redémarrer pour changer"
"3_text" = "Fermez complètement EU5 avant de jouer un autre monde ou d’en remplacer un déjà chargé. Changer au cours d’une même session peut mélanger les cartes et faire planter le jeu."
"4_title" = "Le mod va avec ses sauvegardes"
"4_text" = "Conservez le mod de monde de chaque campagne et sa version d’EU5. Un code de monde est une recette, pas une sauvegarde : une autre version du jeu ou du générateur peut en tirer un monde différent."

[types]
title = "Types de monde"
lead = "Un type de monde est un ensemble de réglages de départ. Choisissez la forme qui vous plaît, puis ajustez-la dans l’onglet {ui:new_tab.world} ou dans {ui:new_tab.advanced}."
wall_note = "Si vous décochez {ui:control.new_world.wall_allow_gaps}, le Mur devient une barrière continue que les navires ne peuvent ni traverser ni contourner."

[settings]
title = "À votre façon"
lead = "Chaque valeur donne un monde jouable. Voici les réglages utiles à connaître ; {ui:reset_all} annule vos modifications."
seed_title = "{ui:seed} et {ui:code}"
seed_text = "La graine choisit le monde, et {ui:random} en tire une nouvelle. Un code de monde contient la graine et tous les réglages : copiez-le pour partager un monde, collez-en un pour le créer. Le même code donne le même monde avec la même version du générateur et les mêmes fichiers du jeu."
sketch_title = "{ui:candidates}"
sketch_text = "Affiche six esquisses des terres avant de construire un monde entier. Choisissez-en une pour reprendre sa graine et ses réglages. Les esquisses dévoilent les terres, et la côte finale peut encore légèrement bouger."
draw_title = "Votre propre continent"
draw_text = "{ui:land_template} vous donne une image de la zone à remplir. Peignez les terres en blanc et la mer en noir, puis chargez l’image avec {ui:land_image}. Relief, fleuves et peuples sont générés sur votre tracé."
ocean_title = "{ui:control.new_world.expand_oceans}"
ocean_text = "Activé par défaut : les continents ont de la place au-delà de l’ancien tracé des Amériques. Augmentez {ui:control.new_world.centre_permille} dans {ui:new_tab.advanced} pour pousser les terres vers le milieu de l’océan."
peoples_title = "Sociétés autochtones"
peoples_text = "{ui:quick.states} dans l’onglet {ui:new_tab.world} est le choix rapide. Dans {ui:new_tab.advanced}, {ui:control.natives.state_share_permille} fixe la part des terres habitées que tiennent des États (3–60 %), et {ui:control.natives.peasant_peak_permille} plafonne la part des paysans dans un lieu sédentaire (30–80 %). Les terres pauvres restent plus tribales."
resources_title = "Ressources"
resources_text = "Dans {ui:new_tab.advanced}, chaque ressource a sa propre fréquence : 1× correspond au jeu de base, 0 la supprime. Plus il y en a d’une, moins il reste de lieux pour les autres. Le climat et le terrain décident toujours où chacune peut apparaître."

[hidden]
title = "Gardez la surprise"
lead = "Les nouveaux mondes commencent cachés. La sélection du pays montre la Terra Incognita à la place du Nouveau Monde, et vous pouvez quand même choisir un pays autochtone dans la liste."
covered = "Caché : le Nouveau Monde est Terra Incognita"
shown = "Dévoilé : les pays autochtones de 1337"
reveal_text = "Dévoile les cartes du monde dans le générateur. Le jeu garde son propre réglage."
show_text = "Dévoile l’image du mod et la carte de sélection du pays dans EU5. Réglez-le dans l’onglet {ui:new_tab.output}, ou plus tard dans l’onglet {ui:tab.world} du monde sans le générer à nouveau ; fermez ensuite le menu des mods et rouvrez-le."
atlas = "Un monde dévoilé ouvre dix cartes dans {ui:tab.maps} : terres, pays, cultures, religions, ressources et plus encore. {ui:compare} place deux mondes côte à côte."

[library]
title = "Vos mondes"
lead = "Tout ce que vous générez reste dans la bibliothèque du générateur, avec son code, ses cartes et ses notes."
versions_title = "{ui:world_versions}"
versions_text = "Sélectionnez un monde terminé. {ui:part.peoples.button} crée de nouveaux pays, cultures et religions sur les mêmes terres ; {ui:part.resources.button} ne refait que les ressources. L’ancienne version reste dans la bibliothèque."
queue_title = "Plusieurs mondes à la suite"
queue_text = "{ui:enqueue} garde les réglages actuels comme une tâche, et {ui:run_queue} crée les mondes l’un après l’autre. Vous pouvez en ajouter pendant qu’un monde se génère."
share_title = "Partager un monde"
share_text = "Envoyez le code du monde, ou utilisez {ui:export_file} pour obtenir un fichier `.rnworld` avec ses cartes et ses notes. Votre ami en tire le mod jouable avec son propre jeu."
move_title = "Déplacer un monde entre vos ordinateurs"
move_text = "{ui:send_built} enregistre tout le mod construit dans un fichier `.rnworld-mod` à emporter sur un autre de vos ordinateurs. Les deux ont besoin de la même version du jeu."
clean_title = "Faire le ménage"
clean_text = "{ui:library_remove} sort les mondes du jeu et garde leurs fiches. {ui:library_delete} les efface pour de bon."

[compat]
title = "Compatibilité"
game = "Version du jeu"
game_text = "EU5 {v:game}. Les nouveaux correctifs de la branche 1.4 fonctionnent en général sans mise à jour du générateur ; dernière vérification complète sur {v:verified}."
saves = "Sauvegardes"
saves_text = "Nouvelles campagnes uniquement. Mettre à jour le générateur ne modifie ni les mondes existants ni leurs sauvegardes."
pillars = "Across the Pillars"
pillars_text = "Compatible et facultatif. Les expéditions vers le Nouveau Monde et les flottes au trésor utilisent la carte générée."
refined = "Refined Colonization"
refined_text = "Compatible. Ordre de chargement : d’abord Refined Colonization, puis votre mod de monde."
multiplayer = "Multijoueur"
multiplayer_text = "Compatible et testé par la communauté. Chaque joueur a besoin de la même version du jeu, du même mod de monde et des mêmes autres mods."
ironman = "Iron Man et succès"
ironman_text = "Fonctionnent selon les règles normales du jeu."
maps = "Refontes de la carte"
maps_text = "Les mods qui remplacent les Amériques entrent en conflit avec RNW. Les autres combinaisons n’ont pas été testées."
system = "Système"
system_text = "Windows, ou Linux et Steam Deck via Proton. macOS n’est pas pris en charge."

[help]
title = "En cas de problème"
found_q = "Le générateur ne trouve pas EU5"
found_a = "Ouvrez {ui:settings_title} et choisissez le dossier manquant. Si vous n’avez jamais lancé EU5, lancez-le une fois pour qu’il crée son profil, puis rouvrez le générateur."
memory_q = "Pas assez de mémoire"
memory_a = "La génération demande environ 7,5 Go de RAM libre, et EU5 peut occuper presque 16 Go dès le menu principal. Fermez EU5 une fois le générateur ouvert, ou lancez le générateur sans le jeu : il se trouve dans le dossier Steam `steamapps/workshop/content/3450310/3829217331`."
blank_q = "La fenêtre est vide ou mal dessinée"
blank_a = "Ouvrez {ui:settings_title}, choisissez {ui:settings.classic_window} et relancez le générateur. Si la fenêtre ne s’ouvre pas du tout, lancez le programme avec `--classic`."
classic_q = "Une fenêtre plus sobre s’est ouverte à la place"
classic_a = "C’est la fenêtre classique, et elle fait tout ce que fait la fenêtre principale. Elle s’ouvre d’elle-même quand le système n’a ni WebView2 (Windows) ni WebKitGTK 4.1 (Linux), comme dans l’installation Proton habituelle d’EU5."
error_q = "La génération s’arrête sur une erreur"
error_a = "Lisez le message : il indique si le souci vient des fichiers du jeu, de la destination, des réglages ou de la carte. Certaines graines et certains réglages ne donnent pas de monde valide ; {ui:retry_new_seed} en essaie une autre."
blocked_q = "Windows ou un antivirus bloque le générateur"
blocked_a = "Le générateur n’est pas signé numériquement, donc Smart App Control ou un antivirus peut s’en méfier. Il n’a pas besoin des droits d’administrateur. Les [notes de version](https://github.com/Sir-Starch/eu5-random-new-world/releases) donnent les résultats d’analyse de chaque fichier ; merci de signaler tout blocage sur GitHub."
picture_q = "Le menu des mods montre encore l’ancienne image de la carte"
picture_a = "Fermez le menu des mods depuis le menu principal d’EU5 et rouvrez-le. Si c’est le monde lui-même qui a changé, redémarrez complètement le jeu."
library_q = "Où sont rangés mes mondes ?"
library_a = "Dans une bibliothèque en dehors des dossiers de mods, pour que chaque copie du générateur voie les mêmes mondes. Windows : `%LOCALAPPDATA%\\RandomNewWorld`. Linux : `~/.local/share/random-new-world`. Proton : l’emplacement Windows dans le préfixe Proton d’EU5."
bug_q = "J’ai trouvé un bug"
bug_a = "[Ouvrez un ticket sur GitHub](https://github.com/Sir-Starch/eu5-random-new-world/issues) avec votre code de monde. {ui:diagnostics} dans {ui:settings_title} regroupe les journaux du générateur dans un fichier à joindre ; rien n’est envoyé de lui-même."

