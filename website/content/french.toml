[meta]
title = "Random New World · Guide du joueur"
description = "Créez votre propre Nouveau Monde pour Europa Universalis V : quatre étapes jusqu’à la première campagne, types de monde, réglages, compatibilité et réponses aux problèmes courants."
language = "Langue"
contents = "Sommaire"
skip = "Aller au guide"
image_hero = "Un Nouveau Monde généré par RNW dans Europa Universalis V, sa moitié ouest encore Terra Incognita"

[nav]
start = "Premier monde"
