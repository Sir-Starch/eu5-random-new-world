[meta]
title = "Random New World · Oyuncu rehberi"
description = "Europa Universalis V için kendi Yeni Dünyanızı yaratın: ilk sefere dört adım, dünya türleri, ayarlar, uyumluluk ve sık karşılaşılan sorunların yanıtları."
language = "Dil"
