[hero]
kicker = "Oyuncu rehberi"
lead = "Bir sonraki EU5 seferiniz için Amerika kıtalarının yerine yeni bir dünya koyun. Batıya, bilinmeyen sulara yelken açın ya da yerli ülkelerinden birini yönetin. Eski Dünya olduğu gibi kalır."
fact_generator = "Oluşturucu {v:version}"
fact_game = "EU5 {v:game}"
fact_languages = "11 dil"
cta = "İlk dünyanızı oluşturun"
cta_help = "Bir şeyler mi ters gitti?"

[start]
title = "Dört adımda ilk dünyanız"
lead = "İlk sefer için varsayılan ayarlar yeterlidir. Bu sayfadaki geri kalan her şey bekleyebilir."
"1_title" = "Oluşturucuyu açın"
"1_text" = "EU5’te {game:mods_dlcs} menüsünü açın, **Random New World (RNW)** modunu bulun ve {game:open_folder} düğmesine tıklayın. Bu klasörde **Random New World Generator** uygulamasını başlatın."
"1_note" = "Oluşturucu açıldıktan sonra belleği boşaltmak için EU5’i kapatabilirsiniz."
"2_title" = "Bir dünya seçin"
"2_text" = "{ui:new_world} öğesine tıklayın ve {ui:new_tab.world} sekmesinde {ui:type} seçin; başlangıç için {ui:type.continents} iyi bir seçimdir. Gerisini olduğu gibi bırakın ya da bir arkadaşınızdan aldığınız kodu {ui:code} alanına yapıştırın."
"3_title" = "Oluşturun"
"3_text" = "{ui:new_tab.output} sekmesinde {ui:destination.library} seçeneğini koruyun ve {ui:install} kutusunu işaretleyin. {ui:generate} düğmesine tıklayıp birkaç dakika bekleyin."
"3_note" = "Oluşturma için yaklaşık 9 GB boş RAM gerekir."
"4_title" = "Etkinleştirin ve oynayın"
"4_text" = "{game:mods_dlcs} menüsünde yeni dünyanızı, örneğin **RNW: Small continents 7K3Q** modunu işaretleyin, {game:apply} düğmesine tıklayın ve 1337’de yeni bir sefer başlatın."
"4_note" = "**Random New World (RNW)** modunun kendisini işaretlemeyin: içinde yalnızca oluşturucu var. Dünya modunuz seferin ihtiyaç duyduğu her şeyi içerir."
ready_title = "Hemen oynamak mı istiyorsunuz?"
ready_text = "Hazır bir dünya olan [RNW: The Wall CWYS](https://steamcommunity.com/sharedfiles/filedetails/?id=3832180151) moduna abone olun. Oluşturucuya gerek yok."

[rules]
title = "Oynamadan önce"
lead = "Oluşturulan harita da diğerleri gibi bir moddur, ama kendine özgü birkaç kuralı vardır."
"1_title" = "Yalnızca yeni seferler"
"1_text" = "Harita devam eden bir sefere eklenemez. 1337’de yeni bir oyun başlatın."
"2_title" = "Aynı anda tek dünya"
"2_text" = "Yalnızca oynadığınız dünyayı işaretleyin. Oluşturucu öğesi işaretsiz kalır."
"3_title" = "Değiştirmek için yeniden başlatın"
"3_text" = "Başka bir dünyayı oynamadan ya da yüklenmiş bir dünyayı değiştirmeden önce EU5’i tamamen kapatın. Aynı oturumda değiştirmek haritaları karıştırıp oyunu çökertebilir."
"4_title" = "Modu kayıtlarıyla birlikte saklayın"
"4_text" = "Her seferin dünya modunu ve EU5 sürümünü saklayın. Dünya kodu bir tariftir, yedek değildir: oyunun ya da oluşturucunun başka bir sürümü aynı koddan farklı bir dünya çıkarabilir."

[types]
title = "Dünya türleri"
lead = "Dünya türü, hazır bir başlangıç ayarları setidir. Beğendiğiniz şekli seçin, sonra {ui:new_tab.world} sekmesinde ya da {ui:new_tab.advanced} bölümünde ayarlayın."
wall_note = "{ui:control.new_world.wall_allow_gaps} kapalıyken Duvar, gemilerin ne geçebildiği ne de etrafından dolaşabildiği kesintisiz bir engele dönüşür."

[settings]
title = "Kendinize göre"
lead = "Her değer yine oynanabilir bir dünya verir. Bilmeye değer ayarlar şunlardır; {ui:reset_all} değişikliklerinizi geri alır."
seed_title = "{ui:seed} ve {ui:code}"
seed_text = "Tohum dünyayı belirler, {ui:random} ise yeni bir tohum çeker. Dünya kodu tohumu ve tüm ayarları saklar: bir dünyayı paylaşmak için kopyalayın, oluşturmak için bir kod yapıştırın. Aynı kod, aynı oluşturucu sürümü ve aynı oyun dosyalarıyla aynı dünyayı verir."
sketch_title = "{ui:candidates}"
sketch_text = "Bütün dünyayı kurmadan önce altı kara taslağı gösterir. Tohumunu ve ayarlarını almak için birini seçin. Taslaklar karayı açığa çıkarır ve son kıyı çizgisi biraz kayabilir."
draw_title = "Kendi kıtanız"
draw_text = "{ui:land_template} doldurabileceğiniz alanın bir resmini verir. Karayı beyaza, denizi siyaha boyayın ve resmi {ui:land_image} ile yükleyin. Yer şekilleri, nehirler ve halklar sizin çiziminizin üzerinde oluşturulur."
ocean_title = "{ui:control.new_world.expand_oceans}"
ocean_text = "Varsayılan olarak açıktır: kıtalar Amerika kıtalarının eski sınırlarının ötesine taşabilir. Karayı okyanusun ortasına doğru kaydırmak için {ui:new_tab.advanced} bölümünde {ui:control.new_world.centre_permille} değerini artırın."
peoples_title = "Yerli toplumlar"
peoples_text = "Hızlı seçim, {ui:new_tab.world} sekmesindeki {ui:quick.states} ayarıdır. {ui:new_tab.advanced} bölümünde {ui:control.natives.state_share_permille}, yerleşik toprakların ne kadarının devletlere ait olduğunu (%3–60), {ui:control.natives.peasant_peak_permille} ise yerleşik bir konumdaki köylü payının üst sınırını (%30–80) belirler. Verimsiz topraklar daha çok kabile düzeninde kalır."
resources_title = "Kaynaklar"
resources_text = "{ui:new_tab.advanced} bölümünde her kaynağın kendi sıklığı vardır: 1× temel oyunla aynıdır, 0 kaynağı kaldırır. Birinden fazlası, diğerlerine daha az konum bırakır. Her birinin nerede çıkabileceğine yine iklim ve arazi karar verir."

[hidden]
title = "Sürprizi koruyun"
lead = "Yeni dünyalar gizli başlar. Ülke seçiminde Yeni Dünya’nın yerinde Terra Incognita görünür, yine de listeden bir yerli ülke seçebilirsiniz."
covered = "Gizli: Yeni Dünya Terra Incognita’dır"
shown = "Açık: 1337’nin yerli ülkeleri"
reveal_text = "Dünyanın haritalarını oluşturucu içinde açar. Oyun kendi ayarını korur."
show_text = "EU5’teki mod resmini ve ülke seçimi haritasını açar. Bunu {ui:new_tab.output} sekmesinde ya da daha sonra dünyanın {ui:tab.world} sekmesinde, yeniden oluşturmadan ayarlayın; ardından mod menüsünü kapatıp yeniden açın."
atlas = "Açılmış bir dünya, {ui:tab.maps} altında on harita sunar: kara, ülkeler, kültürler, dinler, kaynaklar ve dahası. {ui:compare} iki dünyayı yan yana koyar."

[library]
title = "Dünyalarınız"
lead = "Oluşturduğunuz her şey kodu, haritaları ve notlarıyla birlikte oluşturucunun kütüphanesinde kalır."
versions_title = "{ui:world_versions}"
versions_text = "Hazır bir dünya seçin. {ui:part.peoples.button} aynı kara üzerinde yeni ülkeler, kültürler ve dinler oluşturur; {ui:part.resources.button} yalnızca kaynakları yeniden dağıtır. Önceki sürüm kütüphanede kalır."
queue_title = "Art arda birkaç dünya"
queue_text = "{ui:enqueue} mevcut ayarları bir iş olarak saklar, {ui:run_queue} ise dünyaları birbiri ardına oluşturur. Biri oluşturulurken yenilerini ekleyebilirsiniz."
share_title = "Bir dünyayı paylaşın"
share_text = "Dünya kodunu gönderin ya da haritaları ve notlarıyla bir `.rnworld` dosyası için {ui:export_file} seçeneğini kullanın. Arkadaşınız oynanabilir modu kendi oyunuyla bu dosyadan oluşturur."
move_title = "Bir dünyayı başka bilgisayarınıza taşıyın"
move_text = "{ui:send_built}, hazır modun tamamını başka bir bilgisayarınıza taşımak üzere bir `.rnworld-mod` dosyasına kaydeder. İkisinde de aynı oyun sürümü gerekir."
clean_title = "Temizlik"
clean_text = "{ui:library_remove} dünyaları oyundan çıkarır ama kayıtlarını tutar. {ui:library_delete} onları tamamen siler."

[compat]
title = "Uyumluluk"
game = "Oyun sürümü"
game_text = "EU5 {v:game}. 1.4 dalının yeni yamaları genellikle oluşturucu güncellemesi olmadan çalışır; en son {v:verified} sürümünde tam olarak doğrulandı."
saves = "Kayıtlar"
saves_text = "Yalnızca yeni seferler. Oluşturucuyu güncellemek mevcut dünyaları ve kayıtlarını değiştirmez."
pillars = "Across the Pillars"
pillars_text = "Desteklenir ve isteğe bağlıdır. Yeni Dünya keşifleri ve hazine filoları oluşturulan haritayı kullanır."
refined = "Refined Colonization"
refined_text = "Uyumlu. Yükleme sırası: önce Refined Colonization, sonra dünya modunuz."
multiplayer = "Çok oyunculu"
multiplayer_text = "Desteklenir ve topluluk tarafından test edildi. Her oyuncunun aynı oyun sürümüne, aynı dünya moduna ve aynı diğer modlara ihtiyacı vardır."
ironman = "Tek Şans ve başarımlar"
ironman_text = "Oyunun standart kurallarıyla çalışır."
maps = "Harita elden geçirmeleri"
maps_text = "Amerika kıtalarını değiştiren modlar RNW ile çakışır. Diğer birleşimler test edilmedi."
system = "Sistem"
system_text = "Windows ya da Proton üzerinden Linux ve Steam Deck. macOS desteklenmez."

[help]
title = "Bir şeyler ters giderse"
found_q = "Oluşturucu EU5’i bulamıyor"
found_a = "{ui:settings_title} penceresini açın ve eksik klasörü seçin. EU5’i hiç başlatmadıysanız profilini oluşturması için oyunu bir kez açın, sonra oluşturucuyu yeniden açın."
memory_q = "Bellek yetmiyor"
memory_a = "Oluşturma için yaklaşık 9 GB boş RAM gerekir ve EU5 ana menüde bile 16 GB’ın neredeyse tamamını tutabilir. Oluşturucu açılınca EU5’i kapatın ya da oluşturucuyu oyun olmadan başlatın: Steam’in `steamapps/workshop/content/3450310/3829217331` klasöründedir."
blank_q = "Pencere boş ya da bozuk çiziliyor"
blank_a = "{ui:settings_title} penceresini açın, {ui:settings.classic_window} seçeneğini işaretleyin ve oluşturucuyu yeniden başlatın. Pencere hiç açılmıyorsa programı `--classic` ile başlatın."
classic_q = "Onun yerine daha sade bir pencere açıldı"
classic_a = "Bu klasik penceredir ve ana pencerenin yaptığı her şeyi yapar. Sistemde WebView2 (Windows) ya da WebKitGTK 4.1 (Linux) yoksa, örneğin EU5’in olağan Proton kurulumunda, kendiliğinden açılır."
error_q = "Oluşturma bir hatayla durdu"
error_a = "Mesajı okuyun: sorunun oyun dosyalarında mı, hedef konumda mı, ayarlarda mı yoksa haritada mı olduğunu söyler. Bazı tohum ve ayarlar geçerli bir dünya oluşturamaz; {ui:retry_new_seed} başka bir tohum dener."
blocked_q = "Windows ya da antivirüs oluşturucuyu engelliyor"
blocked_a = "Oluşturucu dijital olarak imzalı değildir, bu yüzden Smart App Control ya da bir antivirüs itiraz edebilir. Yönetici izni gerektirmez. [Sürüm notları](https://github.com/Sir-Starch/eu5-random-new-world/releases) her dosyanın tarama sonuçlarını listeler; bir engellemeyle karşılaşırsanız lütfen GitHub’da bildirin."
picture_q = "Mod menüsü hâlâ eski harita resmini gösteriyor"
picture_a = "Mod menüsünü EU5’in ana menüsünden kapatıp yeniden açın. Dünyanın kendisi değiştiyse oyunu tamamen yeniden başlatın."
library_q = "Dünyalarım nerede saklanıyor?"
library_a = "Mod klasörlerinin dışındaki bir kütüphanede; böylece oluşturucunun her kopyası aynı dünyaları görür. Windows: `%LOCALAPPDATA%\\RandomNewWorld`. Linux: `~/.local/share/random-new-world`. Proton: EU5’in Proton önekindeki Windows konumu."
bug_q = "Bir hata buldum"
bug_a = "Dünya kodunuzla birlikte [GitHub’da bir kayıt açın](https://github.com/Sir-Starch/eu5-random-new-world/issues). {ui:settings_title} içindeki {ui:diagnostics}, oluşturucunun günlüklerini eklenecek tek bir dosyada toplar; hiçbir şey kendiliğinden gönderilmez."

