name: release-artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to validate (vMAJOR.MINOR.PATCH)
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --locked --group dev --group packaging
      - run: uv run pytest -q
      - run: uv run --group packaging python packaging/build.py
      - run: ./dist/RandomNewWorld/RandomNewWorld --self-test
        env:
          QT_QPA_PLATFORM: offscreen
          RNW_DATA: ${{ runner.temp }}/rnw-self-test
      - run: ./dist/RandomNewWorld/RandomNewWorld --cli world-code --seed 42
      - name: Package native application
        run: uv run python packaging/release.py native dist/RandomNewWorld dist/release --tag "$RELEASE_TAG"
      - run: uv build --out-dir dist/source
      - name: Audit source distribution
        shell: bash
        run: |
          for archive in dist/source/*.tar.gz; do uv run python packaging/release.py audit "$archive"; done
      - uses: actions/upload-artifact@v4
        with:
          name: RandomNewWorld-${{ runner.os }}
          path: |
            dist/release/*
            dist/source/*
  windows-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: uv sync --locked --group dev
      - run: uv run python packaging/hub.py
      - name: Package standalone and Workshop layouts
        run: uv run python packaging/release.py windows dist/rnw_exp_hub dist/release --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: RandomNewWorld-Windows
          path: dist/release/*.zip
  windows-test:
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RandomNewWorld-Windows
          path: packages
      - shell: pwsh
        run: |
          Get-ChildItem packages/*.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath expanded }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:RNW_DATA = Join-Path $env:RUNNER_TEMP 'rnw-self-test'
          foreach ($folder in @('RandomNewWorld-Windows', 'rnw_exp_hub')) {
            & "expanded/$folder/generator/python/python.exe" -B -I -X utf8 -m rnw.gui --self-test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "expanded/$folder/generator/python/python.exe" -B -I -X utf8 -m rnw.cli world-code --seed 42
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
