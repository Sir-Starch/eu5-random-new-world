name: check
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: rustup update stable
      - name: Qt system libraries (the window is tested offscreen)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run basedpyright
      - run: uv run pytest -q
      - run: uv run cargo fmt --check
        working-directory: native
      - run: uv run cargo clippy --all-targets -- -D warnings
        working-directory: native
      - run: uv run cargo test
        working-directory: native
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The window's system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - run: make desktop
  package:
    needs: [checks, desktop]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: rustup update stable
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Qt system libraries (the self-test opens the window offscreen) and WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - run: uv sync --locked --group gui --group packaging
      - run: uv run --group packaging python packaging/build.py
      - name: Self-test of the built application (Linux)
        if: runner.os == 'Linux'
        run: ./dist/RandomNewWorld/RandomNewWorld --self-test
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Self-test of the built application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $run = Start-Process -FilePath dist\RandomNewWorld\RandomNewWorld.exe -ArgumentList "--self-test" -Wait -PassThru
          exit $run.ExitCode
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v7
        with:
          name: RandomNewWorld-${{ runner.os }}
          path: dist/RandomNewWorld
          retention-days: 7
