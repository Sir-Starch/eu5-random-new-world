version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: monthly
    groups:
      rust:
        update-types: [minor, patch]
